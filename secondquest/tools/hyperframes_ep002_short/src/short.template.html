    <script>
      const SW = 1080, SH = 1920;
      const ART = /*ART*/;
      const CAPS = /*CAPTIONS*/;
      const $ = (s) => document.querySelector(s);
      const mk = (tag, cls, parent, style) => { const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.setAttribute("style", style); parent.appendChild(e); return e; };
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const R = rng(2002);
      const ease = (k) => { k = Math.min(1, Math.max(0, k)); return k * k * (3 - 2 * k); };

      // place a cut-out in plate px: centre x, feet y, height h (its width follows the art)
      function put(sel, file, cx, feet, h) { const [w0, h0] = ART.sizes[file]; const w = h * w0 / h0; const e = $(sel);
        e.style.left = (cx - w / 2) + "px"; e.style.top = (feet - h) + "px"; e.style.width = w + "px"; e.style.height = h + "px"; return { x: cx - w / 2, y: feet - h, w, h }; }
      // starfields (seeded)
      ["#starsC", "#starsD", "#starsG"].forEach((s, j) => { const host = $(s); for (let i = 0; i < 70; i++) { const r = 1.5 + R() * 3;
        mk("div", "star", host, `left:${R() * 1080}px; top:${R() * 1920}px; width:${r}px; height:${r}px; opacity:${.25 + R() * .6}`); } });

      // layout (plate px; the plates are 2688 x 1512)
      put("#qA", "quest_adult_back.png", 1390, 1580, 820);
      put("#qB", "arms_up.png", 1667, 1436, 907);
      const K = ART.kid;
      for (const s of ["#kidF", "#kidJ"]) { const e = $(s); e.style.left = K.x + "px"; e.style.top = K.y + "px"; e.style.width = K.w + "px"; e.style.height = K.h + "px"; }
      const PIX = put("#pixF", "pixie_point.png", 1085, 1345, 720);
      $("#pixF").style.transformOrigin = "50% 100%";
      put("#youngLook", "young_lookup.png", 1250, 1600, 960);
      put("#youngBack", "young_back.png", 1300, 1420, 380);
      put("#outline", "quest_adult_back.png", 1450, 1425, 640);
      const OLD = put("#older", "older_pad.png", 1660, 1470, 900);

      /* ------------------------------------------------------------------ timeline */
      const tl = gsap.timeline({ paused: true });
      <!--INCLUDE fromto_fix.js-->
      const DUR = {{DUR}};

      // camera: z = zoom over "plate fills the frame height", (fx, fy) = plate px at the frame centre; edges never show
      function view(W0, H0, c) { const s = Math.max(SW / W0, SH / H0) * c.z; let x = SW / 2 - c.fx * s, y = SH / 2 - c.fy * s;
        x = Math.min(0, Math.max(SW - W0 * s, x)); y = Math.min(0, Math.max(SH - H0 * s, y)); return { x, y, scale: s }; }
      function cam(sel, at, dur, c, ez) { const v = view(2688, 1512, c);
        if (dur <= 0) tl.set(sel, v, at); else tl.to(sel, Object.assign(v, { duration: dur, ease: ez || "sine.inOut" }), at); }

          E.d.style.transform = `translateY(${14 * (1 - k)}px) scale(${sc})`;
          let cur = -1; c.w.forEach(([w, a], i) => { if (t >= a - .03) cur = i; });
          E.spans.forEach((sp, i) => { if (c.big) { const kk = Math.min(1, Math.max(0, (t - c.w[i][1] + .03) / .16)); sp.style.opacity = i === 0 || kk > 0 ? 1 : 0;
              sp.style.transform = i === 0 ? "" : `scale(${1.5 - .5 * backOut(kk)})`; }
            else { sp.style.color = i === cur ? "#ffc83d" : "#ffffff";  } }); });
      }
      // the HUD shows only in the game world (A, G-H, K), driven by the clock too
      const HUDON = [[0, {{S1}}], [{{S3}}, {{l18-0.1}}], [{{l19+0.25}}, {{S4}}], [{{S6}}, {{l10.w1-0.05}}]];
      const hudEl = $("#hud");
      const drawHud = (t) => { hudEl.style.opacity = HUDON.some(([a, b]) => t >= a && t < b) ? 1 : 0; };

      /* ---------------- Navi: Python twin of tools/fx/fairy.py (glow, trail, flapping wings, white core) */
      const NK = [];      // [t, x, y, r, op] in screen px
      const key = (t, x, y, r, op) => NK.push([t, x, y, r, op === undefined ? 1 : op]);
      const orbit = (t0, t1, cx, cy, rx, ry, turns, r, a0) => { const n = Math.max(3, Math.round((t1 - t0) / .12)); for (let i = 0; i <= n; i++) { const k = i / n, a = (a0 || 0) + 2 * Math.PI * turns * k;
        key(t0 + (t1 - t0) * k, cx + rx * Math.cos(a), cy - ry * Math.sin(a), r); } };
      key(0, 640, 1000, 20); key(.6, 620, 960, 20); key({{l07.w6-0.12}}, 610, 940, 20); key({{l07.w6-0.06}}, 610, 940, 20, 0);
      key({{l08.w1-0.1}}, 760, 560, 26, 0); key({{l08.w1+0.05}}, 760, 560, 26, 1); key({{S1-0.05}}, 820, 520, 26, 1); key({{S1}}, 820, 520, 22, 0);
      key({{l03.w3-0.3}}, 620, 380, 20, 0); key({{l03.w3}}, 620, 380, 20, 1);
      orbit({{l03.w3+0.1}}, {{l03.w6-0.25}}, 540, 470, 330, 130, 1.25, 20);
      key({{l03.w6-0.1}}, 900, 300, 20, 0); key({{l04+0.15}}, 760, 520, 20, 0);
      orbit({{l04+0.3}}, {{S2-0.05}}, 540, 860, 430, 230, 1.6, 18);
      key({{S2}}, 540, 600, 18, 0); key({{S2+0.3}}, 540, 600, 18, 1);
      orbit({{S2+0.4}}, {{l11.w14-0.2}}, 540, 860, 470, 170, 1.4, 18, 1.57);
      key({{l11.w14+0.1}}, 540, 860, 12, 1); key({{l12-0.15}}, 540, 870, 3, 0);
      key({{l15.w6-0.4}}, 300, 300, 20, 0); key({{l15.w6-0.3}}, 380, 330, 20, 1);
      orbit({{l15.w6-0.2}}, {{S3-0.15}}, 690, 440, 170, 70, 1.3, 20);
      key({{S3-0.05}}, 690, 440, 20, 0); key({{S3+0.2}}, 760, 560, 22, 0); key({{S3+0.35}}, 760, 560, 22, 1); key({{l17.w8-0.15}}, 730, 520, 22, 1);
      key({{l17.w8+1.0}}, 640, 960, 13, 1); key({{l18-0.15}}, 640, 960, 13, 1); key({{l18-0.05}}, 640, 960, 13, 0);
      key({{l19+0.25}}, 660, 760, 18, 0); key({{l19+0.4}}, 660, 760, 18, 1); key({{S4-0.1}}, 640, 700, 18, 1); key({{S4}}, 640, 700, 18, 0);
      key({{S6+0.1}}, 760, 520, 22, 0); key({{S6+0.3}}, 760, 520, 22, 1); key({{l09.w6}}, 650, 800, 20, 1); key({{l10.w1-0.1}}, 610, 1060, 18, 1);
      key({{l10.w1+0.45}}, 1000, 640, 28, 1);
      orbit({{l10.w1+0.55}}, {{l10.end+0.15}}, 540, 650, 470, 175, 1.25, 28, 0);
      key(T_STAR, STAR.x, STAR.y, 24, 1); key(T_STAR + .12, STAR.x, STAR.y, 14, 0);
      NK.sort((a, b) => a[0] - b[0]);
      function naviPath(t) {
        if (t <= NK[0][0]) return NK[0].slice(1); if (t >= NK[NK.length - 1][0]) return NK[NK.length - 1].slice(1);
        let i = 0; while (i < NK.length - 2 && t > NK[i + 1][0]) i++;
        const p0 = NK[Math.max(0, i - 1)], p1 = NK[i], p2 = NK[i + 1], p3 = NK[Math.min(NK.length - 1, i + 2)];
        const k = (t - p1[0]) / Math.max(1e-6, p2[0] - p1[0]), u = k * k * (3 - 2 * k);
        const cr = (a, b, c, d) => .5 * (2 * b + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (-a + 3 * b - 3 * c + d) * u * u * u);
        return [cr(p0[1], p1[1], p2[1], p3[1]), cr(p0[2], p1[2], p2[2], p3[2]), p1[3] + (p2[3] - p1[3]) * k, p1[4] + (p2[4] - p1[4]) * k]; }
      const at = (t) => { const [x, y, r, op] = naviPath(t); return [x + .4 * .012 * SH * Math.sin(t * 2.3) * .5, y + .012 * SH * .5 * Math.sin(t * 3.7), r, op]; };
      const ctx = $("#navi").getContext("2d");
      function drawNavi(t) {
        ctx.clearRect(0, 0, SW, SH);
        const [x, y, r, op] = at(t); if (op <= .01) return;
        const s = r / 30, col = [120, 195, 255];
        const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2);
        g.addColorStop(0, `rgba(${col},${.95 * op})`); g.addColorStop(.35, `rgba(${col},${.45 * op})`); g.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, 7); ctx.fill();
        for (let k = 0; k < 10; k++) { const [qx, qy, , qo] = at(t - (k + 1) * .045); const rr = (4.5 - 3 * k / 10) * s * 1.6;
          ctx.fillStyle = `rgba(255,255,255,${op * Math.min(1, qo + .2) * .55 * (1 - k / 10)})`; ctx.beginPath(); ctx.arc(qx, qy, rr, 0, 7); ctx.fill(); }
        const f = .6 + .4 * Math.sin(t * 6.4 * 2 * Math.PI);
        for (const sx of [-1, 1]) {
          ctx.fillStyle = `rgba(230,245,255,${.55 * op})`; ctx.beginPath(); ctx.ellipse(x + sx * 16.5 * s, y - (3 + 13 * f) * s, 13.5 * s, (1 + 13 * f) * s, 0, 0, 7); ctx.fill();
          ctx.fillStyle = `rgba(230,245,255,${.4 * op})`; ctx.beginPath(); ctx.ellipse(x + sx * 16.5 * s, y + (3 + 7 * f) * s, 5.5 * s, (1 + 7 * f) * s, 0, 0, 7); ctx.fill(); }
        ctx.fillStyle = `rgba(255,255,255,${op})`; ctx.beginPath(); ctx.arc(x, y, 9 * s, 0, 7); ctx.fill();
      }

      // one clock drives the procedural layers (Navi, the walk): deterministic at every seek
      const env = { t: 0 };
      tl.fromTo(env, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => { drawNavi(env.t); walkAt(env.t); drawCaps(env.t); drawHud(env.t); } }, 0);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
