<!doctype html>

    <style>
      /* 1080 x 1920. Shorts UI: nothing that matters below y 1520 or right of x 930. Storyboard:
         docs/publish/EP001/SHORT3_STORYBOARD_v2.md. Comedy = dunkey timing: deadpan holds, hard cuts ON the word,
         snap zooms on faces, one awkward silence. The last frame IS frame 0 (seamless loop). */
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; }
      :root { --gold: #ffd23f; --ink: #16121f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{RW}}px; height: {{RH}}px; overflow: hidden; background: #16121f; }
      #root { position: relative; width: {{RW}}px; height: {{RH}}px; overflow: hidden; font-family: "Inter", sans-serif; }
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform: scale({{RK}}); transform-origin: 0 0; overflow: hidden; }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .abs { position: absolute; display: block; }
      .shot { overflow: hidden; background: #16121f; }
      .cam { position: absolute; inset: 0; transform-origin: 0 0; }
      .stack { position: absolute; }
      .stack img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; opacity: 0; }
      .stack img.on { opacity: 1; }
      .shadow { position: absolute; border-radius: 50%; background: radial-gradient(ellipse, rgba(20,14,8,.55) 0%, rgba(20,14,8,0) 70%); }
      .shade { background: linear-gradient(180deg, rgba(10,8,20,.6) 0%, rgba(10,8,20,.2) 35%, rgba(10,8,20,0) 55%, rgba(10,8,20,.3) 100%); }
      .hook { position: absolute; left: 0; width: 1080px; top: 0; height: 900px; }
      .hook div { position: absolute; left: 0; width: 1080px; text-align: center; font-family: "Anton", sans-serif; line-height: 1.08;
        -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 var(--ink), 0 18px 30px rgba(0,0,0,.5); }
      .hook .w { top: 236px; color: #fff; font-size: 120px; }
      .hook .g { top: 560px; color: var(--gold); font-size: 240px; line-height: 1; }
      .cap { position: absolute; left: 90px; width: 840px; text-align: center; font: 800 76px/1.14 "Inter", sans-serif; color: #fff; word-spacing: .1em;
        -webkit-text-stroke: 14px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink); visibility: hidden; transform-origin: 50% 50%; }
      .cap span { display: inline-block; }
      #cardT { position: absolute; left: 0; width: 1080px; top: 240px; text-align: center; font-family: "Anton", sans-serif; line-height: 1.04;
        -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 var(--ink); }
      #cardT div { position: absolute; left: 0; width: 1080px; }
      #cardT .w { top: 0; color: #fff; font-size: 104px; }
      #cardT .g { top: 470px; color: var(--gold); font-size: 168px; line-height: 1; }
      #wm { position: absolute; left: 160px; top: 1100px; width: 760px; height: 190px; }
      #wm img { position: absolute; left: 0; top: 0; width: 760px; height: 131px; filter: drop-shadow(0 7px 0 #16161f); }
      #wmBar { position: absolute; left: 130px; top: 156px; width: 500px; height: 14px; background: var(--gold); border-radius: 7px; box-shadow: 0 5px 0 var(--ink); transform-origin: 50% 50%; }
      #fullEp { position: absolute; left: 0; width: 1080px; top: 1330px; text-align: center; font: 800 64px "Inter", sans-serif; color: #fff;
        letter-spacing: .08em; -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; }
      #bolt { position: absolute; left: 0; top: 0; width: 1080px; height: 900px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-fps="30" data-width="{{RW}}" data-height="{{RH}}">

      <div id="stage"><div id="shake" class="full">

      <!-- 1 · FRAME 0 · "Farming Simulator is a game where you…" -->
      <div id="shF0" class="full shot clip" data-start="0" data-duration="{{l01.w8-0.05}}" data-track-index="1"><div class="cam" id="cF0"></div></div>

      <!-- 2 · "wake up..." · his bed, the alarm clock rattling on the pillow -->
      <div id="shBed" class="full shot clip" data-start="{{l01.w8-0.05}}" data-duration="{{l02-0.05-l01.w8+0.05}}" data-track-index="2"><div class="cam" id="cBed">
        <img class="full" src="assets/bedroom.jpg" alt="" />
        <img class="abs" id="bed" src="assets/q_bed.png" alt="quest" data-role="character" style="left: 23px; top: 1085px; width: 1700px; height: 1129px" />
        <div class="shadow" style="left: 110px; top: 1260px; width: 190px; height: 32px"></div>
        <img class="abs" id="clock" src="assets/alarm.png" alt="" style="left: 100px; top: 1065px; width: 210px; height: 210px; transform-origin: 50% 100%" />

      <!-- 3 · "go to work..." · the office, deadpan typing -->
      <div id="shOff" class="full shot clip" data-start="{{l02-0.05}}" data-duration="{{l03-0.05-l02+0.05}}" data-track-index="3"><div class="cam" id="cOff">
        <img class="full" src="assets/office.jpg" alt="" />
        <img class="abs" id="desk1" src="assets/q_desk.png" alt="quest" data-role="character" style="left: -40px; top: 860px; width: 1150px; height: 920px" />
      </div></div>

      <!-- 4 · "make money..." · the paycheck; the wallet pops in, happy -->
      <div id="shPay" class="full shot clip" data-start="{{l03-0.05}}" data-duration="{{l04-0.05-l03+0.05}}" data-track-index="4"><div class="cam" id="cPay">
        <img class="full" src="assets/office.jpg" alt="" style="transform: scale(1.35); transform-origin: 80% 70%" />
        <div class="full" style="background: rgba(10,8,20,.18)"></div>
        <div class="shadow" style="left: 70px; top: 1790px; width: 640px; height: 70px"></div>
        <img class="abs" id="pay" src="assets/q_paycheck.png" alt="quest" data-role="character" style="left: -320px; top: 409px; width: 1442px; height: 1442px" />
        <div class="shadow" style="left: 640px; top: 1790px; width: 300px; height: 44px"></div>
        <div class="stack" id="walPay" data-role="character" style="left: 615px; top: 1470px; width: 340px; height: 340px; transform-origin: 50% 100%"><img class="on" src="assets/wallet_happy.png" alt="wallet" /></div>

      <!-- 5 · "buy extremely expensive equipment..." · the tractor slams down; the wallet: shock, then out cold -->
      <div id="shDeal" class="full shot clip" data-start="{{l04-0.05}}" data-duration="{{l11-0.28-l04+0.05}}" data-track-index="5"><div class="cam" id="cDeal">
        <img class="full" src="assets/dealership.jpg" alt="" />
        <div class="shadow" id="trSh" style="left: 470px; top: 985px; width: 520px; height: 50px"></div>

        <div class="shadow" style="left: 50px; top: 1660px; width: 300px; height: 44px"></div>
        <div class="stack" id="walDeal" data-role="character" style="left: 30px; top: 1340px; width: 340px; height: 340px; transform-origin: 50% 100%">
          <img class="on" src="assets/wallet_happy.png" alt="wallet" /><img src="assets/wallet_shock.png" alt="wallet" /><img src="assets/wallet_fainted.png" alt="wallet" /></div>
      </div></div>

      <!-- 6 · "Most of the time, your greatest enemy..." · mock-epic hero shot, the sky turns, lightning -->
      <div id="shEpic" class="full shot clip" data-start="{{l11-0.28}}" data-duration="{{l12-0.26-l11+0.28}}" data-track-index="6"><div class="cam" id="cEpic">
        <img class="full" src="assets/golden.jpg" alt="" />

        <svg id="bolt" viewBox="0 0 1080 900"><path d="M985 0 L915 250 L990 262 L830 470 L890 462 L700 668" fill="none" stroke="#fffbe6" stroke-width="16" stroke-linejoin="round"/></svg>
        <img class="abs" id="hero" src="assets/q_heroic.png" alt="quest" data-role="character" style="left: 90px; top: 640px; width: 903px; height: 1209px" />

      <!-- 7 · "...is a field that's slightly larger than you expected." · the pull-out; then the awkward silence -->
      <div id="shField" class="full shot clip" data-start="{{l12-0.26}}" data-duration="{{l05-0.12-l12+0.26}}" data-track-index="7"><div class="cam" id="cField">
        <img class="abs" src="assets/field_big.jpg" alt="" style="left: -1180px; top: 0; width: 3440px; height: 1920px" />
        <div class="shadow" style="left: 488px; top: 1150px; width: 110px; height: 14px"></div>
        <img class="abs" id="qtSmall" src="assets/quest_on_tractor.png" alt="quest" data-role="character" style="left: 486px; top: 1078px; width: 110px; height: 82px" />
      </div></div>

      <!-- 8a · "and then..." · close on Quest on his tractor; freeze frame on the scratch -->
      <div id="shThen" class="full shot clip" data-start="{{l05-0.12}}" data-duration="{{l06-0.05-l05+0.12}}" data-track-index="8"><div class="cam" id="cThen">
        <img class="abs" src="assets/field_big.jpg" alt="" style="left: -2400px; top: -1400px; width: 6880px; height: 3840px; filter: blur(5px)" />
        <div class="shadow" style="left: 0px; top: 1540px; width: 1080px; height: 90px"></div>
        <img class="abs" id="qtBig" src="assets/quest_on_tractor.png" alt="quest" data-role="character" style="left: -520px; top: 830px; width: 1500px; height: 1117px" />
        <div class="full" id="freeze" style="background: rgba(40,40,50,.0); mix-blend-mode: saturation"></div>
      </div></div>

      <!-- 8b · "go back to work." · hard cut back to the desk; snap zoom on his face -->
      <div id="shWork" class="full shot clip" data-start="{{l06-0.05}}" data-duration="{{VEND+0.25-l06+0.05}}" data-track-index="9"><div class="cam" id="cWork">
        <img class="full" src="assets/office.jpg" alt="" />
        <img class="abs" id="desk2" src="assets/q_desk.png" alt="quest" data-role="character" style="left: -40px; top: 860px; width: 1150px; height: 920px" />
      </div></div>

      <!-- 9 · END CARD · YOU ALREADY HAVE A JOB. WHY GET A SECOND ONE? + SecondQuest; the wallet, recovered, on the wordmark -->
      <div id="shCard" class="full shot clip" data-start="{{VEND+0.25}}" data-duration="{{DUR-1.0-VEND-0.25}}" data-track-index="10">
        <img class="full" src="assets/f0_bg.jpg" alt="" />
        <div class="full" style="background: rgba(12,10,24,.62)"></div>
        <div id="cardT"><div class="w" id="cA">YOU ALREADY<br>HAVE A JOB.</div><div class="w" id="cB" style="top: 290px">WHY GET A</div><div class="g" id="cC">SECOND ONE?</div></div>
        <div id="wm"><img src="assets/wordmark.png" alt="SecondQuest" /><div id="wmBar"></div></div>
        <div class="stack" id="walC" style="left: 615px; top: 896px; width: 220px; height: 220px; transform-origin: 50% 100%"><img class="on" src="assets/wallet_happy.png" alt="" /></div>
        <div id="fullEp">FULL EPISODE ↓</div>
      </div>

      <!-- 10 · LOOP SEAM · the alarm rings, frame 0 recomposes; last frame = frame 0 -->
      <div id="shLoop" class="full shot clip" data-start="{{DUR-1.0}}" data-duration="1.0" data-track-index="11"><div class="cam" id="cLoop"></div></div>

      <div id="caps" class="full clip" data-role="caption" data-start="0" data-duration="{{DUR}}" data-track-index="20"></div>
      <div id="flash" class="full clip" data-start="0" data-duration="{{DUR}}" data-track-index="21" style="background: #fffaf0; opacity: 0"></div>
      </div></div>
    </div>

    <script>
      const ART = /*ART*/;
      const CAPS = /*CAPTIONS*/;
      const $ = (s) => document.querySelector(s);
      const mk = (tag, cls, parent, style) => { const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.setAttribute("style", style); parent.appendChild(e); return e; };
      const tl = gsap.timeline({ paused: true });
      <!--INCLUDE fromto_fix.js-->
      const DUR = {{DUR}};
      const flash = (at, a, d) => tl.fromTo("#flash", { opacity: a }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, at);
      const shake = (at, amp) => tl.fromTo("#shake", { x: 0, y: 0 }, { keyframes: [[amp, -amp * .6], [-amp * .7, amp * .5], [amp * .4, -amp * .3], [0, 0]].map(([x, y]) => ({ x, y, duration: .045 })), immediateRender: false }, at);
      const swap = (stack, i, at) => { $(stack).querySelectorAll("img").forEach((im, k) => tl.set(im, { opacity: k === i ? 1 : 0 }, at)); };
      // a camera view: zoom z centred on point (fx, fy) of the 1080x1920 shot, placed at screen (sx, sy)
      const view = (z, fx, fy, sx, sy) => {                                 // clamped: a zoom never shows past the plate's edge
        const x = (sx ?? 540) - z * fx, y = (sy ?? 960) - z * fy;
        return { scale: z, x: Math.min(0, Math.max(1080 - 1080 * z, x)), y: Math.min(0, Math.max(1920 - 1920 * z, y)) }; };
      const breathe = (sel, a, b, v0, v1) => tl.fromTo(sel, v0, Object.assign({}, v1, { duration: b - a, ease: "sine.inOut", immediateRender: false }), a);
      const snap = (sel, at, v) => tl.to(sel, Object.assign({}, v, { duration: .09, ease: "power4.out" }), at);   // dunkey snap zoom

      /* ---- frame 0 (built twice: the opening and the loop seam, identical at rest) */
      function frame0(host, s) {
        host.innerHTML = `
          <img class="full" src="assets/f0_bg.jpg" alt="" />
          <div class="full shade"></div>
          <div class="shadow" style="left: 395px; top: 1490px; width: 660px; height: 80px"></div>
          <img class="abs" src="assets/tractor_huge.png" alt="" style="left: 385px; top: 1030px; width: 680px; height: 510px" />
          <img class="abs" id="qx${s}" src="assets/q_exhausted.png" alt="quest" data-role="character" style="left: -590px; top: 735px; width: 1756px; height: 1756px" />
          <div class="hook" id="hook${s}"><div class="w">A GAME ABOUT<br>GOING TO</div><div class="g">WORK?</div></div>`;
      }
      frame0($("#cF0"), "0"); frame0($("#cLoop"), "L");
      const T1 = {{l01.w8-0.05}};
      breathe("#cF0", 0, T1, view(1, 540, 960), view(1.03, 520, 1000));

      /* ---- 2 bed: the clock rattles from the cut; snap zoom on his face on "up" */
      const T2 = T1;
      tl.set("#cBed", view(1, 540, 960), T2);
      tl.fromTo("#clock", { rotation: 0 }, { keyframes: Array.from({ length: 12 }, (_, i) => ({ rotation: i % 2 ? -7 : 7, duration: .04 })).concat([{ rotation: 0, duration: .05 }]), immediateRender: false }, T2);
      snap("#cBed", {{l01.w9}}, view(1.45, 400, 1200));

      /* ---- 3 office: deadpan; snap zoom on "work..." */
      const T3 = {{l02-0.05}};
      breathe("#cOff", T3, {{l02.w3}}, view(1, 540, 960), view(1.03, 520, 980));
      snap("#cOff", {{l02.w3}}, view(1.6, 380, 980));

      /* ---- 4 paycheck: the wallet pops up on "money" (squash, stretch, settle) */
      const T4 = {{l03-0.05}};
      breathe("#cPay", T4, {{l04-0.05}}, view(1, 540, 960), view(1.03, 540, 940));
      tl.set("#walPay", { scaleY: 0, scaleX: 0 }, 0);
      tl.fromTo("#walPay", { scaleY: 0, scaleX: 0 }, { keyframes: [{ scaleY: 1.2, scaleX: .85, duration: .12, ease: "power3.out" }, { scaleY: .9, scaleX: 1.08, duration: .08 }, { scaleY: 1, scaleX: 1, duration: .18, ease: "power2.out" }], immediateRender: false }, {{l03.w2}});

      /* ---- 5 dealership: the tractor drops on "buy", the wallet gasps on "expensive", faints on "equipment..." */
      const T5 = {{l04-0.05}};
      breathe("#cDeal", T5, {{l04.w3}}, view(1, 540, 960), view(1.03, 555, 985));
      tl.set("#trHuge", { y: -1700 }, 0); tl.set("#trSh", { opacity: 0 }, 0);
      tl.fromTo("#trHuge", { y: -1700 }, { y: 0, duration: .2, ease: "power3.in", immediateRender: false }, {{l04.w1}});
      tl.fromTo("#trHuge", { scaleY: 1, scaleX: 1 }, { keyframes: [{ scaleY: .9, scaleX: 1.05, duration: .06 }, { scaleY: 1.03, scaleX: .99, duration: .1 }, { scaleY: 1, scaleX: 1, duration: .2 }], immediateRender: false }, {{l04.w1}} + .2);
      tl.fromTo("#trSh", { opacity: 0 }, { opacity: 1, duration: .15, immediateRender: false }, {{l04.w1}} + .08);
      shake({{l04.w1}} + .2, 22); flash({{l04.w1}} + .2, .25, .2);
      tl.fromTo("#walDeal", { y: 0 }, { keyframes: [{ y: -60, duration: .14, ease: "power2.out" }, { y: 0, duration: .16, ease: "power2.in" }], immediateRender: false }, {{l04.w1}} + .24);   // the slam bounces the wallet
      swap("#walDeal", 1, {{l04.w3}});
      snap("#cDeal", {{l04.w3}}, view(1.6, 260, 1420));                     // snap onto the wallet's face on "expensive"
      swap("#walDeal", 2, {{l04.end+0.05}});
      tl.to("#cDeal", Object.assign(view(1.68, 260, 1440), { duration: {{l11-0.28}} - {{l04.end+0.05}}, ease: "sine.inOut" }), {{l04.end+0.05}});   // stay on it: out cold (critic v1/v2: the faint reads at phone size)

      /* ---- 6 epic: the sky turns on "greatest", lightning on "enemy" */
      const T6 = {{l11-0.28}};
      breathe("#cEpic", T6, {{l11.w7}}, view(1, 540, 1000), view(1.12, 600, 820));   // the slow heroic push... hard stop on the lightning
      tl.fromTo("#storm", { opacity: 0 }, { opacity: 1, duration: .6, ease: "power2.inOut", immediateRender: false }, {{l11.w6}});
      tl.fromTo("#bolt", { opacity: 0 }, { keyframes: [{ opacity: 1, duration: .03 }, { opacity: .2, duration: .06 }, { opacity: 1, duration: .03 }, { opacity: 0, duration: .25 }], immediateRender: false }, {{l11.w7}});
      flash({{l11.w7}}, .55, .3);

      /* ---- 7 field: start close on the tractor, pull out on "field..." to the whole field by "expected."; hold */
      const T7 = {{l12-0.26}};
      const QX = 541, QY = 1120;
      tl.fromTo("#cField", view(4, QX, QY), Object.assign(view(4.2, QX, QY), { duration: {{l12.w3}} - T7, ease: "sine.inOut", immediateRender: false }), T7);
      tl.to("#cField", Object.assign(view(1.2, QX, 900), { duration: {{l12.end}} - {{l12.w3}}, ease: "power2.inOut" }), {{l12.w3}});   // ends a bit tight: he stays visible at feed size

      /* ---- 8a "and then...": close on him, hopeful; the freeze on the scratch */
      const T8 = {{l05-0.12}};
      breathe("#cThen", T8, {{l05.w2.end+0.02}}, view(1, 540, 1100), view(1.05, 560, 1080));
      tl.set("#cThen", { filter: "saturate(1) contrast(1)" }, 0);
      tl.set("#cThen", { filter: "saturate(.25) contrast(1.15)" }, {{l05.w2.end+0.02}});

      /* ---- 8b "go back to work.": hard cut; snap zoom on his dead face on "work." */
      const T9 = {{l06-0.05}};
      tl.set("#cWork", view(1.12, 430, 1150), T9);
      snap("#cWork", {{l06.w4}}, view(2.1, 380, 980));

      /* ---- 9 card */
      const TC = {{VEND+0.25}};
      tl.fromTo("#cA", { opacity: 0 }, { opacity: 1, duration: .1 }, TC);
      tl.fromTo("#cB", { opacity: 0 }, { opacity: 1, duration: .12 }, TC + .25);   // the question lands a beat later
      tl.fromTo("#cC", { opacity: 0, scale: .8 }, { opacity: 1, scale: 1, duration: .2, ease: "back.out(2)", transformOrigin: "50% 50%" }, TC + .42);
      tl.fromTo("#wm", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .25, ease: "power2.out" }, TC + .62);
      tl.fromTo("#wmBar", { scaleX: 0 }, { scaleX: 1, duration: .25, ease: "power2.out" }, TC + .68);
      tl.fromTo("#walC", { y: -70, opacity: 0 }, { keyframes: [{ opacity: 1, duration: .05 }, { y: 0, duration: .2, ease: "power2.in" }] }, TC + .8);
      tl.fromTo("#walC", { scaleY: 1, scaleX: 1 }, { keyframes: [{ scaleY: .78, scaleX: 1.15, duration: .06 }, { scaleY: 1.05, scaleX: .97, duration: .12 }, { scaleY: 1, scaleX: 1, duration: .2 }], immediateRender: false }, TC + 1.0);
      tl.fromTo("#fullEp", { opacity: 0 }, { opacity: 1, duration: .2 }, TC + 1.05);
      tl.fromTo("#fullEp", { y: 0 }, { y: 10, duration: .25, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, TC + 1.3);

      /* ---- 10 loop seam: the alarm shakes the frame, the hook grows in; at rest = frame 0 before the last frame */
      const TL = DUR - 1.0;
      tl.fromTo("#cLoop", view(1.04, 540, 960), Object.assign(view(1, 540, 960), { duration: .85, ease: "power2.out", immediateRender: false }), TL);
      tl.set("#hookL", { opacity: 0 }, 0);
      tl.fromTo("#hookL", { opacity: 0, scale: .82 }, { keyframes: [{ opacity: 1, scale: 1.04, duration: .14, ease: "power3.out" }, { scale: 1, duration: .22, ease: "power2.out" }], transformOrigin: "50% 50%", immediateRender: false }, TL + .2);
      shake(DUR - .95, 6);                                                   // the alarm goes off (rings to the last frame)

      /* ---- captions */
      const CAPEL = CAPS.map((c) => { const d = mk("div", "cap", $("#caps"), `top: ${c.top}px`);
        const spans = c.w.map(([w], i) => { if (i) d.appendChild(document.createTextNode(" ")); const s = mk("span", "", d); s.textContent = w; return s; });
        return { d, spans, c, on: false }; });
      function drawCaps(t) {
        CAPEL.forEach((E) => { const c = E.c, on = t >= c.a && t < c.e;
          if (on !== E.on) { E.d.style.visibility = on ? "visible" : "hidden"; E.on = on; }
          if (!on) return;
          const k = Math.min(1, (t - c.a) / .14), e = 1 - Math.pow(1 - k, 3);
          E.d.style.transform = `translateY(${10 * (1 - e)}px) scale(${.94 + .06 * e})`;
          let cur = -1; c.w.forEach(([w, a], i) => { if (t >= a - .03) cur = i; });
          E.spans.forEach((sp, i) => { sp.style.color = i === cur ? "#ffd23f" : "#ffffff"; }); });
      }
      const env = { t: 0 };
      tl.fromTo(env, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => drawCaps(env.t) }, 0);
      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
