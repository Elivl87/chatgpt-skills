      /* v2 layout grid (1080 x 1920, docs/style/DESIGN_RUBRIC.md):
         HUD band y 120-300 (game world only) · TITLE zone y 330-560 · characters/focal y 560-1300 ·
         CAPTION band y 1340-1500 · nothing that matters below y 1536 (Shorts UI) or right of x 918 (action rail).
         Every text block is centred on one axis, x = 491 (the centre of the text-safe column 65-918). */
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; }
      :root { --gold: #ffc83d; --ink: #16161f; --axis: 491px; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #16161f; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", sans-serif; }
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform: scale(1.0); transform-origin: 0 0; overflow: hidden; }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .abs { position: absolute; }
      .shot { overflow: hidden; background: #16161f; }
      .breath { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 2688px; height: 1512px; }
      .cam > img.plate { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
      /* a character: a box in plate px (feet = bottom centre), its poses stacked inside, a soft contact shadow */
      .chr { position: absolute; transform-origin: 50% 100%; }
      .chr img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; opacity: 0; }
      .chr img.on { opacity: 1; }
      .chr .foot { position: absolute; left: 6%; width: 88%; bottom: -3.2%; height: 6.4%; border-radius: 50%;
        background: radial-gradient(ellipse, rgba(24,20,12,.55) 0%, rgba(24,20,12,.25) 45%, rgba(24,20,12,0) 72%); }
      .big { font-family: "Anton", sans-serif; color: var(--gold); -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill;
        text-shadow: 6px 8px 0 var(--ink); line-height: 1.0; white-space: nowrap; letter-spacing: .01em; }
      /* the one title style: opening hook and its callback on l60 */
      .ttl { position: absolute; left: 65px; width: 853px; top: 330px; text-align: center; }
      .ttl .ln { display: block; overflow: hidden; padding: 6px 30px 14px; margin-bottom: -14px; }   /* mask-up line reveal (kinetic-typography) */
      .ttl .big { display: inline-block; }
      .ttl .a { font-size: 92px; color: #fff; }
      .ttl .b { font-size: 112px; }
      #hud img { position: absolute; display: block; }
      /* captions: Shorts standard, word by word, on the text axis, inside x 6-85 % and above the bottom UI */
      .cap { position: absolute; left: 81px; width: 820px; top: 1340px; text-align: center; font: 800 74px/1.14 "Inter", sans-serif;
        color: #fff; word-spacing: .1em; -webkit-text-stroke: 14px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink);
        visibility: hidden; transform-origin: 50% 50%; }
      .cap.bigc { font-size: 132px; top: 1310px; color: var(--gold); }
      .cap span { display: inline-block; }
      /* A · the empty speech bubble: a comic balloon whose tail ends at the silent hero's mouth (it lives in the plate) */
      #bub { position: absolute; transform-origin: 92% 100%; }
      #bub svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #dots { position: absolute; left: 0; width: 100%; text-align: center; font: 800 150px/1 "Inter", sans-serif; color: #2a2a36; letter-spacing: .1em; }
      #dots i { font-style: normal; display: inline-block; }
      /* B · the sun and the birds */
      .bird { position: absolute; width: 46px; height: 20px; }
      .bird svg { width: 100%; height: 100%; overflow: visible; }
      .leaf { position: absolute; width: 40px; height: 22px; border-radius: 50% 0; background: #6fae3e; border: 3px solid #2c4a1c; }
      /* E · the old camera: a viewfinder drawn on the frame itself + the low-poly rock it clips into */
      #vf { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #vf svg { width: 100%; height: 100%; overflow: visible; }
      #rock { position: absolute; left: 0; top: 0; width: 900px; height: 1920px; }
      #rock svg { width: 100%; height: 100%; }
      /* wordmark + end card */
      #wm { position: absolute; left: 90px; top: 690px; width: 900px; height: 240px; transform-origin: 50% 32%; }
      #wm img { position: absolute; left: 0; top: 0; width: 900px; height: 155px; filter: drop-shadow(0 7px 0 #16161f) drop-shadow(0 0 30px rgba(22,22,31,.5)); }
      #wmBar { position: absolute; left: 150px; top: 182px; width: 600px; height: 13px; background: var(--gold); border-radius: 7px; box-shadow: 0 5px 0 var(--ink); transform-origin: 50% 50%; }
      #twinkle { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      #twinkle .g { position: absolute; left: -130px; top: -130px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(255,244,210,.95) 0%, rgba(255,230,160,.45) 35%, rgba(255,220,150,0) 70%); }
      #twinkle svg { position: absolute; left: -70px; top: -70px; width: 140px; height: 140px; overflow: visible; }
      #cT { position: absolute; left: 372px; width: 546px; top: 560px; text-align: center; }
      #cT span { display: block; }
      #cT .a { font-size: 96px; color: #fff; }
      #cT .b { font-size: 76px; margin-top: 6px; }
      #thumbBox { position: absolute; left: 64px; top: 930px; width: 880px; height: 495px; border: 10px solid var(--ink); border-radius: 26px; overflow: hidden;
        box-shadow: 10px 14px 0 var(--ink); background: #000; }
      #thumbBox img { width: 100%; height: 100%; display: block; }
      #pixCard { position: absolute; }
      #pixCard img { position: absolute; inset: 0; width: 100%; height: 100%; }
      #pixCard .foot { position: absolute; left: 4%; width: 92%; bottom: -3%; height: 5%; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 72%); }
    </style>

      cam("#camF", 32.45, 0, { z: 1.42, fx: 1428, fy: 1000 });
      cam("#camF", 32.45, 1.08, { z: 1.45, fx: 1430, fy: 1000 }, "none");
      cam("#camF", 33.59, .32, { z: 1.85, fx: 1525, fy: 1010 }, "power3.out");          // "Probably.": in on her
      breathe("#brF", 32.45, 34.53, .5);
      bob("#qF", 32.86, 12); bob("#pF", 32.91, 14);
      pose("#pF", "#pF_d", "#pF_e", 33.61);
      tl.fromTo("#pF", { rotation: 0 }, { rotation: -2.5, duration: .4, ease: "sine.inOut", yoyo: true, repeat: 1, transformOrigin: "50% 100%", immediateRender: false }, 33.93);

      /* ---------------- G · the memory quietly "improves" (the rebuild scan, callback to l49); the title returns */
      cam("#camG", 34.41, 0, { z: 1.06, fx: 1420, fy: 990 });
      cam("#camG", 34.41, 5.78, { z: 1.16, fx: 1430, fy: 980 }, "sine.inOut");
      breathe("#brG", 34.41, 40.31, .3);
      tl.fromTo("#scanG", { y: -14, opacity: .9 }, { y: 1930, opacity: .9, duration: 2.0, ease: "sine.inOut" }, 35.09);
      tl.to("#gNew", { clipPath: "inset(0px 0px 0px 0px)", duration: 2.0, ease: "sine.inOut" }, 35.09);
      tl.set("#scanG", { opacity: 0 }, 37.09);
      tl.to("#dimG", { opacity: 1, duration: .35, ease: "power2.out" }, 37.93);
      tl.fromTo("#ttl2 .big", { yPercent: 105 }, { yPercent: 0, duration: .34, ease: "expo.out", stagger: .08 }, 37.97);
      tl.fromTo("#ttl2 .b", { scale: 1 }, { keyframes: [{ scale: 1.05, duration: .08 }, { scale: 1, duration: .2, ease: "power2.out" }], transformOrigin: "50% 50%", immediateRender: false }, 38.97);

      /* ---------------- H · "Make it different enough to justify existing..." */
      cam("#camH", 40.19, 0, { z: 2.0, fx: 1800, fy: 700 });
      cam("#camH", 40.19, 2.72, { z: 1.05, fx: 1180, fy: 820 }, "power2.inOut");
      breathe("#brH", 40.19, 43.03, .6);

      /* ---------------- I · "...without making people wonder where their game went." */
      const SC = ART.screen;
      Object.assign($("#tvLine").style, { left: (SC.cx - SC.w / 2) + "px", top: (SC.cy - SC.h / 2) + "px", width: SC.w + "px", height: SC.h + "px" });
      const T_OFF = 44.34;
      cam("#camI", 42.93, 0, { z: 1.0, fx: 1325, fy: 756 });
      cam("#camI", 43.31, T_OFF - 43.31, { z: 1.9, fx: 2010, fy: 600 }, "power2.inOut");
      breathe("#brI", 42.93, 49.6, .15);
      tl.fromTo("#dimI", { opacity: 1 }, { opacity: 0, duration: .25, immediateRender: false }, 42.93);
      tl.set("#iOff", { opacity: 1 }, T_OFF + .02);
      tl.fromTo("#tvLine", { opacity: 1, scaleX: 1, scaleY: 1 }, { keyframes: [{ scaleY: .04, duration: .12, ease: "power2.in" }, { scaleX: 0, duration: .22, ease: "power2.in" }, { opacity: 0, duration: .05 }], immediateRender: false }, T_OFF);
      tl.set("#tvLine", { opacity: 0 }, 0);
      cam("#camI", T_OFF + .15, .95, { z: 3.4, fx: SC.cx - 6, fy: SC.cy + 4 }, "power2.inOut");
      tl.to("#dimI", { opacity: .62, duration: .5, ease: "power2.in" }, 46.1);

      /* ---------------- wordmark (crisp, no blur), Navi into its star, then the end card */
      const WHY = 46.4;
      tl.set("#wm", { opacity: 0 }, 0);
      tl.fromTo("#wm", { scale: 1.14, opacity: 0 }, { scale: 1, opacity: 1, duration: .26, ease: "power3.out" }, WHY - .06);
      tl.fromTo("#wmBar", { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power3.inOut" }, WHY + .1);
      const STAR = { x: 90 + 808 * 900 / 2605, y: 690 + 235 * 900 / 2605 };
      const T_STAR = 47.45;
      tl.set("#twinkle", { x: STAR.x, y: STAR.y, scale: 0, opacity: 1 }, 0);
      tl.fromTo("#twinkle", { scale: 0, rotation: 0 }, { keyframes: [{ scale: 1.15, rotation: 45, duration: .3, ease: "power2.out" }, { scale: .35, rotation: 90, duration: .6, ease: "sine.inOut" }] }, T_STAR - .05);
      const CARD = 47.55;
      // the wordmark rises to the top of the card (centre y ~ 215) and shrinks; the card fades in under it
      tl.to("#wm", { y: -560, scale: .56, duration: .55, ease: "power3.inOut" }, CARD);
      tl.to("#twinkle", { opacity: 0, duration: .2 }, CARD - .05);
      tl.to("#card", { opacity: 1, duration: .4, ease: "sine.inOut" }, CARD);
      tl.fromTo("#thumbBox", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: .4, ease: "power3.out" }, CARD + .15);
      tl.fromTo("#cT", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .35, ease: "power3.out" }, CARD + .3);
      // Pixie stands on the thumbnail's top edge and waves the viewer over
      const PCH = 560, PCW = PCH * ART.sizes["pix_wave.png"][0] / ART.sizes["pix_wave.png"][1];
      Object.assign($("#pixCard").style, { left: "96px", top: (930 - PCH + 8) + "px", width: PCW + "px", height: PCH + "px", transformOrigin: "50% 100%" });
      tl.fromTo("#pixCard", { y: 40, opacity: 0, scaleY: .94 }, { keyframes: [{ y: 0, opacity: 1, scaleY: 1.03, duration: .25, ease: "power3.out" }, { scaleY: 1, duration: .15 }] }, CARD + .4);
      tl.fromTo("#pixCard", { rotation: 0 }, { rotation: 2.5, duration: .35, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, CARD + .8);
      tl.fromTo("#thumbImg", { scale: 1 }, { scale: 1.0, duration: .1 }, CARD);   // the thumbnail is shown whole and still

      /* ---------------- captions: word by word, the word being said is gold */
      const CAPEL = CAPS.map((c) => { const d = mk("div", "cap" + (c.big ? " bigc" : ""), $("#caps"));
        const spans = c.w.map(([w], i) => { if (i) d.appendChild(document.createTextNode(" ")); const s = mk("span", "", d); s.textContent = w; return s; });
        return { d, spans, c, on: false }; });
      function drawCaps(t) {
        CAPEL.forEach((E) => { const c = E.c, on = t >= c.a && t < c.e;
          if (on !== E.on) { E.d.style.visibility = on ? "visible" : "hidden"; E.on = on; }
          if (!on) return;
          const k = Math.min(1, (t - c.a) / .14), e = 1 - Math.pow(1 - k, 3);
          E.d.style.transform = `translateY(${10 * (1 - e)}px) scale(${.94 + .06 * e})`;
          let cur = -1; c.w.forEach(([w, a], i) => { if (t >= a - .03) cur = i; });
          E.spans.forEach((sp, i) => { if (!c.big) sp.style.color = i === cur ? "#ffc83d" : "#ffffff"; }); });
      }
      // the HUD shows only in the game world, and never under a title
      const HUDON = [[3.62, 15.12], [17.62, 34.41], [40.19, 42.93]];
      const hudEl = $("#hud");
      const drawHud = (t) => { const r = HUDON.find(([a, b]) => t >= a && t < b); hudEl.style.opacity = r ? Math.min(1, (t - r[0]) / .2) : 0; };

      /* ---------------- Navi: the companion, in screen px (glow, trail, flapping wings, white core) */
      const NK = [];
      const key = (t, x, y, r, op) => NK.push([t, x, y, r, op === undefined ? 1 : op]);
      const orbit = (t0, t1, cx, cy, rx, ry, turns, r, a0) => { const n = Math.max(3, Math.round((t1 - t0) / .12)); for (let i = 0; i <= n; i++) { const k = i / n, a = (a0 || 0) + 2 * Math.PI * turns * k;
        key(t0 + (t1 - t0) * k, cx + rx * Math.cos(a), cy - ry * Math.sin(a), r); } };
      // A: she bursts into the silence on the pause after "imagination." ("Hello!"), and settles above the hero's shoulder
      key(0, 960, 600, 20, 0); key(2.95, 960, 600, 20, 0); key(3.08, 930, 620, 24, 1);
      key(3.45, 700, 720, 22, 1); key(4.58, 640, 700, 20, 1); key(5.4, 620, 680, 20, 1);
      key(6.5, 600, 640, 20, 1); key(8.53, 580, 620, 20, 1);
      // B: she rides each upgrade: down to the field (polygons), up to the sun (lighting), round them (animation), with the birds (sound)
      key(8.63, 560, 600, 18, 1); key(11.16, 470, 1000, 18, 1); key(12.26, 820, 520, 18, 1); key(12.68, 760, 640, 18, 1);
      orbit(13.12, 13.88, 560, 860, 200, 60, 1, 18, 0);
      key(14.28, 480, 700, 18, 1); key(15.1, 820, 470, 18, 1); key(15.1, 860, 460, 18, 0);
      // D: she drifts by the tiny hero; on "empty" she droops, dim
      key(18.0, 700, 820, 16, 0); key(18.98, 700, 820, 16, .9); key(21.7, 620, 1000, 12, .9);
      key(24.04, 620, 1000, 12, .9); key(25.6, 600, 1150, 11, .5); key(25.85, 600, 1160, 11, 0);
      // E: knocked about by the old camera, then calm beside them
      key(26.0, 700, 760, 18, 0); key(26.27, 700, 760, 18, 1);
      orbit(26.87, 29.15, 560, 800, 240, 160, 2, 18, 1);
      key(29.61, 600, 640, 18, 1); key(30.49, 560, 760, 18, 1); key(32.43, 560, 760, 18, 0);
      // F: beside them for "good", a little dip on "Probably."
      key(32.5, 300, 660, 20, 0); key(32.55, 300, 660, 20, 1); key(32.91, 280, 620, 20, 1); key(33.63, 260, 660, 20, 1); key(33.93, 250, 720, 18, 1); key(34.33, 250, 700, 18, 1); key(34.4, 250, 700, 18, 0);
      // H: she flies out over the new vista
      key(40.21, 760, 640, 18, 0); key(40.41, 760, 640, 18, 1); key(42.83, 500, 760, 16, 1); key(42.92, 500, 760, 16, 0);
      // I: by the old TV's glow; she goes out with it
      key(43.31, 720, 640, 16, 0); key(43.63, 720, 640, 16, .85); key(44.39, 700, 600, 16, .85); key(44.69, 700, 600, 14, 0);
      // wordmark: round it into its star, then up with it and down into the thumbnail
      key(46.5, 1000, 830, 26, 0); key(46.65, 1000, 790, 28, 1);
      orbit(46.7, T_STAR - .12, 540, 780, 450, 170, 1.0, 28, 0);
      key(T_STAR, STAR.x, STAR.y, 24, 1); key(CARD, STAR.x, STAR.y - 380, 20, 1);
      key(48.15, 64 + 880 * .5, 930 + 495 * .3, 24, 1);
      orbit(48.2, 49.6, 64 + 880 * .5, 930 + 495 * .3, 70, 30, 1.6, 22, 3.14);
      NK.sort((a, b) => a[0] - b[0]);
      function naviPath(t) {
        if (t <= NK[0][0]) return NK[0].slice(1); if (t >= NK[NK.length - 1][0]) return NK[NK.length - 1].slice(1);
        let i = 0; while (i < NK.length - 2 && t > NK[i + 1][0]) i++;
        const p0 = NK[Math.max(0, i - 1)], p1 = NK[i], p2 = NK[i + 1], p3 = NK[Math.min(NK.length - 1, i + 2)];
        const k = (t - p1[0]) / Math.max(1e-6, p2[0] - p1[0]), u = k * k * (3 - 2 * k);
        const cr = (a, b, c, d) => .5 * (2 * b + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (-a + 3 * b - 3 * c + d) * u * u * u);
        return [cr(p0[1], p1[1], p2[1], p3[1]), cr(p0[2], p1[2], p2[2], p3[2]), p1[3] + (p2[3] - p1[3]) * k, p1[4] + (p2[4] - p1[4]) * k]; }
      const at = (t) => { const [x, y, r, op] = naviPath(t); return [x + .4 * .012 * SH * Math.sin(t * 2.3) * .5, y + .012 * SH * .5 * Math.sin(t * 3.7), r, op]; };
      const ctx = $("#navi").getContext("2d");
      function drawNavi(t) {
        ctx.clearRect(0, 0, SW, SH);
        const [x, y, r, op] = at(t); if (op <= .01) return;
        const s = r / 30, col = [120, 195, 255];
        const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2);
        g.addColorStop(0, `rgba(${col},${.95 * op})`); g.addColorStop(.35, `rgba(${col},${.45 * op})`); g.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, 7); ctx.fill();
        for (let k = 0; k < 10; k++) { const [qx, qy, , qo] = at(t - (k + 1) * .045); const rr = (4.5 - 3 * k / 10) * s * 1.6;
          ctx.fillStyle = `rgba(255,255,255,${op * Math.min(1, qo + .2) * .55 * (1 - k / 10)})`; ctx.beginPath(); ctx.arc(qx, qy, rr, 0, 7); ctx.fill(); }
        const f = .6 + .4 * Math.sin(t * 6.4 * 2 * Math.PI);
        for (const sx of [-1, 1]) {
          ctx.fillStyle = `rgba(230,245,255,${.55 * op})`; ctx.beginPath(); ctx.ellipse(x + sx * 16.5 * s, y - (3 + 13 * f) * s, 13.5 * s, (1 + 13 * f) * s, 0, 0, 7); ctx.fill();
          ctx.fillStyle = `rgba(230,245,255,${.4 * op})`; ctx.beginPath(); ctx.ellipse(x + sx * 16.5 * s, y + (3 + 7 * f) * s, 5.5 * s, (1 + 7 * f) * s, 0, 0, 7); ctx.fill(); }
        ctx.fillStyle = `rgba(255,255,255,${op})`; ctx.beginPath(); ctx.arc(x, y, 9 * s, 0, 7); ctx.fill();
      }

      const env = { t: 0 };
      tl.fromTo(env, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => { const t = env.t; drawNavi(t); drawSteps(t); drawCaps(t); drawHud(t); } }, 0);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
