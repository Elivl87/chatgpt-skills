        const p0 = NK[Math.max(0, i - 1)], p1 = NK[i], p2 = NK[i + 1], p3 = NK[Math.min(NK.length - 1, i + 2)];
        const k = (t - p1[0]) / Math.max(1e-6, p2[0] - p1[0]), u = k * k * (3 - 2 * k);
        const cr = (a, b, c, d) => .5 * (2 * b + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (-a + 3 * b - 3 * c + d) * u * u * u);
        return [cr(p0[1], p1[1], p2[1], p3[1]), cr(p0[2], p1[2], p2[2], p3[2]), p1[3] + (p2[3] - p1[3]) * k, p1[4] + (p2[4] - p1[4]) * k]; }
      const at = (t) => { const [x, y, r, op] = naviPath(t); return [x + .4 * .012 * SH * Math.sin(t * 2.3) * .5, y + .012 * SH * .5 * Math.sin(t * 3.7), r, op]; };
      // Navi's canvas is only as big as she is (520 px square) and follows her, so nothing else counts as covered
      // (its canvas is sized every frame to her glow + trail, so it never "covers" anything she is not actually over)
      const NC = $("#navi"), ctx = NC.getContext("2d");
      function drawNavi(t) {
        const [x0, y0, r, op] = at(t);
        if (op <= .01) { NC.style.visibility = "hidden"; return; }
        const TR = []; for (let k = 0; k < 10; k++) { const q = at(t - (k + 1) * .045); if (Math.hypot(q[0] - x0, q[1] - y0) > 170) break; TR.push(q); }   // a short trail: never a long streak across the frame
        const pad = r * 3.3;
        const bx0 = Math.floor(Math.min(x0, ...TR.map((q) => q[0])) - pad), by0 = Math.floor(Math.min(y0, ...TR.map((q) => q[1])) - pad);
        const bx1 = Math.ceil(Math.max(x0, ...TR.map((q) => q[0])) + pad), by1 = Math.ceil(Math.max(y0, ...TR.map((q) => q[1])) + pad);
        NC.width = bx1 - bx0; NC.height = by1 - by0; ctx.clearRect(0, 0, NC.width, NC.height);
        NC.style.visibility = "visible"; NC.style.transform = `translate(${bx0}px, ${by0}px)`;
        const x = x0 - bx0, y = y0 - by0;
        const s = r / 30, col = [120, 195, 255];
        const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2);
        g.addColorStop(0, `rgba(${col},${.95 * op})`); g.addColorStop(.35, `rgba(${col},${.45 * op})`); g.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, 7); ctx.fill();
        for (let k = 0; k < TR.length; k++) { let [qx, qy, , qo] = TR[k]; qx -= bx0; qy -= by0; const rr = (4.5 - 3 * k / 10) * s * 1.6;
          ctx.fillStyle = `rgba(255,255,255,${op * Math.min(1, qo + .2) * .55 * (1 - k / 10)})`; ctx.beginPath(); ctx.arc(qx, qy, rr, 0, 7); ctx.fill(); }
        const f = .6 + .4 * Math.sin(t * 6.4 * 2 * Math.PI);
        for (const sx of [-1, 1]) {
          ctx.fillStyle = `rgba(230,245,255,${.55 * op})`; ctx.beginPath(); ctx.ellipse(x + sx * 16.5 * s, y - (3 + 13 * f) * s, 13.5 * s, (1 + 13 * f) * s, 0, 0, 7); ctx.fill();
          ctx.fillStyle = `rgba(230,245,255,${.4 * op})`; ctx.beginPath(); ctx.ellipse(x + sx * 16.5 * s, y + (3 + 7 * f) * s, 5.5 * s, (1 + 7 * f) * s, 0, 0, 7); ctx.fill(); }
        ctx.fillStyle = `rgba(255,255,255,${op})`; ctx.beginPath(); ctx.arc(x, y, 9 * s, 0, 7); ctx.fill();
      }

      const IDLE = Array.from(document.querySelectorAll(".chr")).map((c, i) => [c.querySelectorAll("img"), 1.7 + .23 * i, i * 1.3]);
      function drawIdle(t) { for (const [imgs, f, ph] of IDLE) { const k = Math.sin(t * f + ph), sy = 1 + .012 * k, sx = 1 - .004 * k;
        imgs.forEach((im) => { im.style.transform = (im.hasAttribute("data-flip") ? "scaleX(-1) " : "") + `scale(${sx}, ${sy})`; }); } }
      const env = { t: 0 };
      tl.fromTo(env, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => { const t = env.t; drawNavi(t); drawSteps(t); drawIdle(t); drawCaps(t); drawHud(t); } }, 0);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
