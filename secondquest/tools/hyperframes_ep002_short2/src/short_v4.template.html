      .breath { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 2688px; height: 1512px; }
      .cam > img.plate { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
      /* a character: a box in plate px (feet = bottom centre), its poses stacked inside, a soft contact shadow */
      .chr { position: absolute; transform-origin: 50% 100%; }
      .chr img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; opacity: 0; object-fit: contain; object-position: 50% 100%; transform-origin: 50% 100%; }
      .chr img.on { opacity: 1; }
      .chr .foot { position: absolute; left: 6%; width: 88%; bottom: -3.2%; height: 6.4%; border-radius: 50%;
        background: radial-gradient(ellipse, rgba(24,20,12,.55) 0%, rgba(24,20,12,.25) 45%, rgba(24,20,12,0) 72%); }
      .big { font-family: "Anton", sans-serif; color: var(--gold); -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill;
        text-shadow: 6px 8px 0 var(--ink); line-height: 1.0; white-space: nowrap; letter-spacing: .01em; }

        visibility: hidden; transform-origin: 50% 50%; }

    <script>
      const SW = 1080, SH = 1920, PW = 2688, PH = 1512;
      const ART = /*ART*/;
      const CAPS = /*CAPTIONS*/;
      const $ = (s) => document.querySelector(s);
      const mk = (tag, cls, parent, style) => { const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.setAttribute("style", style); parent.appendChild(e); return e; };
      const hash = (i, j) => { let n = i * 374761393 + j * 668265263; n = (n ^ (n >> 13)) * 1274126177; return ((n ^ (n >> 16)) & 0x7fffffff) / 0x7fffffff; };
      // a character box in plate px: centre x, feet y, height h (its width follows the art)
      function put(sel, file, cx, feet, h) { const [w0, h0] = ART.sizes[file]; const w = h * w0 / h0; const e = $(sel);
        Object.assign(e.style, { left: (cx - w / 2) + "px", top: (feet - h) + "px", width: w + "px", height: h + "px" }); return { x: cx - w / 2, y: feet - h, w, h }; }
      const PIX = .96;       // Pixie's cut-out = 0.96 x young Quest's: 95 % of his height, face ~0.90 x his (PIXIE_V1 spec)

      const tl = gsap.timeline({ paused: true });
      <!--INCLUDE fromto_fix.js-->
      const DUR = {{DUR}};
      function view(c) { const s = Math.max(SW / PW, SH / PH) * c.z; let x = SW / 2 - c.fx * s, y = (c.sy || SH / 2) - c.fy * s;
        x = Math.min(0, Math.max(SW - PW * s, x)); y = Math.min(0, Math.max((c.sy ? 2 * c.sy : SH) - PH * s, y)); return { x, y, scale: s }; }
      function cam(sel, at, dur, c, ez) { const v = view(c);
        if (dur <= 0) tl.set(sel, v, at); else tl.to(sel, Object.assign(v, { duration: dur, ease: ez || "sine.inOut" }), at); }
      // the camera breathes: 2-3 % push + <= 1.5 % drift, each shot on its own phase
      function breathe(sel, a, b, ph) { tl.fromTo(sel, { scale: 1.0 + .004 * ph, x: -6 + 5 * ph, y: 3 - 4 * ph }, { scale: 1.025 - .003 * ph, x: 6 - 5 * ph, y: -3 + 4 * ph, duration: b - a, ease: "sine.inOut" }, a); }
      const flash = (at, a, d) => tl.fromTo("#flash", { opacity: a }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, at);
      const shake = (at, amp) => tl.to("#shake", { keyframes: [[0, amp], [amp * .6, -amp * .5], [-amp * .4, amp * .3], [0, 0]].map(([x, y]) => ({ x, y, duration: .045 })) }, at);
      // pose swap with acting: a quick squash on the change (anticipation -> new pose -> settle)
      function pose(sel, from, to, at) { tl.set(from, { opacity: 0 }, at); tl.set(to, { opacity: 1 }, at);
        tl.fromTo(sel, { scaleY: 1, scaleX: 1 }, { keyframes: [{ scaleY: .95, scaleX: 1.03, duration: .07, ease: "power2.out" }, { scaleY: 1.025, scaleX: .985, duration: .1 }, { scaleY: 1, scaleX: 1, duration: .16, ease: "power2.out" }], immediateRender: false }, at - .07); }

      /* ---------------- placements (plate px: centre x, feet y, height) */
      put("#q1", "q1.png", 920, 1420, 600);                 // P1: veteran Quest on the temple floor, left of the pedestal
      put("#vil", "villain.png", 1560, 1000, 560);          // the villain on the platform behind the pedestal, claw toward the Triforce
      put("#pS", "p2e.png", 1600, 1330, 560 * PIX);         // frame 0 bottom half: P2 Pixie, confused, in the forest village
      put("#p2", "p2c.png", 1480, 1330, 560 * PIX);         // P2: Pixie waving on the village path
      put("#pT", "p2d.png", 1000, 1400, 330 * PIX);          // the tree: Pixie small at its roots, looking up
      tl.set("#vil", { opacity: 0 }, 0);

      key(T_STAR, STAR.x, STAR.y, 24, 1); key(CARD, STAR.x - 40, STAR.y - 330, 20, 1);
      key(CARD + .25, 150, 700, 20, 1); key(CARD + .5, 170, 760, 22, 1); key(CARD + .8, 560, 790, 24, 1);
      orbit(CARD + .85, {{DUR}}, 560, 790, 70, 30, 1.2, 22, 3.14);
      NK.sort((a, b) => a[0] - b[0]);
      function naviPath(t) {
        if (t <= NK[0][0]) return NK[0].slice(1); if (t >= NK[NK.length - 1][0]) return NK[NK.length - 1].slice(1);
        let i = 0; while (i < NK.length - 2 && t > NK[i + 1][0]) i++;
        const p0 = NK[Math.max(0, i - 1)], p1 = NK[i], p2 = NK[i + 1], p3 = NK[Math.min(NK.length - 1, i + 2)];
        const k = (t - p1[0]) / Math.max(1e-6, p2[0] - p1[0]), u = k * k * (3 - 2 * k);
        const cr = (a, b, c, d) => .5 * (2 * b + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (-a + 3 * b - 3 * c + d) * u * u * u);
        return [cr(p0[1], p1[1], p2[1], p3[1]), cr(p0[2], p1[2], p2[2], p3[2]), p1[3] + (p2[3] - p1[3]) * k, p1[4] + (p2[4] - p1[4]) * k]; }
      const at = (t) => { const [x, y, r, op] = naviPath(t); return [x + .4 * .012 * SH * Math.sin(t * 2.3) * .5, y + .012 * SH * .5 * Math.sin(t * 3.7), r, op]; };
      // Navi's canvas is only as big as she is (520 px square) and follows her, so nothing else counts as covered
      // (its canvas is sized every frame to her glow + trail, so it never "covers" anything she is not actually over)
      const NC = $("#navi"), ctx = NC.getContext("2d");
      function drawNavi(t) {
        const [x0, y0, r, op] = at(t);
        if (op <= .01) { NC.style.visibility = "hidden"; return; }
        const TR = []; for (let k = 0; k < 10; k++) { const q = at(t - (k + 1) * .045); if (Math.hypot(q[0] - x0, q[1] - y0) > 170) break; TR.push(q); }   // a short trail: never a long streak across the frame
        const pad = r * 3.3;
        const bx0 = Math.floor(Math.min(x0, ...TR.map((q) => q[0])) - pad), by0 = Math.floor(Math.min(y0, ...TR.map((q) => q[1])) - pad);
        const bx1 = Math.ceil(Math.max(x0, ...TR.map((q) => q[0])) + pad), by1 = Math.ceil(Math.max(y0, ...TR.map((q) => q[1])) + pad);
        NC.width = bx1 - bx0; NC.height = by1 - by0; ctx.clearRect(0, 0, NC.width, NC.height);
        NC.style.visibility = "visible"; NC.style.transform = `translate(${bx0}px, ${by0}px)`;
        const x = x0 - bx0, y = y0 - by0;
        const s = r / 30, col = [120, 195, 255];
        const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2);
        g.addColorStop(0, `rgba(${col},${.95 * op})`); g.addColorStop(.35, `rgba(${col},${.45 * op})`); g.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, 7); ctx.fill();
        for (let k = 0; k < TR.length; k++) { let [qx, qy, , qo] = TR[k]; qx -= bx0; qy -= by0; const rr = (4.5 - 3 * k / 10) * s * 1.6;
          ctx.fillStyle = `rgba(255,255,255,${op * Math.min(1, qo + .2) * .55 * (1 - k / 10)})`; ctx.beginPath(); ctx.arc(qx, qy, rr, 0, 7); ctx.fill(); }
        const f = .6 + .4 * Math.sin(t * 6.4 * 2 * Math.PI);
        for (const sx of [-1, 1]) {
          ctx.fillStyle = `rgba(230,245,255,${.55 * op})`; ctx.beginPath(); ctx.ellipse(x + sx * 16.5 * s, y - (3 + 13 * f) * s, 13.5 * s, (1 + 13 * f) * s, 0, 0, 7); ctx.fill();
          ctx.fillStyle = `rgba(230,245,255,${.4 * op})`; ctx.beginPath(); ctx.ellipse(x + sx * 16.5 * s, y + (3 + 7 * f) * s, 5.5 * s, (1 + 7 * f) * s, 0, 0, 7); ctx.fill(); }
        ctx.fillStyle = `rgba(255,255,255,${op})`; ctx.beginPath(); ctx.arc(x, y, 9 * s, 0, 7); ctx.fill();
      }

      const IDLE = Array.from(document.querySelectorAll(".chr")).map((c, i) => [c.querySelectorAll("img"), 1.7 + .23 * i, i * 1.3]);
      function drawIdle(t) { for (const [imgs, f, ph] of IDLE) { const k = Math.sin(t * f + ph), sy = 1 + .012 * k, sx = 1 - .004 * k;
        imgs.forEach((im) => { im.style.transform = (im.hasAttribute("data-flip") ? "scaleX(-1) " : "") + `scale(${sx}, ${sy})`; }); } }
      const env = { t: 0 };
      tl.fromTo(env, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => { const t = env.t; drawNavi(t); drawIdle(t); drawCaps(t); drawHud(t); drawTF(t); drawSparks(t); drawSel(t); drawBoot(t); } }, 0);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

    </script>
