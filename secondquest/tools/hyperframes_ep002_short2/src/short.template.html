<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{RW}}, height={{RH}}" />
    <title>EP002 Short 2 v2</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* v2 layout grid (1080 x 1920, docs/style/DESIGN_RUBRIC.md):
         HUD band y 120-300 (game world only) · TITLE zone y 190-420 (never with the HUD) · characters/focal y 560-1300 ·
         CAPTION band y 1340-1500 · nothing that matters below y 1536 (Shorts UI) or right of x 918 (action rail).
         Every text block is centred on one axis, x = 491 (the centre of the text-safe column 65-918). */
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; }
      :root { --gold: #ffc83d; --ink: #16161f; --axis: 491px; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{RW}}px; height: {{RH}}px; overflow: hidden; background: #16161f; }
      #root { position: relative; width: {{RW}}px; height: {{RH}}px; overflow: hidden; font-family: "Inter", sans-serif; }
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform: scale({{RK}}); transform-origin: 0 0; overflow: hidden; }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .abs { position: absolute; }
      .shot { overflow: hidden; background: #16161f; }
      .breath { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 2688px; height: 1512px; }
      .cam > img.plate { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
      /* a character: a box in plate px (feet = bottom centre), its poses stacked inside, a soft contact shadow */
      .chr { position: absolute; transform-origin: 50% 100%; }
      .chr img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; opacity: 0; object-fit: contain; object-position: 50% 100%; transform-origin: 50% 100%; }
      .chr img.on { opacity: 1; }
      .chr .foot { position: absolute; left: 6%; width: 88%; bottom: -3.2%; height: 6.4%; border-radius: 50%;
        background: radial-gradient(ellipse, rgba(24,20,12,.55) 0%, rgba(24,20,12,.25) 45%, rgba(24,20,12,0) 72%); }
      .big { font-family: "Anton", sans-serif; color: var(--gold); -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill;
        text-shadow: 6px 8px 0 var(--ink); line-height: 1.0; white-space: nowrap; letter-spacing: .01em; }
      /* the one title style: opening hook and its callback on l60 */
      .ttl { position: absolute; left: 65px; width: 853px; top: 190px; text-align: center; }
      .ttl .ln { display: block; overflow: hidden; padding: 6px 30px 14px; margin-bottom: -24px; }   /* mask-up line reveal (kinetic-typography) */
      .ttl .big { display: inline-block; }
      .ttl .a { font-size: 92px; color: #fff; }
      .ttl .b { font-size: 112px; }
      #hud img { position: absolute; display: block; }
      /* captions: Shorts standard, word by word, on the text axis, inside x 6-85 % and above the bottom UI */
      .cap { position: absolute; left: 81px; width: 820px; top: 1340px; text-align: center; font: 800 74px/1.14 "Inter", sans-serif;
        color: #fff; word-spacing: .1em; -webkit-text-stroke: 14px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink);
        visibility: hidden; transform-origin: 50% 50%; }
      .cap.bigc { font-size: 132px; top: 1310px; color: var(--gold); }
      .cap span { display: inline-block; }
      /* A · the empty speech bubble: a comic balloon whose tail ends at the silent hero's mouth (it lives in the plate) */
      #bub { position: absolute; transform-origin: 92% 100%; }
      #bub svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #dots { position: absolute; left: 0; width: 76.9%; text-align: center; font: 800 150px/1 "Inter", sans-serif; color: #2a2a36; letter-spacing: .1em; }
      #dots i { font-style: normal; display: inline-block; }
      /* B · the sun and the birds */
      .bird { position: absolute; width: 74px; height: 32px; }
      .bird svg { width: 100%; height: 100%; overflow: visible; }
      .leaf { position: absolute; width: 46px; height: 28px; border-radius: 0 100% 0 100%; background: #6fae3e; border: 3px solid #2c4a1c; }
      /* E · the old camera: a viewfinder drawn on the frame itself + the low-poly rock it clips into */
      #vf { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #vf svg { width: 100%; height: 100%; overflow: visible; }
      #rock { position: absolute; left: 0; top: 0; width: 900px; height: 1920px; }
      #rock svg { width: 100%; height: 100%; }
      /* wordmark + end card */
      #wm { position: absolute; left: 90px; top: 690px; width: 900px; height: 240px; transform-origin: 50% 32%; }
      #wm img { position: absolute; left: 0; top: 0; width: 900px; height: 155px; filter: drop-shadow(0 7px 0 #16161f) drop-shadow(0 0 30px rgba(22,22,31,.5)); }
      #wmBar { position: absolute; left: 150px; top: 182px; width: 600px; height: 13px; background: var(--gold); border-radius: 7px; box-shadow: 0 5px 0 var(--ink); transform-origin: 50% 50%; }
      #twinkle { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      #twinkle .g { position: absolute; left: -130px; top: -130px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(255,244,210,.95) 0%, rgba(255,230,160,.45) 35%, rgba(255,220,150,0) 70%); }
      #twinkle svg { position: absolute; left: -70px; top: -70px; width: 140px; height: 140px; overflow: visible; }
      #cT { position: absolute; left: 65px; width: 853px; top: 312px; text-align: center; }
      #cT span { display: block; }
      #cT .a { font-size: 96px; color: #fff; }
      #cT .b { font-size: 76px; margin-top: 6px; }
      #sign { position: absolute; left: 140px; top: 560px; width: 800px; height: 960px; }
      #sign .post { position: absolute; top: 400px; width: 30px; height: 540px; border: 6px solid var(--ink); border-radius: 6px; background: linear-gradient(90deg, #5a3b20, #8a5d34 45%, #5a3b20); }
      #sign .shadow { position: absolute; left: 60px; top: 912px; width: 680px; height: 46px; border-radius: 50%; background: radial-gradient(ellipse, rgba(20,16,8,.5) 0%, rgba(20,16,8,0) 70%); }
      #thumbBox { position: absolute; left: 0; top: 0; width: 800px; height: 452px; border: 18px solid #7a5230; outline: 6px solid var(--ink); border-radius: 14px; overflow: hidden;
        box-shadow: 10px 14px 0 var(--ink); background: #000; }
      #thumbBox img { width: 100%; height: 100%; display: block; }
      #pixCard { position: absolute; }
      #pixCard img { position: absolute; inset: 0; width: 100%; height: 100%; }
      #pixCard .foot { position: absolute; left: 4%; width: 92%; bottom: -3%; height: 5%; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 72%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-fps="30" data-width="{{RW}}" data-height="{{RH}}">
      <audio id="vo" src="assets/narration.wav" data-start="0" data-duration="{{DUR}}" data-track-index="30" data-volume="1"></audio>
      <div id="stage">
      <div id="shake" class="full">

      <!-- ===== A · l51-l53 · Hyrule field, the silent young hero (#3b) faces us; his empty balloon; Pixie (#2c -> #2e) arrives ===== -->
      <div id="shA" class="full shot clip" data-start="0" data-duration="{{S1+0.02}}" data-track-index="1">
        <div class="breath" id="brA"><div class="cam" id="camA">
          <img class="plate" src="assets/field.jpg" alt="" />
          <div class="chr" id="qA" data-role="character"><div class="foot"></div><img class="on" src="assets/hero_front.png" alt="quest" /></div>
          <div class="chr" id="pA" data-role="character"><div class="foot"></div><img id="pA_c" class="on" src="assets/p2c.png" alt="pixie" /><img id="pA_e" src="assets/p2e.png" alt="pixie" /></div>
          <div id="bub" data-critic-allow-overlap>
            <svg viewBox="0 0 390 260"><path d="M38 6 H262 Q294 6 294 38 V128 Q294 160 262 160 H250 L380 252 L206 160 H38 Q6 160 6 128 V38 Q6 6 38 6 Z" fill="#fffdf6" stroke="#16161f" stroke-width="7" stroke-linejoin="round"/></svg>
            <div id="dots"><i>.</i><i>.</i><i>.</i></div>
          </div>
        </div></div>
      </div>

      <!-- ===== B · l42-l46 · the giant tree (#14) in its 1998 look; each "better" upgrades it on the word: polygons (the low-poly
           world sharpens, its face appears), lighting (a sun flare), animation (the leaves fall), sound (a flock bursts out) ===== -->
      <div id="shB" class="full shot clip" data-start="{{S1}}" data-duration="{{l47-0.1-S1+0.02}}" data-track-index="2">
        <div class="breath" id="brB"><div class="cam" id="camB">
          <img class="plate" src="assets/tree_old.jpg" alt="" style="filter: contrast(1.18) brightness(1.1) saturate(1.1)" />
          <img class="plate" id="bMid" src="assets/tree_mid.jpg" alt="" style="opacity: 0" />
          <img class="plate" id="bHd" src="assets/tree.jpg" alt="" style="opacity: 0" />
          <div id="sun" class="abs" style="left: -612px; top: -105px; width: 1600px; height: 1600px; opacity: 0; mix-blend-mode: screen; background: radial-gradient(circle, rgba(255,240,200,1) 0%, rgba(255,214,140,.55) 12%, rgba(255,200,110,.18) 35%, rgba(255,190,100,0) 60%)"></div>
          <div id="streak" class="abs" style="left: -812px; top: 683px; width: 2000px; height: 24px; opacity: 0; mix-blend-mode: screen; border-radius: 12px; background: linear-gradient(90deg, rgba(255,220,160,0), rgba(255,236,200,.9) 50%, rgba(255,220,160,0))"></div>
        </div></div>
        <div id="beams" class="full" style="opacity: 0; mix-blend-mode: screen">
          <div class="abs" style="left: 120px; top: -300px; width: 150px; height: 2000px; transform: rotate(-28deg); background: linear-gradient(rgba(255,236,180,.5), rgba(255,236,180,0))"></div>
          <div class="abs" style="left: 380px; top: -300px; width: 90px; height: 2000px; transform: rotate(-28deg); background: linear-gradient(rgba(255,236,180,.38), rgba(255,236,180,0))"></div>
          <div class="abs" style="left: 600px; top: -300px; width: 60px; height: 2000px; transform: rotate(-28deg); background: linear-gradient(rgba(255,236,180,.3), rgba(255,236,180,0))"></div>
        </div>
        <div id="leaves" class="full"></div>
        <div id="birds" class="full"></div>
      </div>

      <!-- ===== C · l47 + l60 · real life, 1998: the childhood bedroom (kid Quest #6a, kid Pixie #6b pointing at our CRT): the
           twist "But familiar is not measurable." and the payoff: the memory is "improved" under a rebuild scan while the
           title returns: THAT IS THE IMPOSSIBLE JOB (one continuous shot) ===== -->
      <div id="shC" class="full shot clip" data-start="{{l47-0.1}}" data-duration="{{l60-0.1-l47+0.1+0.02}}" data-track-index="3">
        <div class="breath" id="brC"><div class="cam" id="camC">
          <img class="plate" src="assets/kids_old.jpg" alt="kid quest and kid pixie" />
          <img class="plate" id="cNew" src="assets/kids_new.jpg" alt="kid quest and kid pixie" style="clip-path: inset(0px 0px 1512px 0px)" />
        </div></div>
        <div id="warmC" class="full" style="mix-blend-mode: soft-light; background: radial-gradient(ellipse at 30% 80%, rgba(255,170,90,.45), rgba(255,170,90,0) 70%)"></div>
      </div>

      <!-- ===== V · l60 payoff: the remake's epic new look (#17+18, princess Pixie + adult Quest on the outcrop) on "That is the",
           then a hard cut on "impossible" to the castle in the sun: the bass drop, a flare and the kinetic title ===== -->
      <div id="shV1" class="full shot clip" data-start="{{l60-0.1}}" data-duration="{{l60.w4-0.04-l60+0.1+0.02}}" data-track-index="4">
        <div class="breath" id="brV1"><div class="cam" id="camV1"><img class="plate" src="assets/outcrop.jpg" alt="quest and pixie" /></div></div>
      </div>
      <div id="shV2" class="full shot clip" data-start="{{l60.w4-0.04}}" data-duration="{{DUR-l60.w4+0.04}}" data-track-index="5">
        <div class="breath" id="brV2"><div class="cam" id="camV2"><img class="plate" src="assets/outcrop.jpg" alt="" />
          <div id="vflare" class="abs" style="left: 1201px; top: 35px; width: 1200px; height: 1200px; opacity: 0; mix-blend-mode: screen; background: radial-gradient(circle, rgba(255,246,214,1) 0%, rgba(255,214,140,.6) 10%, rgba(255,190,110,.2) 32%, rgba(255,180,100,0) 58%)"></div>
        </div></div>
        <div id="vdim" class="full" style="background: linear-gradient(180deg, rgba(20,10,10,.55) 0%, rgba(20,10,10,.15) 30%, rgba(20,10,10,0) 45%); opacity: 0"></div>
        <div id="vnight" class="full" style="background: #07060a; opacity: 0"></div>
      </div>

      <!-- ===== HUD: game world only (A after the title, B) ===== -->
      <div id="hud" class="full clip" data-role="hud" data-start="0" data-duration="{{l47}}" data-track-index="15" style="opacity: 0">
        <img src="assets/hud_hearts.png" alt="" style="left: 60px; top: 150px; width: 290px" />
        <img src="assets/hud_rupee.png" alt="" style="left: 66px; top: 236px; width: 120px" />
        <img src="assets/hud_buttons.png" alt="" style="left: 640px; top: 132px; width: 380px" />
      </div>

      <!-- ===== the title: hook (0 - l52) and its callback (l60) — one style, one crisp entrance, no echo ===== -->
      <div id="ttl1Clip" class="full clip" data-start="0" data-duration="{{l52-0.09}}" data-track-index="16">
        <div id="ttl1" class="ttl" aria-label="The remake's impossible job"><span class="ln" data-layout-allow-overflow><span class="big a">THE REMAKE'S</span></span><span class="ln" data-layout-allow-overflow><span class="big b">IMPOSSIBLE JOB</span></span></div>
      </div>
      <div id="ttl2Clip" class="full clip" data-start="{{l60.w4-0.06}}" data-duration="{{VEND+0.1-l60.w4+0.06}}" data-track-index="22">
        <div id="ttl2" class="ttl" style="top: 230px" aria-label="That is the impossible job"><span class="ln" data-layout-allow-overflow><span class="big a">THAT IS THE</span></span><span class="ln" data-layout-allow-overflow><span class="big b">IMPOSSIBLE JOB</span></span></div>
      </div>

      <!-- ===== wordmark + end card (the EP002 v3 thumbnail B1, whole) ===== -->
      <div id="card" class="full clip" data-start="{{VEND+0.9}}" data-duration="{{DUR-VEND-0.9}}" data-track-index="17" style="opacity: 0">
        <img id="cardBg" class="abs" src="assets/field.jpg" alt="" style="left: -920px; top: 0; width: 3413px; height: 1920px; filter: blur(2px) brightness(.72) saturate(.95)" />
        <div id="cT"><span class="big a">FULL EPISODE</span><span class="big b">ON THE CHANNEL</span></div>
        <div id="sign"><div class="shadow"></div><div class="post" style="left: 110px"></div><div class="post" style="left: 660px"></div>
          <div id="thumbBox"><img id="thumbImg" src="assets/thumb.jpg" alt="" /></div></div>
        <div id="pixCard" data-role="character"><div class="foot"></div><img src="assets/p2c.png" alt="pixie" /></div>
      </div>
      <div id="wmClip" class="full clip" data-start="{{VEND-0.3}}" data-duration="{{DUR-VEND+0.3}}" data-track-index="18">
        <div id="wm"><img src="assets/wordmark.png" alt="SecondQuest" /><div id="wmBar"></div></div>
        <div id="twinkle"><div class="g"></div><svg viewBox="-70 -70 140 140"><polygon points="0,-70 12,-12 70,0 12,12 0,70 -12,12 -70,0 -12,-12" fill="#fffaf0"/></svg></div>
      </div>

      <!-- ===== Navi (our EP002 fairy: tools/fx/fairy.py twin) ===== -->
      <div id="naviClip" class="full clip" data-start="0" data-duration="{{DUR}}" data-track-index="19" style="pointer-events: none">
        <canvas id="navi" data-critic-ignore class="abs" width="64" height="64" style="left: 0; top: 0; visibility: hidden"></canvas>
      </div>

      <!-- ===== captions ===== -->
      <div id="caps" class="full clip" data-role="caption" data-start="0" data-duration="{{VEND}}" data-track-index="20"></div>

      <div id="flash" class="full clip" data-start="0" data-duration="{{DUR}}" data-track-index="21" style="background: #fffaf0; opacity: 0"></div>
      </div>
    </div>

    <script>
      const SW = 1080, SH = 1920, PW = 2688, PH = 1512;
      const ART = /*ART*/;
      const CAPS = /*CAPTIONS*/;
      const $ = (s) => document.querySelector(s);
      const mk = (tag, cls, parent, style) => { const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.setAttribute("style", style); parent.appendChild(e); return e; };
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const R = rng(2042);

      // a character box in plate px: centre x, feet y, height h (its width follows the art)
      function put(sel, file, cx, feet, h) { const [w0, h0] = ART.sizes[file]; const w = h * w0 / h0; const e = $(sel);
        Object.assign(e.style, { left: (cx - w / 2) + "px", top: (feet - h) + "px", width: w + "px", height: h + "px" }); return { x: cx - w / 2, y: feet - h, w, h }; }
      const PIX = .96;       // Pixie's cut-out = 0.96 x young Quest's: 95 % of his height, face ~0.90 x his (PIXIE_V1 spec)
      const ROAD = [[.500, .970], [.511, .905], [.521, .845], [.529, .785], [.533, .750], [.536, .730]];
      const roadX = (y) => { const fy = y / PH; for (let i = 0; i + 1 < ROAD.length; i++) { const [xa, ya] = ROAD[i], [xb, yb] = ROAD[i + 1]; if (fy <= ya && fy >= yb) return PW * (xa + (xb - xa) * (ya - fy) / (ya - yb)); } return PW * (fy > ROAD[0][1] ? ROAD[0][0] : ROAD[ROAD.length - 1][0]); };
      const VY = .68 * PH, hAt = (h0, y0, y) => h0 * (y - VY) / (y0 - VY);

      // A: hero 400 px tall on the road, Pixie beside him (same ground line), the balloon anchored to his mouth
      // (front shots keep one screen direction: Pixie on the left of Quest)
      const QA = put("#qA", "hero_front.png", 1400, 1100, 400);
      const PA = put("#pA", "p2c.png", 1212, 1100, 400 * PIX);
      const BK = .55;   // the balloon: tail tip at his mouth (plate 1368, 800), box up-left of his head, clear of the cap
      Object.assign($("#bub").style, { left: (1368 - 380 * BK - 34) + "px", top: (800 - 252 * BK + 12) + "px", width: (390 * BK) + "px", height: (260 * BK) + "px" });
      $("#dots").style.top = (-52 * BK) + "px"; $("#dots").style.fontSize = (150 * BK) + "px";

      /* ------------------------------------------------------------------ timeline */
      const tl = gsap.timeline({ paused: true });
      <!--INCLUDE fromto_fix.js-->
      const DUR = {{DUR}};
      function view(c) { const s = Math.max(SW / PW, SH / PH) * c.z; let x = SW / 2 - c.fx * s, y = SH / 2 - c.fy * s;
        x = Math.min(0, Math.max(SW - PW * s, x)); y = Math.min(0, Math.max(SH - PH * s, y)); return { x, y, scale: s }; }
      function cam(sel, at, dur, c, ez) { const v = view(c);
        if (dur <= 0) tl.set(sel, v, at); else tl.to(sel, Object.assign(v, { duration: dur, ease: ez || "sine.inOut" }), at); }
      // the camera breathes: 2-3 % push + <= 1.5 % drift, each shot on its own phase
      function breathe(sel, a, b, ph) { tl.fromTo(sel, { scale: 1.0 + .004 * ph, x: -6 + 5 * ph, y: 3 - 4 * ph }, { scale: 1.025 - .003 * ph, x: 6 - 5 * ph, y: -3 + 4 * ph, duration: b - a, ease: "sine.inOut" }, a); }
      const flash = (at, a, d) => tl.fromTo("#flash", { opacity: a }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, at);
      const shake = (at, amp) => tl.to("#shake", { keyframes: [[0, amp], [amp * .6, -amp * .5], [-amp * .4, amp * .3], [0, 0]].map(([x, y]) => ({ x, y, duration: .045 })) }, at);
      // pose swap with acting: a quick squash on the change (anticipation -> new pose -> settle)
      function pose(sel, from, to, at) { tl.set(from, { opacity: 0 }, at); tl.set(to, { opacity: 1 }, at);
        tl.fromTo(sel, { scaleY: 1, scaleX: 1 }, { keyframes: [{ scaleY: .95, scaleX: 1.03, duration: .07, ease: "power2.out" }, { scaleY: 1.025, scaleX: .985, duration: .1 }, { scaleY: 1, scaleX: 1, duration: .16, ease: "power2.out" }], immediateRender: false }, at - .07); }
      const bob = (sel, at, amp) => tl.fromTo(sel, { y: 0 }, { keyframes: [{ y: -(amp || 14), duration: .12, ease: "power2.out" }, { y: 0, duration: .2, ease: "power2.in" }], immediateRender: false }, at);
      function walk(sel, y0, h0, y1, at, dur, dx) { const e = $(sel); const x0 = parseFloat(e.style.left) + parseFloat(e.style.width) / 2;
        tl.to(sel, { x: roadX(y1) - roadX(y0) + (dx || 0), y: y1 - y0, scale: hAt(h0, y0, y1) / h0, duration: dur, ease: "none" }, at); }
      const STEPS = [];
      const steps = (sel, t0, t1, rate) => STEPS.push([sel, t0, t1, rate || 5.6]);
      function drawSteps(t) { for (const [sel, t0, t1, rate] of STEPS) { const on = t >= t0 && t < t1, e = $(sel), a = e.querySelector(".sa"), b = e.querySelector(".mir");
        const k = on ? Math.floor((t - t0) * rate / Math.PI) % 2 : 0; if (a && b) { a.style.opacity = k ? 0 : 1; b.style.opacity = k ? 1 : 0; }
        else e.querySelectorAll("img").forEach((i) => i.style.rotate = on ? (1.6 * Math.sin((t - t0) * rate)) + "deg" : "0deg");   // one-pose walkers sway step to step
        const bb = on ? -5 * Math.abs(Math.sin((t - t0) * rate)) : 0; e.querySelectorAll("img").forEach((i) => i.style.top = bb + "px"); } }

      function DOTS0() { return document.querySelectorAll("#dots i"); }
      /* ---------------- A · the silent hero (frame 1 is the hook: title + hero + his empty balloon) */
      // critic v3 #1: the hook is cut into real shots on the words (camera, light, Navi and cuts only; nobody acts)
      const F1 = 1 / 30;
