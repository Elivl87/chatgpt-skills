      :root { --gold: #ffc83d; --ink: #16161f; --cream: #fff4dc; --red: #e5484d; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #16161f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; }
      .abs { position: absolute; }
      .full { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
      #stage, #view, #grade, #breath, #shake, #tilt { overflow: hidden; }
      #stage { background: #4a3a6c; }

      /* ---------- the world (the hook's lake: per-layer parallax, each layer with 15% bleed) ---------- */
      .L { position: absolute; left: -192px; top: -108px; width: 1664px; height: 936px; }
      .F { position: absolute; left: 192px; top: 108px; width: 1280px; height: 720px; }
      #L-sky .sky { position: absolute; left: -192px; top: -108px; width: 1664px; height: 560px;
        background: linear-gradient(180deg, #1f2150 0%, #3c3470 22%, #7a4c86 44%, #c9688a 62%, #f4907a 76%, #ffbe7c 88%, #ffd9a2 100%); }
      #sun { position: absolute; left: 950px; top: 262px; width: 124px; height: 124px; }
      #sun .disc { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 45% 40%, #fff6d8 0%, #ffe7a6 55%, #ffc978 100%); box-shadow: 0 0 40px 12px rgba(255, 214, 140, .75); }
      #sunglow { position: absolute; left: 512px; top: -186px; width: 1000px; height: 1000px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 210, 140, .55) 0%, rgba(255, 170, 120, .22) 30%, rgba(255, 150, 120, 0) 62%); mix-blend-mode: screen; }
      #rays { position: absolute; left: 212px; top: -486px; width: 1600px; height: 1600px; border-radius: 50%; mix-blend-mode: screen; opacity: .22;
        background: repeating-conic-gradient(from 0deg, rgba(255, 220, 170, .55) 0deg 4deg, rgba(255, 220, 170, 0) 4deg 13deg);
        -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 25%, transparent 60%); mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 25%, transparent 60%); }
      .cloud { position: absolute; height: 46px; border-radius: 40px; background: linear-gradient(180deg, rgba(255, 214, 200, .0) 0%, rgba(255, 190, 175, .55) 60%, rgba(255, 160, 150, .75) 100%); filter: blur(1.5px); }
      .cloud::before, .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
      .cloud::before { width: 46%; height: 150%; left: 14%; top: -62%; }
      .cloud::after { width: 34%; height: 120%; left: 50%; top: -40%; }
      #water { position: absolute; left: -192px; top: 330px; width: 1664px; height: 498px; }
      #boatEnter { position: absolute; left: 330px; top: 452px; width: 620px; height: 145px; }
      #boatBob, #boatRock { position: absolute; inset: 0; }
      .boatimg { position: absolute; left: 0; top: 9px; width: 620px; height: 136px; }
      #boatRefl { position: absolute; left: 0; top: 128px; width: 620px; height: 145px; opacity: .3; filter: blur(2px) brightness(.8);
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 40%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0%, #000 40%, transparent 100%); }
      #boatRefl img { width: 100%; height: 100%; transform: scaleY(-1); }
      #crewClip { position: absolute; left: -80px; top: -300px; width: 780px; height: 405px; overflow: hidden; }
      .mate { position: absolute; bottom: -95px; width: 200px; height: 290px; }
      .mate .pop, .mate .lean, .mate .breathe, .mate .sway, .mate .flip { position: absolute; inset: 0; }
      .mate img { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; object-fit: contain; object-position: bottom center;
        filter: drop-shadow(3px -1px 0 rgba(255, 196, 128, .9)) drop-shadow(0 0 10px rgba(255, 170, 110, .25)) brightness(.97) saturate(1.05); }
      .mate img.alt { opacity: 0; }
      #qSlump { left: -76px !important; bottom: -8px !important; width: 300px !important; height: 300px !important; }
      .sil svg { position: absolute; left: 0; bottom: 0; width: 200px; height: 290px; overflow: visible; transform: scale(1.08); transform-origin: 50% 100%;
        filter: drop-shadow(3px -1px 0 rgba(255, 196, 128, .95)) drop-shadow(0 0 10px rgba(255, 170, 110, .3)); }
      .arm { position: absolute; width: 120px; height: 26px; }
      .arm svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(2px -1px 0 rgba(255, 196, 128, .95)); }
      #rod { position: absolute; left: 548px; top: -262px; width: 27px; height: 330px; }
      #rod img { width: 100%; height: 100%; }
      .ripple { position: absolute; border: 2px solid rgba(255, 228, 210, .55); border-radius: 50%; }
      .fish { position: absolute; }
      .fish img { width: 100%; height: 100%; display: block; object-fit: contain; }
      .lid { position: absolute; left: 0; top: 0; width: 100% !important; height: 100% !important; opacity: 0; }
      .ring { position: absolute; border: 3px solid rgba(255, 240, 225, .9); border-radius: 50%; }
      .drop { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #e9f6ff; box-shadow: 0 0 4px rgba(255,255,255,.6); }
      .reed { position: absolute; bottom: -20px; width: 10px; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, #2b2340, #120f1e); transform-origin: 50% 100%; }
      .handprint { position: absolute; opacity: 0; mix-blend-mode: multiply; }
      .handprint svg { width: 100%; height: 100%; overflow: visible; }

      /* ---------- channel type ---------- */
      .mk { position: absolute; background: var(--gold); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 4px 5px 0 var(--ink);
        color: var(--ink); font: 800 22px "Inter", sans-serif; letter-spacing: .09em; text-transform: uppercase; padding: 7px 16px 6px; white-space: nowrap; }
      .big { font-family: "Anton", sans-serif; color: var(--gold); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 5px 6px 0 var(--ink); letter-spacing: .01em; line-height: 1; white-space: nowrap; }
      .hand { font-family: "Hand", "Inter", cursive; font-weight: 700; }

      /* ---------- E1/E2: the parchment list ---------- */
      #list { position: absolute; left: 62px; top: 96px; width: 589px; height: 372px; }
      #listIn { position: absolute; inset: 0; }
      .paper { position: absolute; inset: 0; border-radius: 6px 10px 8px 12px;
        background: radial-gradient(ellipse 60% 50% at 30% 30%, rgba(255, 252, 238, .9) 0%, rgba(255, 252, 238, 0) 70%),
          radial-gradient(ellipse 40% 30% at 85% 80%, rgba(176, 128, 70, .22) 0%, rgba(176, 128, 70, 0) 70%),
          radial-gradient(ellipse 30% 25% at 10% 90%, rgba(176, 128, 70, .2) 0%, rgba(176, 128, 70, 0) 70%),
          linear-gradient(170deg, #f8ecd0 0%, #f1dfba 55%, #e6cc9c 100%);
        box-shadow: inset 0 0 0 2px rgba(120, 80, 40, .25), inset 0 0 38px rgba(150, 100, 50, .35), 8px 10px 0 rgba(22, 22, 31, .55), 0 18px 34px rgba(0, 0, 0, .35); }
      .paper svg.grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .5; mix-blend-mode: multiply; border-radius: inherit; }
      .paper .pin { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a7a, #c8323a 60%, #7a1a22); box-shadow: 2px 3px 0 rgba(22,22,31,.5); }
      #listTitle { position: absolute; left: 44px; top: 18px; font-size: 62px; color: #3a2414; line-height: 1; }
      #listUnder { position: absolute; left: 40px; top: 80px; width: 300px; height: 20px; overflow: visible; }
      .lrow { position: absolute; left: 40px; width: 500px; height: 74px; transform-origin: 30px 50%; }

<!--
  GameHUD: the EP003 "SecondQuest fishing HUD" (our own design, drawn in code). Reused by every block that shows the
  game world (EP003: block E shots E3, E6, E7). It is a REDRAW in the channel's style of the HUD ideas described in
  docs/ep003/GAME_VISUAL_REFERENCE.md §3/§6 — never the game's art, logo, names or layout:
    · heart health (3 hearts) + a fishbone hunger ring, top-left       (their health/hunger rings → our hearts)
    · a fish-coin money pill with rolling digits, top-right, green "+$" / red "-$" floats
    · a 3-slot hotbar, bottom-centre, gold outline on the selected slot, slam-in fill
    · a type-on combo popup ("FAIL ×N") with our own bonus lines
    · a "???" boss bar with a thin white timer bar under it, top-centre
    · hitmarker, KO stars, SLAP! mark, an "[E] …" prompt pill, a rainbow catch text
  build.py only inlines INCLUDE markers from <project>/compositions/components, so a block template pastes this file
  verbatim between "BEGIN hud.html" / "END hud.html" (block E does; keep the copy in sync).

  Seek-safe: every element is built once at setup; the API only writes tweens into YOUR GSAP timeline, always as
  fromTo/set with immediateRender:false, from a state the module tracks at authoring time. So: call the API in
  chronological order per element (health, money, slots, combo…), all during setup, before the timeline is registered.

  API
    const hud = GameHUD(host, { hearts: 3, money: 0, digits: 5, slots: 3 });   // host = a full-frame layer (1280x720)
    hud.on(tl, at) / hud.off(tl, at)                 // HUD boots in (staggered slide) / switches off (quick fade)
    hud.health(tl, at, v, dur)                       // hearts to v (0..hearts, fractions ok); a refill flashes gold
    hud.hunger(tl, at, frac, dur)                    // fishbone ring 0..1
    hud.money(tl, at, v, dur)                        // digits roll (odometer) to v
    hud.moneyFloat(tl, at, "+$1,250")                // green float if it starts with "+", red otherwise
    hud.slot(tl, at, i, html, { name, select, soft }) -> item el  // slam an item (img/svg html) into slot i (0-based) + name label; soft = a feeble plop
    hud.select(tl, at, i)                            // move the gold outline
    hud.combo(tl, at, title, bonus)                  // type-on popup; title e.g. "FAIL ×2", bonus e.g. "+WRONG TOOL ×2"
    hud.comboOut(tl, at)
    hud.bossIn(tl, at, { name: "???" }) / hud.bossHit(tl, at, frac) / hud.bossTimer(tl, at, dur) / hud.bossOut(tl, at)
    hud.hit(tl, at, x, y, { size, color })            // hitmarker X at frame point x,y
    hud.ko(tl, at, x, y, dur, { rx, ry, size })       // 3 KO stars orbiting a point, for dur
    hud.slap(tl, at, x, y, { scale, dur })            // starburst + "SLAP!"
    hud.prompt(tl, at, key, text, { bottom }) -> el ; hud.promptOut(tl, at, el)
    hud.rainbow(tl, at, text, { x, y, size, dur })    // rainbow catch text (animated gradient)
    hud.jolt(tl, at, k)                               // small HUD shake on a big hit
  Elements: hud.el (root), hud.vit, hud.cash, hud.bar, hud.slots[i], hud.boss, hud.card

<script>

    function GameHUD(host, o) {

      const lines = el("div", "hud-lines", card);

      const bnm = el("div", "nm", boss, "???");
      const hp = el("div", "hp", boss); const trail = el("div", "trail", hp); const fill = el("div", "fill", hp);
      const tm = el("i", "", el("div", "tm", boss));

      const st = { hp: o.hearts, hunger: 1, money: o.money, sel: -1, ttl: null, nLines: 0, card: false, boss: 1, cardShown: false, cashBase: null };
      const setMoney = (v) => {

      const typeOn = (tl, e, at, step) => { const sp = Array.from(e.children); tl.set(sp, { opacity: 0 }, 0);

        on(tl, at) {

        off(tl, at, d) { tl.to([vit, cash, bar, card, boss], { opacity: 0, duration: d == null ? .15 : d, ease: "power1.in" }, at); return api; },
        health(tl, at, v, dur) { const from = st.hp; st.hp = v;
          hearts.forEach((h, i) => { const a = Math.max(0, Math.min(1, from - i)), b = Math.max(0, Math.min(1, v - i)); if (a === b) return;
            const d = (dur == null ? .5 : dur) / Math.max(1, Math.abs(from - v)), off = v < from ? (from - 1 - i) * d : (i - from) * d;
            tl.fromTo(h.f, { height: a * 100 + "%" }, { height: b * 100 + "%", duration: Math.max(.08, d * Math.abs(a - b)), ease: v < from ? "power2.in" : "power2.out", ...IR }, at + Math.max(0, off));
            if (v > from) { tl.fromTo(h.g, { opacity: 1, scale: .4 }, { opacity: 0, scale: 1.6, duration: .45, ease: "power2.out", ...IR }, at + Math.max(0, off) + .1);

        hunger(tl, at, frac, dur) { const a = st.hunger; st.hunger = frac;

        money(tl, at, v, dur) { const P = { v: st.money }, a = st.money; st.money = v;

        moneyFloat(tl, at, txt) { const up = txt.trim()[0] === "+"; const f = el("div", "hud-float " + (up ? "up" : "down"), root, txt);
          tl.fromTo(f, { y: up ? 30 : -14, opacity: 0, scale: .6 }, { y: 0, opacity: 1, scale: 1, duration: .3, ease: "back.out(2.6)", ...IR }, at);
          tl.to(f, { y: up ? -46 : 0, x: up ? 0 : -60, opacity: 0, duration: .5, ease: "power2.in" }, at + 1.0);
          if (!up) tl.fromTo(cash, { x: -8 }, { keyframes: [{ x: 8, duration: .05 }, { x: -6, duration: .05 }, { x: 4, duration: .05 }, { x: 0, duration: .05 }], ...IR }, at);

        slot(tl, at, i, html, opt) { opt = opt || {}; const s = slots[i]; const it = el("div", "item", s.s, html);

          if (opt.soft) tl.fromTo(it, { opacity: 0, scale: .2, y: 10 }, { opacity: 1, scale: .7, y: 0, duration: .35, ease: "back.out(2)", ...IR }, at);   // a feeble plop
          else {
            tl.fromTo(it, { opacity: 1, scale: 2.6, y: -150, rotation: -35 }, { scale: 1, y: 0, rotation: 0, duration: .22, ease: "power3.in", ...IR }, at - .22);

            tl.fromTo(s.rg, { opacity: 1, scale: .5 }, { opacity: 0, scale: 1.5, duration: .4, ease: "power2.out", ...IR }, at); }

        select(tl, at, i) { const prev = st.sel; st.sel = i;

        combo(tl, at, title, bonus) {

        comboOut(tl, at) { tl.to(card, { opacity: 0, x: 60, duration: .2, ease: "power2.in" }, at); return api; },

        bossOut(tl, at) { tl.to(boss, { opacity: 0, y: -60, duration: .25, ease: "power2.in" }, at); return api; },
        hit(tl, at, x, y, opt) { opt = opt || {}; const h = el("div", "hud-hit", root, HITX(opt.color || "#ffffff")); h.style.left = x + "px"; h.style.top = y + "px";
          const s = opt.size || 1;

          const rx = opt.rx || 52, ry = opt.ry || 15, sz = opt.size || 1;

        rainbow(tl, at, text, opt) { opt = opt || {}; const sz = opt.size || 64; const row = el("div", "hud-row", root);
          row.style.left = ((opt.x || 640) - 640) + "px"; row.style.top = ((opt.y || 300) - sz * .6) + "px"; row.style.height = (sz * 1.2) + "px";
          const r = el("div", "hud-rb", row, text); r.style.fontSize = sz + "px";

        jolt(tl, at, k) { k = k || 1; tl.fromTo(root, { x: 0, y: 0 }, { keyframes: [[7, -5], [-6, 4], [4, 3], [-2, -2], [0, 0]].map(([x, y]) => ({ x: x * k, y: y * k, duration: .045 })), ...IR }, at); return api; },
      };
      bar.style.left = (640 - (o.slots * 96 + (o.slots - 1) * 16) / 2) + "px";
      return api;
    }
    return GameHUD;
  })();

      function makeWheel(host) { const S = 200, rO = 190, rI = 120;
        let seg = ""; for (let i = 0; i < N; i++) { const a0 = (i / N) * Math.PI * 2 - Math.PI / 2, a1 = ((i + 1) / N) * Math.PI * 2 - Math.PI / 2;
