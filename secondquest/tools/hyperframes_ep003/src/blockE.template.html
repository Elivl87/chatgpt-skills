    <script>

      const W = 1280, H = 720;
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const R = rng(3005);
      const $ = (s) => document.querySelector(s);
      const mk = (tag, cls, parent, style, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.setAttribute("style", style); if (html != null) e.innerHTML = html; parent.appendChild(e); return e; };
      const SVGNS = "http://www.w3.org/2000/svg";

          const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", `M${x} ${y - h} L${x + h * .32} ${y} L${x - h * .32} ${y} Z`); g.appendChild(p); }
        const g2 = $("#islandPines"); for (let i = 0; i < 16; i++) { const x = -170 + i * 30 + R() * 16; const h = 26 + R() * 30, y = 322 + R() * 8;
          const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", `M${x} ${y - h} L${x + h * .3} ${y} L${x - h * .3} ${y} Z`); g2.appendChild(p); }
      })();

          const h = 120 + R() * 140; reeds.push(mk("div", "reed", host, `left:${x}px; height:${h}px; width:${7 + R() * 5}px`)); } })();

        tl.fromTo(p, { scale: 1.9, rotation: FR[i] * 3, y: -40 }, { scale: 1, rotation: FR[i], y: 0, duration: .12, ease: "power4.in", ...IR }, FT[i] - .1);
        tl.fromTo("#tblCam", { x: 0, y: 0 }, { keyframes: [{ x: 4 - i * 2, y: 5, duration: .04 }, { x: 0, y: 0, duration: .25, ease: "elastic.out(1, .4)" }], ...IR }, FT[i] + .02); });
      tl.fromTo("#tblCam", { rotation: 0 }, { keyframes: [{ rotation: -1.2, duration: .05 }, { rotation: .8, duration: .05 }, { rotation: 0, duration: .3, ease: "elastic.out(1, .4)" }], ...IR }, {{l35.w15}});
      tl.fromTo("#tblLight", { opacity: 1 }, { keyframes: [{ opacity: .3, duration: .05 }, { opacity: 1, duration: .05 }, { opacity: .5, duration: .05 }, { opacity: 1, duration: .1 }], ...IR }, {{l35.w15}});
      // "Usually years later,": the year wheel 2026 -> 2031
      tl.to("#tblDim", { opacity: .78, duration: .4 }, {{l35.w16}});
      tl.set("#years", { autoAlpha: 1 }, {{l35.w17-0.15}});
      tl.fromTo("#years", { scale: .5, y: 40 }, { scale: 1, y: 0, duration: .35, ease: "back.out(2)", ...IR }, {{l35.w17-0.15}});
      const YR = { v: 2026 };
      tl.fromTo(YR, { v: 2026 }, { v: 2031, duration: 1.05, ease: "power2.inOut", onUpdate: () => drawYear(YR.v), ...IR }, {{l35.w17}});
      tl.set("#yLater", { autoAlpha: 1 }, {{l35.w18}});
      tl.fromTo("#yLater", { scale: .3, rotation: -12 }, { scale: 1, rotation: -3, duration: .35, ease: "back.out(2.6)", ...IR }, {{l35.w18}});
      tl.fromTo("#years", { scale: 1 }, { keyframes: [{ scale: 1.08, duration: .07 }, { scale: 1, duration: .45, ease: "elastic.out(1, .4)" }], ...IR }, {{l35.w17+1.05}});
      // "in the same group chat,": the phone, big; the year moves aside
      tl.to("#years", { x: -330, y: 60, scale: .62, duration: .45, ease: "power3.inOut" }, {{l35.w23-0.2}});
      tl.to("#yLater", { x: -330, y: 2, scale: .9, duration: .45, ease: "power3.inOut" }, {{l35.w23-0.2}});
      tl.to("#tblDim", { opacity: .86, duration: .4 }, {{l35.w23-0.2}});
      show("#phoneSh", {{l35.w23-0.15}});
      tl.fromTo("#phoneWrap", { y: 720, rotation: 6 }, { y: 0, rotation: 0, duration: .5, ease: "back.out(1.3)", ...IR }, {{l35.w23-0.15}});
      tl.fromTo("#phoneWrap", { y: 0 }, { y: -6, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 2, ...IR }, {{l35.w23+0.4}});
      chat.show(tl, cDate, {{l35.w23+0.15}});
      chat.show(tl, cJoin, {{l35.w24}});
      chat.show(tl, cSlap, {{l35.w26}});                                                // "context,": the lone message
      tl.set(cSeen, { opacity: 0 }, 0);
      chat.dots(tl, cDots, {{l35.w29}}, {{l35.w32}});                                     // "confusion": the new member types...
      chat.show(tl, cWhat, {{l35.w32+0.05}});
      chat.read(tl, cSlap, {{l35.w34}});                                                   // ...and it ends on "seen"
      tl.fromTo(cSeen, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .25, ease: "back.out(2)", ...IR }, {{l35.w34}});

      // the camera always breathes (2-3 % push, drift <= 1.5 %), its own phase
      tl.fromTo("#breath", { scale: 1.012 }, { scale: 1.034, duration: 5.9, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 5.9), transformOrigin: "50% 50%" }, 0);
      tl.fromTo("#breath", { x: -8 }, { x: 8, duration: 7.9, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 7.9), immediateRender: false }, 0);
      tl.fromTo("#breath", { y: -4 }, { y: 4, duration: 6.7, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 6.7), immediateRender: false }, 0);

      tl.set({}, {}, DUR);
      window.__timelines["main"] = tl;
    </script>
