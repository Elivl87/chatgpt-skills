    <script>
      /* ------------------------------------------------------------------ setup (deterministic) */
      const W = 1280, H = 720;
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const R = rng(4404);
      const $ = (s) => document.querySelector(s);
<!--SRC lakeplate.js-->
<!--SRC friends.js-->
      const $$ = (s) => Array.from(document.querySelectorAll(s));

      const Q = {
        so: {{l44.w1}}, why: {{l44.w2}}, did: {{l44.w3}}, mil: {{l44.w4}}, of: {{l44.w5}}, ppl: {{l44.w6}}, buy: {{l44.w7}}, a: {{l44.w8}}, fishing: {{l44.w9}}, game: {{l44.w10}},
        and: {{l44.w11}}, not: {{l44.w12}}, fishQ: {{l44.w13}},
        nobody: {{l45.w2}}, came: {{l45.w6}}, fishDot: {{l45.w9}}, l46: {{l46}}, thing: {{l46.w6}}, say46: {{l46.w9}}, loud: {{l46.w11}}, l46end: {{l46.end}},
        how: {{l47.w1}}, to: {{l47.w2}}, fish47: {{l47.w3}}, tutorial: {{l47.w7}}, maybe: {{l47.w9}}, is47: {{l47.w11}},
        fishing48: {{l48.w4}}, l49: {{l49}}, worst: {{l49.w7}},
        i: {{l50.w4}}, miss: {{l50.w5}}, you: {{l50.w6}}, without: {{l50.w7}}, ever: {{l50.w8}}, having: {{l50.w9}}, sayIt: {{l50.w11}}, it: {{l50.w12}}, l50end: {{l50.end}},
        so51: {{l51.w1}}, boat: {{l51.w8}}, and51: {{l51.w9}}, whyQ: {{l51.w14}}, next51: {{l51.w15}}, tell: {{l51.w16}}, comments: {{l51.w20}},
        maybe52: {{l52.w1}}, quest: {{l52.w5}}, l52end: {{l52.end}},
      };
      const S4 = Q.l49 + .3;                      // the cut to the close-up happens under the blur of the chat box

      // stars (seeded), denser up high
      // Max and Leo take the empty seats on "boat?" (they were the grey ghosts): seated 3/4 cut-outs, Quest here = 365 px
      // (2026-10-14 fix: Max sat OUTSIDE the stern) both INSIDE the hull with the in-boat 3D layers, scaled to this
      // shot's larger 2D duo (x1.06 from the hull line, knees stay under the rail); Pixie, Quest and the lantern slide toward the stern on the CTA cut
      const BFR = BoatFriends($("#crewClip"), { ids: ["ghostA", "ghostB"], exprs: ["laugh", "neutral"], scale: 1.06, cls: "fr" });
      const GA = BFR.max, GB = BFR.leo;
      const stars = [];
      (function () { const host = $("#stars"); const r = rng(77);
        for (let i = 0; i < 300; i++) { const x = -300 + r() * 1880; const y = -340 + Math.pow(r(), 1.5) * 620; const s = .9 + r() * r() * 2.4;
          const base = (.3 + r() * .7) * (1 - clamp((y - 150) / 170, 0, .75));
          const e = mk("div", "star", host, `left:${x}px; top:${y}px; width:${s}px; height:${s}px; opacity:${base}`);
          if (s > 2.2) e.style.boxShadow = "0 0 4px rgba(220,230,255,.8)";
          stars.push({ e, base, ph: r() * 6.28, sp: .6 + r() * 2.2, tw: r() < .4 }); } })();
      // pines on the far ridge
      (function () { const g = $("#pines"); const r = rng(9); for (let i = 0; i < 30; i++) { const x = -300 + i * 22 + r() * 12; if (x > 340) break; const h = 12 + r() * 16, y = 304 + r() * 6;
        const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", `M${x} ${y - h} L${x + h * .3} ${y} L${x - h * .3} ${y} Z`); g.appendChild(p); }
        for (let i = 0; i < 14; i++) { const x = 1180 + i * 26 + r() * 12; const h = 10 + r() * 12, y = 296 + r() * 4;
        const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", `M${x} ${y - h} L${x + h * .3} ${y} L${x - h * .3} ${y} Z`); g.appendChild(p); } })();
      // ripples around the hull
      const ripples = []; (function () { const host = $("#ripples"); for (let i = 0; i < 3; i++) ripples.push(mk("div", "ripple", host, "left:40px; top:112px; width:540px; height:34px")); })();
      // fireflies (frame coords) - the crickets' visual calm
      const flies = []; (function () { const r = rng(55); const host = $("#flies");
        for (let i = 0; i < 7; i++) flies.push({ e: mk("div", "fly", host), x: 560 + r() * 560, y: 360 + r() * 260, ax: 20 + r() * 30, ay: 10 + r() * 18, sx: .21 + r() * .3, sy: .33 + r() * .3, ph: r() * 6.28, bl: .5 + r() * .9 }); })();
      // the companion fish (v2): base + rendered faces, split at the water line
      function makeFish(host, cls) {
        const rig = mk("div", "fishRig " + (cls || ""), host);
        const ca = mk("div", "fClipA", rig), cb = mk("div", "fClipB", rig);
        const copies = [], faces = { blink: [], lookup: [], wide: [] };
        [[ca, 198, "fishA"], [cb, -62, "fishB"]].forEach(([c, top, k]) => {
          const f = mk("div", "fish " + k, c, `left:65px; top:${top}px`); f.setAttribute("data-hf-motion-blur", '{"samplesPerFrame": 8}');
          const b = mk("img", "fimg", f); b.src = "assets/fish_34.png";
          Object.keys(faces).forEach((n) => { const im = mk("img", "fimg face", f); im.src = `assets/fish_34_${n}.png`; faces[n].push(im); });
          copies.push(f); });
        const wl = mk("div", "wl", rig);

      }
      const fish2 = makeFish($("#fishHost"));
      const fish5 = makeFish($("#fish5Host"));
      // splash rigs (as the hook)
      function makeSplash(host, x, y, s) { const g = mk("div", "abs", host, `left:${x}px; top:${y}px; width:0; height:0`); const rings = [], drops = [];
        for (let i = 0; i < 2; i++) rings.push(mk("div", "ring", g, `left:${-60 * s}px; top:${-12 * s}px; width:${120 * s}px; height:${24 * s}px; opacity:0`));
        for (let i = 0; i < 9; i++) drops.push(mk("div", "drop", g, "left:-4px; top:-4px; opacity:0")); return { rings, drops, s }; }
      // wordmark streams + drips
      const streams = []; (function () { const r = rng(21); const host = $("#streams");
        for (let i = 0; i < 12; i++) { const x = 380 + r() * 520; streams.push(mk("div", "stream", host, `left:${x}px; top:${170 + r() * 14}px; height:${30 + r() * 50}px; opacity:.0`)); } })();
      const drips = []; (function () { const r = rng(31); const host = $("#drips");
        for (let i = 0; i < 24; i++) drips.push({ e: mk("div", "drop", host, "opacity:0; width:6px; height:9px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%"), x: 385 + r() * 510, t0: .25 + r() * 1.7, y0: 178 + r() * 10 }); })();

      /* ------------------------------------------------------------------ water shader (night; seek-driven) */
      // the night lake: new art v1, its derived night grade (the low sun reads as the moon, its glitter as the moon path);
      // sized for the crane (s .85, ty +100) and the CTA tilt (ty -95) with the horizon kept at y 330
      const water = PlateLake($("#plateHost"), ["assets/lake_night.png"], { left: -325, top: -162, w: 1930, h: 1080, cTop: 300, amp: .8 });
      $("#plateHost").appendChild($("#stars"));                           // stars over the plate's sky
      ["#moonWrap", "#lh"].forEach((q) => { $(q).style.display = "none"; });   // the plate has its own moon; no drawn lighthouse on it

      /* ------------------------------------------------------------------ per-frame state (pure function of time) */
      const noise1 = (x) => { const i = Math.floor(x), f = x - i; const h = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }; const k = f * f * (3 - 2 * f); return h(i) * (1 - k) + h(i + 1) * k; };
      // what the composer shows: [time, text] (typing, hesitation, backspace, retype)
      const TYPE = []; (function () {
        const add = (t, s) => TYPE.push([t, s]);
        add(0, "");
        add(Q.i, "I");
        "I miss".slice(1).split("").forEach((c, k) => add(Q.miss - .06 + k * .045, "I miss".slice(0, 2 + k)));
        " you".split("").forEach((c, k) => add(Q.you + k * .05, "I miss you".slice(0, 7 + k)));
        const bs = Q.ever; for (let k = 0; k < 10; k++) add(bs + k * .05 - k * k * .0015, "I miss you".slice(0, 9 - k));
        const msg = "boat tonight?"; const t0 = Q.having - .05; for (let k = 0; k < msg.length; k++) add(t0 + k * .05, msg.slice(0, k + 1));
        add(Q.it, "");                                       // sent
      })();
      const SENT = Q.it;
      function frame(t) {
        water.draw(t, 0);
        // lantern flicker .92 - 1.0
        const fl = .92 + .08 * (noise1(t * 7.3) * .65 + noise1(t * 17.1 + 4) * .35);
        $("#poolBoat").style.opacity = fl; $("#poolWater").style.opacity = fl * .95;
        $("#lantern img").style.filter = `brightness(${(.95 + .15 * fl).toFixed(3)}) drop-shadow(0 0 ${(5 + 4 * fl).toFixed(2)}px rgba(255, 184, 96, .9))`;
        // stars twinkle
        for (const s of stars) if (s.tw) s.e.style.opacity = (s.base * (.55 + .45 * Math.sin(t * s.sp + s.ph))).toFixed(3);
        // fireflies drift and pulse
        for (const f of flies) { const x = f.x + f.ax * Math.sin(t * f.sx + f.ph), y = f.y + f.ay * Math.sin(t * f.sy + f.ph * 1.7);
          const p = Math.pow(.5 + .5 * Math.sin(t * f.bl * 2.2 + f.ph), 3); f.e.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${(.6 + .5 * p).toFixed(3)})`; f.e.style.opacity = (.15 + .75 * p).toFixed(3); }
        // the reflection's water wobble (breaks on the drop)
        const hit = Q.fishQ + .3; const k = t < hit ? 0 : clamp((t - hit) / .7, 0, 1);
        $("#wobT").setAttribute("baseFrequency", `${(.006 + .004 * k).toFixed(4)} ${(.085 + .01 * Math.sin(t * 1.3) + .05 * k).toFixed(4)}`);
        $("#wobM").setAttribute("scale", (13 + 4 * Math.sin(t * 2.1) + 90 * Math.sin(k * Math.PI * .5)).toFixed(2));
        // the composer
        let s = ""; for (const [tt, ss] of TYPE) if (t >= tt) s = ss;
        $("#typed").textContent = s; $("#ph").style.display = s.length || t >= SENT ? "none" : "inline";
        let on = (t % .9) < .5;
        if (t >= Q.i && t < Q.without) on = true;                                  // solid while typing
        if (t >= Q.without && t < Q.ever) on = ((t - Q.without) % .38) < .19;      // hesitates: two blinks
        if (t >= Q.ever && t < SENT) on = true;
        $("#caret").style.opacity = on ? 1 : 0;
        // the wordmark's drips
        const dt = t - Q.whyQ; const wy = gsap.getProperty("#wmMove", "y");
        for (const d of drips) { const u = dt - d.t0; if (u <= 0 || dt > 3) { d.e.style.opacity = 0; continue; }
          const y = d.y0 + wy + u * u * 950; if (y > 262) { d.e.style.opacity = 0; continue; }
          d.e.style.opacity = .9; d.e.style.transform = `translate(${d.x}px, ${y.toFixed(1)}px)`; }
      }

      /* ------------------------------------------------------------------ the timeline */
      const tl = gsap.timeline({ paused: true });
      // every fromTo also carries its from-only properties in the "to" vars (same value): GSAP keeps from-only props in
      // startAt, and the motion-blur sub-frame seeks can revert a startAt mid-tween (seen: SLAP!/REVIVED vanishing)
      { const ft = tl.fromTo.bind(tl);
        tl.fromTo = (t, f, to, at) => { const T = Object.assign({}, to); if (!T.keyframes) for (const k in f) if (!(k in T)) T[k] = f[k]; return ft(t, f, T, at); }; }
      const env = { t: 0 };   // frame(t) is added LAST (end of script): it reads #wmMove's y of the same frame, seek-safe

      // camera: per-layer parallax (x/y/s scale with depth f) + a tilt ty that moves every layer alike
      const LAYERS = [["#L-sky", .08], ["#L-hills", .25], ["#L-water", .55], ["#L-boat", 1]];
      function cam(at, dur, c, ease) {
        const x = c.x || 0, y = c.y || 0, s = c.s || 1, ty = c.ty || 0;
        LAYERS.forEach(([sel, f]) => { const v = { x: x * f, y: y * f + ty, scale: 1 + (s - 1) * Math.min(1.2, .35 + .65 * f) };
          if (dur <= 0) tl.set(sel, v, at); else tl.to(sel, Object.assign(v, { duration: dur, ease: ease || "sine.inOut" }), at); });
      }
      const focus = (px, py, s, ox, oy) => ({ x: (W / 2 - px) * s + (ox || 0), y: (H / 2 - py) * s + (oy || 0), s });
      // the boat rig: centre x, water line y, scale (a cut moves it; the rig's water line sits at y 128 of its box)
      function placeBoat(at, cx, wl, sc) { tl.set("#boatRig", { x: cx - 310, y: wl - 128, scale: sc, transformOrigin: "310px 128px" }, at); }
      function moon(at, dy) { tl.set("#moonWrap", { y: dy }, at); }
      // per-shot breathing (2-3 % push, <= 1.5 % drift, own phase per shot)
      function breathe(t0, t1, ph) { const d = t1 - t0; const a = ph % 2 ? [1.032, 1.012] : [1.012, 1.032];
        tl.fromTo("#breath", { scale: a[0] }, { scale: a[1], duration: d, ease: "sine.inOut", transformOrigin: "50% 50%", immediateRender: false }, t0);
        tl.fromTo("#breath", { x: ph % 2 ? 9 : -9, y: ph % 3 ? -4 : 4 }, { x: ph % 2 ? -9 : 9, y: ph % 3 ? 4 : -4, duration: d, ease: "sine.inOut", immediateRender: false }, t0); }

      // ---------------- ambient: boat bobs, crew breathes, ripples, lighthouse sweeps
      tl.fromTo("#boatBob", { y: -2 }, { y: 3, duration: 1.7, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 1.7) }, 0);
      tl.fromTo("#boatRock", { rotation: -.9 }, { rotation: .9, duration: 2.3, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 2.3), transformOrigin: "50% 90%" }, 0);
      ripples.forEach((r, i) => tl.fromTo(r, { scale: .75, opacity: 0 }, { keyframes: [{ scale: .95, opacity: .7, duration: .8 }, { scale: 1.35, opacity: 0, duration: 1.8 }], repeat: Math.ceil(DUR / 2.6), ease: "none" }, .3 + i * .87));
      ["#pixie", "#quest", "#ghostA", "#ghostB"].forEach((m, i) => {
        if (i < 2) tl.fromTo(`${m} .breathe`, { scaleY: 1 }, { scaleY: 1.018, duration: 1.9 + i * .23, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 1.9), transformOrigin: "50% 100%" }, 0);
        tl.fromTo(`${m} .sway`, { rotation: -1.1 }, { rotation: 1.1, duration: 2.6 + i * .27, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 2.6), transformOrigin: "50% 100%" }, 0); });
      tl.fromTo("#lhBeam", { rotation: -18, scaleX: 1 }, { keyframes: [{ scaleX: .05, rotation: -14, duration: 2.6, ease: "sine.in" }, { scaleX: -1, rotation: -18, duration: 2.6, ease: "sine.out" },
        { scaleX: .05, rotation: -14, duration: 2.6, ease: "sine.in" }, { scaleX: 1, rotation: -18, duration: 2.6, ease: "sine.out" }], repeat: Math.ceil(DUR / 10.4) }, 0);
      tl.fromTo("#lhGlow", { scale: .7 }, { scale: 1.25, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 2.6) }, 0);
      // initial states
      tl.set(["#say", "#dex", "#chat", "#menu", "#title3 .w", "#tut", "#ghostA", "#ghostB"], { opacity: 0 }, 0);
      tl.set(["#fish5Host", "#wmClip"], { opacity: 0 }, 0);
      tl.set("#wmMove", { y: 175 }, 0);
      tl.set("#strike", { scaleX: 0 }, 0); tl.set("#sendBtn", { scale: 0 }, 0);
      [fish2, fish5].forEach((F) => { tl.set(F.copies, { y: 260, rotation: 0 }, 0); tl.set(F.wl, { opacity: 0 }, 0); });

      // ================= G1 l44: the question as a reflection in the water (only the breathing camera moves)
      cam(0, 0, { s: 1 });
      placeBoat(0, 640, 418, .6);
      moon(0, 0);
      breathe(S1, S2, 0);
      const RW = $$("#refl .rw");
      [Q.so, Q.why, Q.did, Q.mil, Q.of, Q.ppl, Q.buy, Q.a, Q.fishing, Q.game, Q.and, Q.not, Q.fishQ].forEach((t, i) =>
        tl.fromTo(RW[i], { opacity: 0, y: 10, scaleX: 1.25 }, { opacity: 1, y: 0, scaleX: 1, duration: .5, ease: "power2.out" }, t - .04));
      const UW = $$("#qUp .uw");                                       // the upright question, word for word with its reflection
      [Q.so, Q.why, Q.did, Q.mil, Q.of, Q.ppl, Q.buy, Q.a, Q.fishing, Q.game, Q.and, Q.not, Q.fishQ].forEach((t, i) =>
        tl.fromTo(UW[i], { opacity: 0, y: -10, scaleX: 1.25 }, { opacity: 1, y: 0, scaleX: 1, duration: .5, ease: "power2.out" }, t - .04));
      // on "fish?" one drop falls; the ripple breaks the text
      const HIT = Q.fishQ + .3, HX = 760, HY = 548;
      tl.set("#dropFall", { x: HX - 3, y: -30, opacity: 1 }, Q.fishQ - .12);
      tl.to("#dropFall", { y: HY - 14, duration: .42, ease: "power2.in" }, Q.fishQ - .12);
