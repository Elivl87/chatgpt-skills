      :root { --gold: #ffc83d; --ink: #16161f; --red: #d6392f; --teal: #167880; --violet: #7860be; --amber: #d69628; --chat: #eeeae2; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #16161f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; }
      .abs { position: absolute; }
      .full { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
      .shot { overflow: hidden; }
      .cam { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
      .img { position: absolute; display: block; }

      /* ---------- channel type ---------- */
      .mk { position: absolute; background: var(--gold); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 4px 5px 0 var(--ink);
        color: var(--ink); font: 800 22px "Inter", sans-serif; letter-spacing: .09em; text-transform: uppercase; padding: 7px 16px 6px; white-space: nowrap; }
      .big { font-family: "Anton", sans-serif; color: var(--gold); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 5px 6px 0 var(--ink); line-height: 1; white-space: nowrap; }
      .stamp { position: absolute; font: 400 84px/1 "Anton", sans-serif; color: #d8342e; border: 8px solid #d8342e; border-radius: 14px; padding: 6px 22px 10px;
        box-shadow: inset 0 0 0 4px rgba(255,255,255,.0), 0 0 0 3px rgba(216,52,46,.25); letter-spacing: .04em; white-space: nowrap; background: rgba(255, 240, 230, .08); }
      .stamp::after { content: ""; position: absolute; inset: 6px; border: 3px solid rgba(216,52,46,.7); border-radius: 6px; }

      /* ---------- our group chat (same palette as the animatic kit: cream screen, channel red for "me") ---------- */
      .phone { position: absolute; border-radius: 42px; background: linear-gradient(160deg, #343844 0%, #1b1d24 55%, #121318 100%); border: 3px solid var(--ink);
        box-shadow: 0 22px 50px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.10); }
      .phone .scr { position: absolute; left: 9px; top: 9px; right: 9px; bottom: 9px; border-radius: 33px; background: var(--chat); overflow: hidden; }
      .phone .hdr { position: absolute; left: 0; right: 0; top: 0; background: #faf8f4; border-bottom: 2px solid #d6d0c5; }
      .phone .notch { position: absolute; left: 50%; top: 8px; width: 84px; height: 20px; margin-left: -42px; border-radius: 10px; background: #1b1d24; }
      .phone .ttl { position: absolute; font: 800 20px "Inter", sans-serif; color: var(--ink); letter-spacing: .06em; white-space: nowrap; }
      .phone .sub { position: absolute; font: 600 14px "Inter", sans-serif; color: #7a756d; white-space: nowrap; }

      tl.to("#clock", { rotation: 0, duration: .05 }, T.time + .28);

      /* ================================================================== C4 "asking": stillness; C6: it types itself */
      const T1 = "want to hang o", T2 = "It's eight dollars. Just get it.";
      const ty = { a: 0, b: 0 };
      const drawTy = () => { $("#ty1").textContent = T1.slice(0, Math.round(ty.a)); $("#ty2").textContent = T2.slice(0, Math.round(ty.b));

      drawTy();

      // C6: match cut on the door knob -> the cursor; the box fills itself and sends; $7.99 stamps out "asking"

      tl.fromTo("#tag799", { opacity: 0, scale: 2.8, rotation: 4, y: -40 }, { opacity: 1, scale: 1, rotation: -8, y: 0, duration: .14, ease: "power4.in" }, T.asking2 - .1);

      /* ================================================================== C5 (l19): the doorway */
      (function () { // floor planks converging to the doorway
        const p = $("#planks"); for (let i = -12; i <= 12; i++) { const x0 = 900 + i * 22, x1 = 900 + i * 150; svg("line", p, { x1: x0, y1: 0, x2: x1, y2: 360, stroke: "rgba(0,0,0,.35)", "stroke-width": 2 }); }

        tl.fromTo(m.e, { scale: 1 }, { scale: .4, duration: .9 + m.r, ease: "sine.inOut", yoyo: true, repeat: 7 }, T.door); });
      // "Want to play?" writes itself in the light
      (function () { let t = T.want - .04; wch.forEach((e, i) => { const d = e.textContent.trim() ? .085 : .04;

      tl.set(["#beamFloor", "#beamAir", "#wallLit", "#motes"], { opacity: 0 }, T.nobody2 + .02);
      tl.fromTo("#roomDark", { opacity: 0 }, { opacity: .38, duration: .08 }, T.nobody2 + .02);
      shake("#doorShk", T.nobody2 + .02, 1.3);
      specks.forEach((s, i) => { const r = rng(900 + i); tl.fromTo(s, { opacity: 0, x: 0, y: 0 }, { keyframes: [{ opacity: .9, duration: .04 }, { x: (r() - .5) * 40, y: 160 + r() * 280, opacity: 0, duration: 1.1 + r() * .6, ease: "power1.in" }] }, T.nobody2 + .04 + r() * .2); });
      tl.to("#roomDark", { opacity: .52, duration: 2, ease: "sine.inOut" }, T.nobody2 + .4);

      tl.set({}, {}, DUR);
      window.__timelines["main"] = tl;
    </script>
