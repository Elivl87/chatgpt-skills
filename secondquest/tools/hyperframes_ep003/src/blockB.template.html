<!--
  ChatPhone: the EP003 group-chat phone (our own UI, no brand), reused in blocks B, C, E, F, G.
  build.py only inlines INCLUDE markers from <project>/compositions/components, so a block template pastes this file
  verbatim between "BEGIN chat.html" / "END chat.html" (block B does). Everything is seek-safe: rows are built once at
  setup in chronological order and only shown/hidden by the GSAP timeline; the list is bottom-anchored (flex-end), so
  "scrolling" is layout, never a measured offset (no font-load race).

  Legibility spec (QUALITY_AUDIT #11): phone >= 82 % of frame height (default 384 x 612 = 85 %), Inter 600 26 px
  bubbles, 34 px line height, bubble max width 70 %, 8 px tails, sender names in their colour, ticks + timestamps,
  "Bought." die-cut stickers (4 px white border + shadow, +-4 deg).

  API
    const chat = ChatPhone(host, {
      title: "The boat", sub: "4 members", clock: "11:42", me: "Q",
      members: { Q: { name: "Quest", color: "#d6392f", avatar: ChatPhone.avImg("assets/quest_wave.png", 688, 1024, 318, 170, 300) },
                 A: { name: "Max", color: "#7860be", avatar: ChatPhone.avSil("#7860be") }, ... },
      w: 384, h: 612 });                        // chat.el (position it), chat.screen, chat.list
    const r1 = chat.msg("A", "It's eight dollars. Just get it.", { time: "11:42 PM" });   // r1.words = word spans
    const r2 = chat.sticker("P", "Bought.", { rot: -4 });
    const d1 = chat.typing("B");                 // a "..." row
    const s0 = chat.system("Today 11:41 PM", { visible: true });   // a centred chip (date / group event); visible = shown from the start
    chat.show(tl, r2, at)                        // pop a row in (list grows, older rows slide up)
    chat.typeWords(tl, r1, [t1, t2, ...])        // shows the row at t1 and each word on its time (one time per word)
    chat.dots(tl, d1, tIn, tOut)                 // typing dots bounce from tIn, the row collapses at tOut
    chat.hide(tl, row, at)                       // collapse a row
    chat.read(tl, row, at)                       // ticks turn "read" (gold)
  Rows must be created in the order they appear (DOM order = chat order). Outgoing rows (who === me) sit on the right.
-->
<style>
  .ch-phone { position: absolute; width: 384px; height: 612px; }

      tl.to("#flipper", { y: 138, rotation: 0, duration: 1.6, ease: "sine.inOut" }, T.invitation + .25);
      tl.fromTo("#envShine", { x: -300, opacity: 1 }, { x: 300, duration: .45, ease: "power2.inOut" }, T.invitation - .05);
      tl.set("#envShine", { opacity: 0 }, T.invitation + .4);
      tl.to("#questWrap", { x: 0, rotation: -1, duration: .6, ease: "power2.out" }, T.its + .1);
      // "invitation": the seal pops, the flap opens, the card slides up
      tl.fromTo("#seal", { scale: 1, rotation: 0 }, { keyframes: [{ scale: 1.35, rotation: -12, duration: .12, ease: "power2.out" }, { scale: 1, rotation: 0, duration: .2 }] , transformOrigin: "50% 50%", immediateRender: false }, T.invitation);
      tl.set("#flap", { transformPerspective: 700, rotationX: 0, zIndex: 4 }, 0);
      tl.to("#flap", { rotationX: 178, duration: .45, ease: "power2.inOut" }, T.invitation + .3);
      tl.set("#flap", { zIndex: 0 }, T.invitation + .52);
      tl.set("#seal", { opacity: 0 }, T.invitation + .52);
      tl.set("#seal", { opacity: 1 }, 0);
      tl.set("#inv", { zIndex: 1 }, 0);
      tl.fromTo("#inv", { y: 0 }, { y: -122, duration: .55, ease: "back.out(1.6)", immediateRender: false }, T.invitation + .62);
      invBurst.forEach((b, i) => tl.fromTo(b, { opacity: 0, y: 0 }, { keyframes: [{ opacity: 1, y: -24, duration: .14, ease: "power2.out" }, { opacity: 0, y: -56, duration: .34 }], immediateRender: false }, T.invitation + .78 + (i % 2) * .03));
      tl.set(invBurst, { opacity: 0 }, 0);
      cam("#pushRoom", T.invitation + .2, 1.4, focus(720, 335, 1.12), "power2.inOut");
      // ================= B1b (b02): the same room racks out of focus; the numbers land over it =================
      cam("#pushRoom", T.invitation + 1.6, T.because - T.invitation - 1.8, focus(700, 345, 1.16), "none");   // the slow push continues (no snap)
      tl.to("#kickRoom", { filter: "blur(7px) saturate(1.1)", duration: .45, ease: "power2.inOut" }, T.makers - .3);
      tl.set("#kickRoom", { filter: "blur(0px) saturate(1)" }, 0);
      tl.to("#numsDim", { opacity: 1, duration: .45, ease: "power2.inOut" }, T.makers - .3);
      tl.to("#tag", { opacity: 0, scale: .8, y: -40, duration: .4, ease: "power2.in" }, T.makers - .35);   // the invitation steps aside: no text behind the numbers
      tl.fromTo("#mkHoped", { scale: 0, rotation: -12 }, { scale: 1, rotation: 0, duration: .5, ease: "back.out(2.8)", transformOrigin: "0% 50%" }, T.hoped - .05);
      const hoped = { v: 0 };
      tl.set("#hopedNum", { opacity: 0 }, 0);
      tl.fromTo("#hopedNum", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .3, ease: "power2.out", immediateRender: false }, T.two - .1);
      tl.fromTo(hoped, { v: 0 }, { v: 200000, duration: 1.1, ease: "power3.out", immediateRender: false, onUpdate: () => { $("#hopedNum").textContent = Math.round(hoped.v / 1000) * 1000 >= 1000 ? Math.round(hoped.v).toLocaleString("en-US") : "0"; } }, T.two - .05);
      tl.set("#strike2", { scaleX: 0 }, 0);
      tl.to("#strike2", { scaleX: 1, duration: .35, ease: "power3.out" }, T.by + .12);
      tl.to("#hoped", { scale: .92, x: -330, y: -70, opacity: .6, rotation: -4, duration: .6, ease: "power3.inOut" }, T.one - .5);
      tl.set("#big", { opacity: 0 }, 0);
      tl.fromTo("#big", { opacity: 0, scale: .7 }, { opacity: 1, scale: 1, duration: .45, ease: "back.out(2)", immediateRender: false }, T.one - .05);
      // v3.3.1: the reel is already rolling when it appears (never reads "00,000,000")
      const REEL = T.ten - .05 - (T.one - .05);
      reelDigits.slice().reverse().forEach((d, i) => tl.fromTo(d.strip, { y: -172 * 7 }, { y: -172 * d.stops, duration: REEL - i * .05, ease: "power2.out" }, T.one - .05 + i * .05));
      tl.fromTo("#nums", { scale: 1 }, { scale: 1.08, duration: T.because - T.ten, ease: "sine.inOut", transformOrigin: "50% 55%", immediateRender: false }, T.ten);   // a visible push on the 10,000,000+ hold
      tl.set("#plus", { opacity: 0 }, 0);
      tl.fromTo("#plus", { scale: 0, rotation: -90, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: .55, ease: "elastic.out(1.2, .4)", immediateRender: false }, T.ten + .2);
      tl.fromTo("#big", { scale: 1 }, { keyframes: [{ scale: 1.1, duration: .08 }, { scale: 1, duration: .6, ease: "elastic.out(1, .35)" }], immediateRender: false }, T.ten);
      tl.set("#src", { opacity: 0 }, 0);
      tl.fromTo("#src", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .5, immediateRender: false }, T.analytics + .6);
      tl.set(numSparks.map((sp) => sp.e), { opacity: 0 }, 0);
      numSparks.forEach((sp) => tl.fromTo(sp.e, { x: 0, y: 0, scale: sp.s, opacity: 1 }, { x: Math.cos(sp.a) * sp.d * 1.6, y: Math.sin(sp.a) * sp.d * .7, opacity: 0, duration: .9, ease: "power3.out", immediateRender: false }, T.ten));
      kickCam("#kickRoom", T.ten + .01, 1.02, .6);
      tl.set("#nums", { opacity: 1 }, 0);
      tl.to("#nums", { opacity: 0, duration: .18, ease: "power2.in" }, T.because - .2);
      // whip out on "Because"
      tl.to("#pushRoom", { x: "-=1500", duration: .24, ease: "power3.in" }, T.because - .02);
      tl.to("#room", { filter: "blur(14px)", duration: .2, ease: "power2.in" }, T.because);

      // ================= B2 (because - message): alone, everyone, the boat, their own copy =================
      cam("#pushStage", 0, 0, focus(640, 380, 1.12));
      tl.fromTo("#kickStage", { x: 1500 }, { x: 0, duration: .32, ease: "power3.out" }, T.because - .02);
      tl.fromTo("#whipIn", { opacity: .9 }, { opacity: 0, duration: .25 }, T.because);
      // v3.3.1: Quest is in the light from "Because" (no empty stage); the light settles on him
      tl.set("#spot", { rotation: -12 }, 0); tl.set("#pool", { x: -120, opacity: .8 }, 0);
      tl.to("#spot", { rotation: 0, duration: .9, ease: "power2.out" }, T.because + .05);
      tl.to("#pool", { x: 0, opacity: 1, duration: .9, ease: "power2.out" }, T.because + .05);
      dusts.forEach((d, i) => tl.fromTo(d, { y: 0, x: 0 }, { y: -40 - (i % 4) * 12, x: (i % 2 ? 10 : -10), duration: 6, ease: "none" }, T.because));
      tl.fromTo("#questSolo", { scale: .94, opacity: 0 }, { scale: 1, opacity: 1, duration: .35, ease: "back.out(2)" }, T.because - .02);
      // a visible push on Quest from "Because" to "alone" (about 10 %), then "alone": the light narrows by half
      cam("#pushStage", T.because, T.alone - T.because, focus(640, 372, 1.23), "sine.inOut");
      cam("#pushStage", T.alone, T.everyone - T.alone - .1, focus(640, 366, 1.28), "power2.out");
      tl.fromTo("#spot .cone", { scaleX: 1 }, { scaleX: .5, duration: .6, ease: "power2.inOut", transformOrigin: "50% 0%" }, T.alone);
      tl.fromTo("#pool", { scaleX: 1 }, { scaleX: .55, duration: .6, ease: "power2.inOut", transformOrigin: "50% 50%", immediateRender: false }, T.alone);
      // "Everyone": the stage lights come up on the four of them seated in the boat (a camera kick on the change)
      tl.set("#boatFrame", { opacity: 0 }, 0);
      tl.set("#boatFrame", { opacity: 1 }, T.everyone - .05);
      tl.set("#questSolo", { opacity: 0 }, T.everyone - .05);
      tl.set(["#spot", "#pool"], { opacity: 0 }, T.everyone - .05);
      tl.set("#stageWash", { opacity: 1 }, T.everyone - .05);
      tl.set("#waterLine", { opacity: 1 }, T.everyone - .05);
      cam("#pushStage", T.everyone - .05, 0, focus(640, 420, 1.06));
      kickCam("#kickStage", T.everyone - .04, 1.035, -.8);
      BFR.max.face(tl, "laugh", 0); BFR.leo.face(tl, "laugh", 0);
      tl.fromTo("#crewBoat", { y: 0 }, { y: 5, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, T.everyone);
      ["#bPixie", "#bQuest", "#bMax", "#bLeo"].forEach((m, i) => tl.fromTo(`${m} .breathe`, { scaleY: 1 }, { scaleY: 1.02, duration: .8 + i * .1, ease: "sine.inOut", yoyo: true, repeat: 5, transformOrigin: "50% 100%", immediateRender: false }, T.everyone));
      waves.forEach((w, i) => tl.fromTo(w, { x: 0 }, { x: 40 + (i % 3) * 14, duration: 5, ease: "none" }, T.everyone));
      cam("#pushStage", T.everyone, T.copy - T.everyone, focus(640, 430, 1.1), "sine.inOut");
      // "their own copy": four game boxes drop into their hands, one each
      ["P", "Q", "A", "B"].forEach((k, i) => {
        const at = T.copy - .18 + i * .13;
        // v3.3.1: no fall across the faces - each box pops up out of the hull into its owner's hands
        const by = BOXY + (k === "B" ? 18 : 0);
        tl.set(boxes[k], { x: SLOT[k], y: by + 70, rotation: (i % 2 ? 12 : -12), opacity: 0 }, 0);
        tl.set(boxes[k], { opacity: 1 }, at);
        tl.to(boxes[k], { y: by, rotation: (i % 2 ? 4 : -4), duration: .3, ease: "back.out(2)" }, at);   // Leo sits lower: his box stays under his chin
        tl.to(boxes[k], { keyframes: [{ scaleY: .82, scaleX: 1.14, duration: .06 }, { scaleY: 1, scaleX: 1, duration: .45, ease: "elastic.out(1.2, .35)" }] }, at + .3);
        boxes[k].pop.forEach((p) => tl.fromTo(p, { opacity: 0, y: 0, scaleY: .4 }, { keyframes: [{ opacity: 1, y: -26, scaleY: 1, duration: .1, ease: "power2.out" }, { opacity: 0, y: -46, duration: .22 }], immediateRender: false }, at + .3));
        tl.set(boxes[k].pop, { opacity: 0 }, 0);
      });
      kickCam("#kickStage", T.copy + .26, 1.03, .8);
      // then hold on the four of them with their copies (slow push) - a clean cut into block C's phone
      cam("#pushStage", T.copy + .4, DUR - T.copy - .4, focus(640, 420, 1.16), "sine.inOut");

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <!--INCLUDE motion-blur.html-->
  </body>
</html>
