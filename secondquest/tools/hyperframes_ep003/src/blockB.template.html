<!--
  ChatPhone: the EP003 group-chat phone (our own UI, no brand), reused in blocks B, C, E, F, G.
  build.py only inlines INCLUDE markers from <project>/compositions/components, so a block template pastes this file
  verbatim between "BEGIN chat.html" / "END chat.html" (block B does). Everything is seek-safe: rows are built once at
  setup in chronological order and only shown/hidden by the GSAP timeline; the list is bottom-anchored (flex-end), so
  "scrolling" is layout, never a measured offset (no font-load race).

  Legibility spec (QUALITY_AUDIT #11): phone >= 82 % of frame height (default 384 x 612 = 85 %), Inter 600 26 px
  bubbles, 34 px line height, bubble max width 70 %, 8 px tails, sender names in their colour, ticks + timestamps,
  "Bought." die-cut stickers (4 px white border + shadow, +-4 deg).

  API
    const chat = ChatPhone(host, {
      title: "The boat", sub: "4 members", clock: "11:42", me: "Q",
      members: { Q: { name: "Quest", color: "#d6392f", avatar: ChatPhone.avImg("assets/quest_wave.png", 688, 1024, 318, 170, 300) },
                 A: { name: "Max", color: "#7860be", avatar: ChatPhone.avSil("#7860be") }, ... },
      w: 384, h: 612 });                        // chat.el (position it), chat.screen, chat.list
    const r1 = chat.msg("A", "It's eight dollars. Just get it.", { time: "11:42 PM" });   // r1.words = word spans
    const r2 = chat.sticker("P", "Bought.", { rot: -4 });
    const d1 = chat.typing("B");                 // a "..." row
    const s0 = chat.system("Today 11:41 PM", { visible: true });   // a centred chip (date / group event); visible = shown from the start
    chat.show(tl, r2, at)                        // pop a row in (list grows, older rows slide up)
    chat.typeWords(tl, r1, [t1, t2, ...])        // shows the row at t1 and each word on its time (one time per word)
    chat.dots(tl, d1, tIn, tOut)                 // typing dots bounce from tIn, the row collapses at tOut
    chat.hide(tl, row, at)                       // collapse a row
    chat.read(tl, row, at)                       // ticks turn "read" (gold)
  Rows must be created in the order they appear (DOM order = chat order). Outgoing rows (who === me) sit on the right.
-->
<style>
  .ch-phone { position: absolute; width: 384px; height: 612px; }
  .ch-body { position: absolute; inset: 0; border-radius: 58px; background: linear-gradient(160deg, #2c2a3c 0%, #1a1924 60%, #121119 100%);
    border: 5px solid #16161f; box-shadow: 9px 11px 0 #16161f, inset 0 0 0 3px #4a4762, inset 0 0 0 7px #16161f; }

  .ch-screen { position: absolute; left: 15px; top: 15px; right: 15px; bottom: 15px; border-radius: 44px; overflow: hidden;
    background: radial-gradient(ellipse 120% 70% at 50% 0%, #fbf7ee 0%, #f2ecdf 60%, #e9e2d2 100%); }
  .ch-island { position: absolute; left: 50%; top: 11px; width: 92px; height: 26px; margin-left: -46px; border-radius: 14px; background: #121119; z-index: 5; }
  .ch-status { position: absolute; left: 0; top: 0; right: 0; height: 44px; padding: 13px 30px 0; display: flex; justify-content: space-between;
    font: 800 15px "Inter", sans-serif; color: #16161f; letter-spacing: .02em; z-index: 4; }
  .ch-status .bat { display: inline-block; width: 26px; height: 13px; border: 2px solid #16161f; border-radius: 4px; position: relative; top: 1px; padding: 1px; }
  .ch-status .bat i { display: block; width: 40%; height: 100%; background: #e5484d; border-radius: 1px; }
  .ch-head { position: absolute; left: 0; top: 44px; right: 0; height: 74px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
    background: rgba(255, 255, 255, .62); border-bottom: 2px solid rgba(22, 22, 31, .12); z-index: 3; }
  .ch-back { width: 14px; height: 14px; border-left: 3px solid #16161f; border-bottom: 3px solid #16161f; transform: rotate(45deg); margin: 0 4px 0 6px; }
  .ch-gav { position: relative; width: 52px; height: 52px; flex: none; }
  .ch-gav .ch-av { position: absolute; width: 30px; height: 30px; border-width: 2px; }
  .ch-title { font: 800 22px/1.05 "Inter", sans-serif; color: #16161f; letter-spacing: -.01em; }
  .ch-sub { font: 600 14px/1.2 "Inter", sans-serif; color: rgba(22, 22, 31, .55); margin-top: 3px; }
  .ch-list { position: absolute; left: 0; right: 0; top: 118px; bottom: 66px; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 12px 6px; overflow: hidden; }
  .ch-input { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 44px; border-radius: 22px; background: #fff; border: 2px solid rgba(22, 22, 31, .14);
    display: flex; align-items: center; padding: 0 16px; font: 600 16px "Inter", sans-serif; color: rgba(22, 22, 31, .38); }
  .ch-input .send { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; background: #ffc83d; border: 2px solid #16161f; }
  /* rows: hidden = max-height 0 (takes no space); shown by the timeline */
  .ch-row { display: flex; align-items: flex-end; gap: 8px; max-height: 0; opacity: 0; overflow: hidden; padding: 0 4px; flex: none; }
  .ch-row.out { justify-content: flex-end; }
  .ch-pad { padding: 7px 0 7px; display: flex; align-items: flex-end; gap: 8px; width: 100%; }
  .ch-row.out .ch-pad { justify-content: flex-end; }
  .ch-av { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; flex: none; position: relative; border: 3px solid #16161f; background: #ddd; }
  .ch-av img { position: absolute; display: block; }
  .ch-av svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .ch-bub { position: relative; max-width: 70%; background: #fff; border-radius: 22px 22px 22px 6px; padding: 9px 15px 8px;
    box-shadow: 0 2px 0 rgba(22, 22, 31, .10), 0 3px 10px rgba(22, 22, 31, .08); transform-origin: 0% 100%; }
  .ch-bub::after { content: ""; position: absolute; left: -8px; bottom: 0; width: 8px; height: 12px; background: #fff;
    clip-path: polygon(100% 0, 100% 100%, 0 100%); }                 /* the 8 px tail */

      invBurst.forEach((b, i) => tl.fromTo(b, { opacity: 0, y: 0 }, { keyframes: [{ opacity: 1, y: -24, duration: .14, ease: "power2.out" }, { opacity: 0, y: -56, duration: .34 }], immediateRender: false }, T.invitation + .78 + (i % 2) * .03));
      tl.set(invBurst, { opacity: 0 }, 0);
      cam("#pushRoom", T.invitation + .2, 1.4, focus(720, 335, 1.12), "power2.inOut");
      // whip out on "Because"
      tl.to("#pushRoom", { x: "-=1500", duration: .24, ease: "power3.in" }, T.because - .02);
      tl.to("#room", { filter: "blur(14px)", duration: .2, ease: "power2.in" }, T.because);

      // ================= B2 (because - message): alone, everyone, the boat, their own copy =================
      cam("#pushStage", 0, 0, focus(640, 330, 1.18));
      tl.fromTo("#kickStage", { x: 1500 }, { x: 0, duration: .32, ease: "power3.out" }, T.because - .02);
      tl.fromTo("#whipIn", { opacity: .9 }, { opacity: 0, duration: .25 }, T.because);
      // a searchlight looks for someone ("not really a game you play...")
      tl.set("#spot", { rotation: -34 }, 0); tl.set("#pool", { x: -420, opacity: .5 }, 0);
      tl.to("#spot", { keyframes: [{ rotation: 26, duration: 1.1, ease: "sine.inOut" }, { rotation: -14, duration: .8, ease: "sine.inOut" }, { rotation: 0, duration: .45, ease: "back.out(2)" }] }, T.because + .1);
      tl.to("#pool", { keyframes: [{ x: 330, duration: 1.1, ease: "sine.inOut" }, { x: -170, duration: .8, ease: "sine.inOut" }, { x: 0, opacity: 1, duration: .45, ease: "back.out(2)" }] }, T.because + .1);
      dusts.forEach((d, i) => tl.fromTo(d, { y: 0, x: 0 }, { y: -40 - (i % 4) * 12, x: (i % 2 ? 10 : -10), duration: 6, ease: "none" }, T.because));
      // "alone": one avatar, centred and spotlit
      Object.entries(avs).forEach(([k, v]) => tl.set(v.a, { x: SLOT[k], y: AV_Y }, 0));
      tl.set(avs.Q.a, { x: 640, y: 300 }, 0);
      tl.set(avs.Q.inn, { scale: 0 }, 0);
      tl.to(avs.Q.inn, { scale: 1.3, duration: .55, ease: "back.out(2.4)" }, T.alone - .06);
      tl.fromTo(avs.Q.nm, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .3, ease: "back.out(2)", immediateRender: false }, T.alone + .25);
      tl.set(avs.Q.nm, { opacity: 0 }, 0);
      cam("#pushStage", T.alone - .1, 1.3, focus(640, 330, 1.26), "power2.out");
      tl.fromTo("#spot .cone", { scaleX: 1 }, { scaleX: .7, duration: 1.2, ease: "sine.inOut", transformOrigin: "50% 0%" }, T.alone + .1);
      // "Everyone": the lights come up, the others slide in, staggered
      tl.to("#stageWash", { opacity: 1, duration: .4 }, T.everyone - .05);
      tl.to(["#spot", "#pool"], { opacity: 0, duration: .35 }, T.everyone);
      tl.to(avs.Q.a, { x: SLOT.Q, y: AV_Y, duration: .45, ease: "power3.inOut" }, T.everyone - .1);
      tl.to(avs.Q.inn, { scale: 1, duration: .45, ease: "power3.inOut" }, T.everyone - .1);
      [["P", -1, 0], ["A", 1, .12], ["B", 1, .24]].forEach(([k, dir, d]) => {
        tl.set(avs[k].inn, { x: dir * 900 }, 0);
        tl.to(avs[k].inn, { x: 0, duration: .5, ease: "back.out(1.5)" }, T.everyone + d);
        tl.fromTo(avs[k].inn, { rotation: dir * -18 }, { rotation: 0, duration: .8, ease: "elastic.out(1, .45)", immediateRender: false }, T.everyone + d + .1);
      });
      cam("#pushStage", T.everyone - .1, .7, focus(640, 400, 1.0), "power3.inOut");
      // "in the boat": the boat rises under them, they drop into their seats
      tl.set(["#boatRig", "#boatFront"], { y: 420 }, 0);
      tl.set("#waterLine", { opacity: 0 }, 0);
      tl.to(["#boatRig", "#boatFront"], { y: 0, duration: .5, ease: "back.out(1.3)" }, T.boat - .25);
      tl.to("#waterLine", { opacity: 1, duration: .4 }, T.boat - .2);
      ["P", "Q", "A", "B"].forEach((k, i) => tl.to(avs[k].a, { keyframes: [{ y: AV_SEAT + 10, duration: .2, ease: "power2.in" }, { y: AV_SEAT, duration: .4, ease: "elastic.out(1, .4)" }] }, T.boat + .12 + i * .05));
      tl.fromTo(["#boatRig", "#boatFront"], { rotation: -1.2 }, { rotation: 1.2, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 3, transformOrigin: "50% 80%", immediateRender: false }, T.boat + .3);
      ["P", "Q", "A", "B"].forEach((k, i) => tl.fromTo(avs[k].bob, { y: 0 }, { y: -6, duration: .65 + i * .07, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, T.boat + .7));
      waves.forEach((w, i) => tl.fromTo(w, { x: 0 }, { x: 40 + (i % 3) * 14, duration: 5, ease: "none" }, T.boat));
      // "their own copy": four game boxes rain down, one each (pop x4)
      ["P", "Q", "A", "B"].forEach((k, i) => {
        const at = T.copy - .18 + i * .13;
        tl.set(boxes[k], { x: SLOT[k], y: BOXY - 700, rotation: (i % 2 ? 22 : -22), opacity: 0 }, 0);
        tl.set(boxes[k], { opacity: 1 }, at);
        tl.to(boxes[k], { y: BOXY, rotation: (i % 2 ? 4 : -4), duration: .3, ease: "power2.in" }, at);
        tl.to(boxes[k], { keyframes: [{ scaleY: .78, scaleX: 1.18, duration: .06 }, { scaleY: 1, scaleX: 1, duration: .45, ease: "elastic.out(1.2, .35)" }] }, at + .3);
        boxes[k].pop.forEach((p) => tl.fromTo(p, { opacity: 0, y: 0, scaleY: .4 }, { keyframes: [{ opacity: 1, y: -26, scaleY: 1, duration: .1, ease: "power2.out" }, { opacity: 0, y: -46, duration: .22 }], immediateRender: false }, at + .3));
        tl.set(boxes[k].pop, { opacity: 0 }, 0);
        tl.fromTo(avs[k].d, { scale: 1 }, { keyframes: [{ scale: 1.08, duration: .07 }, { scale: 1, duration: .4, ease: "elastic.out(1, .4)" }], immediateRender: false }, at + .32);
      });
      kickCam("#kickStage", T.copy + .26, 1.03, .8);
      kickCam("#kickStage", T.copy + .65, 1.04, -1.2);
      // "So it usually begins the same way": the others dim, the camera leans in on the last box
      cam("#pushStage", T.copy + .9, T.way - T.copy - .9, focus(740, 455, 1.07), "sine.inOut");
      ["P", "Q", "A"].forEach((k) => tl.to([avs[k].a, boxes[k]], { opacity: .35, duration: .6, ease: "sine.inOut" }, T.same - .1));
      tl.fromTo(boxes.B, { rotation: 4 }, { keyframes: [{ rotation: -6, duration: .08 }, { rotation: 6, duration: .08 }, { rotation: -3, duration: .08 }, { rotation: 4, duration: .1 }], immediateRender: false }, T.same + .1);
      // "A message": the last box leaves the boat, spins to the centre and flips into the phone (match cut)
      tl.set(fly, { x: SLOT.B, y: BOXY - 72, opacity: 0, transformPerspective: 1400 }, 0);
      tl.set(fly, { opacity: 1 }, T.way);
      tl.set(boxes.B, { opacity: 0 }, T.way);
      cam("#pushStage", T.way, T.message - T.way, focus(640, 360, 1.0), "power2.inOut");
      tl.to(fly, { x: 640, y: 360, scale: 3.1, rotation: 0, duration: T.message - T.way - .26, ease: "power3.inOut" }, T.way);
      tl.fromTo(fly, { rotationY: 0 }, { rotationY: -25, duration: .4, ease: "sine.inOut", immediateRender: false }, T.way + .2);
      tl.to(fly, { rotationY: 90, scale: 4.25, duration: .26, ease: "power2.in" }, T.message - .26);
      tl.to(["#avs", "#boxes", "#boatRig", "#boatFront", "#waterLine", "#waves"], { opacity: 0, duration: .3 }, T.message - .4);

      // ================= B3 (message - l10): the chat; "It's eight dollars. Just get it." types in =================
      cam("#pushChat", T.message, 0, focus(640, 360, 1.0));
      tl.set("#phoneRig", { transformPerspective: 1600 }, 0);
      tl.fromTo("#phoneFlip", { rotationY: -90, scale: 1.04 }, { rotationY: 0, scale: 1, duration: .42, ease: "back.out(1.4)" }, T.message);
      tl.fromTo("#chatBg", { opacity: 0 }, { opacity: 1, duration: .35 }, T.message);
      tl.fromTo("#phoneHalo", { opacity: .6 }, { opacity: 1, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 5 }, T.message);
      // "group chat": the header title punches
      tl.fromTo(chat.head, { scale: 1 }, { keyframes: [{ scale: 1.06, duration: .1 }, { scale: 1, duration: .5, ease: "elastic.out(1, .4)" }], transformOrigin: "50% 50%", immediateRender: false }, T.group);
      chat.dots(tl, dA, T.chatEnd - .1, T.q1 - .02);
      cam("#pushChat", T.chatEnd - .2, 1.1, focus(640, 452, 1.3), "power2.inOut");
      chat.typeWords(tl, mA, [T.q1, T.q1, T.q2, T.q3, T.q4, T.q5, T.q6]);   // It's | eight | dollars. | Just | get | it.
      tl.fromTo(mA.bub, { scale: 1 }, { keyframes: [{ scale: 1.05, duration: .07 }, { scale: 1, duration: .45, ease: "elastic.out(1, .4)" }], immediateRender: false }, T.q6 + .02);
      cam("#pushChat", T.qEnd + .1, 1.0, focus(640, 420, 1.17), "power2.inOut");

      // ================= B4 (l10): Bought. Bought. Bought. - scale punch + camera kick, bigger each time =================
      chat.dots(tl, dP, T.one, T.b1 - .02);
      chat.show(tl, sP, T.b1 - .02, .26);
      chat.show(tl, sQ, T.b2 - .02, .26);
      chat.dots(tl, dA2, T.b2end + .08, T.b3 - .02);
      chat.show(tl, sA, T.b3 - .02, .26);
      chat.read(tl, sQ, T.b3 + .3);
      [[sP, T.b1, 1.04, 2], [sQ, T.b2, 1.07, -3], [sA, T.b3, 1.1, 4]].forEach(([s, t, k, rot], i) => {
        tl.fromTo(s.bub, { scale: 2.3, opacity: 0 }, { scale: 1, opacity: 1, rotation: s.rot, duration: .22, ease: "power4.in", immediateRender: false }, t - .04);
        tl.fromTo(s.bub, { scale: 1 }, { keyframes: [{ scale: .9, duration: .05 }, { scale: 1, duration: .4, ease: "elastic.out(1.2, .35)" }], immediateRender: false }, t + .18);
        kickCam("#kickChat", t + .18, k, rot);
        const r = rings[i];
        tl.fromTo(r, { scale: .05, opacity: 0 }, { keyframes: [{ opacity: 1, duration: .02 }, { scale: (520 + i * 160) / 600, opacity: 0, duration: .5, ease: "power2.out" }], immediateRender: false }, t + .18);
        tl.set(r, { opacity: 0 }, 0);
        tl.fromTo("#flash", { opacity: 0 }, { keyframes: [{ opacity: .1 + i * .05, duration: .03 }, { opacity: 0, duration: .14 }], immediateRender: false }, t + .18);
      });
      cam("#pushChat", T.b1 - .3, T.b3 - T.b1 + .3, focus(640, 430, 1.22), "sine.inOut");

      // ================= B5 (l11): "I'll get it later." - dead still - "He will not get it later." =================
      cam("#pushChat", T.friend, T.l1 - T.friend, focus(640, 462, 1.32), "power2.inOut");
      chat.dots(tl, dB, T.who, T.l1 - .02);
      chat.typeWords(tl, mB, [T.l1, T.l2, T.l3, T.l4]);                 // I'll | get | it | later.
      // FREEZE: laterEnd .. he - nothing moves (the breathing clock holds too)
      // "He": the typing dots come back... and vanish on "not"
      chat.dots(tl, dB2, T.he, T.not2);
      // the companion fish peeks in at the frame's edge and slow-blinks on "later."
      cam("#pushChat", T.not2, .9, focus(700, 452, 1.24), "power2.inOut");
      tl.set("#fishPeek", { y: 30, rotation: -6, opacity: 0 }, 0);          // fully hidden until it peeks
      tl.set("#fishPeek", { y: 0, opacity: 1 }, T.not2 + .1);
      tl.to("#fishPeek", { y: -132, rotation: -2, duration: .55, ease: "back.out(1.8)" }, T.not2 + .12);
      tl.set(["#fishBlink", "#fishLook"], { opacity: 0 }, 0);
      tl.set("#fishLook", { opacity: 1 }, T.not2 + .12);                  // peeks up at the chat...
      tl.set("#fishLook", { opacity: 0 }, T.get2 + .1);                   // ...then deadpan at the camera
      tl.set("#fishBlink", { opacity: 1 }, T.later2);                     // one slow blink on "later."
      tl.set("#fishBlink", { opacity: 0 }, T.later2 + .5);
      // Leo's avatar greys out on "not"
      tl.fromTo([mB.el, dB2.el].map((r) => r.querySelector(".ch-av")), { filter: "grayscale(0) brightness(1)" }, { filter: "grayscale(1) brightness(.85)", duration: .5, ease: "power2.out", immediateRender: false }, T.not2);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <!--INCLUDE motion-blur.html-->
  </body>
</html>
