<!--
  GameHUD: the EP003 "SecondQuest fishing HUD" (our own design, drawn in code). Reused by every block that shows the
  game world (EP003: block E shots E3, E6, E7). It is a REDRAW in the channel's style of the HUD ideas described in
  docs/ep003/GAME_VISUAL_REFERENCE.md §3/§6 — never the game's art, logo, names or layout:
    · heart health (3 hearts) + a fishbone hunger ring, top-left       (their health/hunger rings → our hearts)
    · a fish-coin money pill with rolling digits, top-right, green "+$" / red "-$" floats
    · a 3-slot hotbar, bottom-centre, gold outline on the selected slot, slam-in fill
    · a type-on combo popup ("FAIL ×N") with our own bonus lines
    · a "???" boss bar with a thin white timer bar under it, top-centre
    · hitmarker, KO stars, SLAP! mark, an "[E] …" prompt pill, a rainbow catch text
  build.py only inlines INCLUDE markers from <project>/compositions/components, so a block template pastes this file
  verbatim between "BEGIN hud.html" / "END hud.html" (block E does; keep the copy in sync).

  Seek-safe: every element is built once at setup; the API only writes tweens into YOUR GSAP timeline, always as
  fromTo/set with immediateRender:false, from a state the module tracks at authoring time. So: call the API in
  chronological order per element (health, money, slots, combo…), all during setup, before the timeline is registered.

  API
    const hud = GameHUD(host, { hearts: 3, money: 0, digits: 5, slots: 3 });   // host = a full-frame layer (1280x720)
    hud.on(tl, at) / hud.off(tl, at)                 // HUD boots in (staggered slide) / switches off (quick fade)
    hud.health(tl, at, v, dur)                       // hearts to v (0..hearts, fractions ok); a refill flashes gold
    hud.hunger(tl, at, frac, dur)                    // fishbone ring 0..1
    hud.money(tl, at, v, dur)                        // digits roll (odometer) to v
    hud.moneyFloat(tl, at, "+$1,250")                // green float if it starts with "+", red otherwise
    hud.slot(tl, at, i, html, { name, select, soft }) -> item el  // slam an item (img/svg html) into slot i (0-based) + name label; soft = a feeble plop
    hud.select(tl, at, i)                            // move the gold outline
    hud.combo(tl, at, title, bonus)                  // type-on popup; title e.g. "FAIL ×2", bonus e.g. "+WRONG TOOL ×2"
    hud.comboOut(tl, at)
    hud.bossIn(tl, at, { name: "???" }) / hud.bossHit(tl, at, frac) / hud.bossTimer(tl, at, dur) / hud.bossOut(tl, at)
    hud.hit(tl, at, x, y, { size, color })            // hitmarker X at frame point x,y
    hud.ko(tl, at, x, y, dur, { rx, ry, size })       // 3 KO stars orbiting a point, for dur
    hud.slap(tl, at, x, y, { scale, dur })            // starburst + "SLAP!"
    hud.prompt(tl, at, key, text, { bottom }) -> el ; hud.promptOut(tl, at, el)
    hud.rainbow(tl, at, text, { x, y, size, dur })    // rainbow catch text (animated gradient)
    hud.jolt(tl, at, k)                               // small HUD shake on a big hit
  Elements: hud.el (root), hud.vit, hud.cash, hud.bar, hud.slots[i], hud.boss, hud.card
-->
<style>
  .hud { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; pointer-events: none; font-family: "Inter", sans-serif; }
  .hud * { box-sizing: border-box; }
  /* ---- vitals: hearts + fishbone hunger ring (top-left, title-safe) ---- */
  .hud-vit { position: absolute; left: 50px; top: 38px; height: 64px; display: flex; align-items: center; gap: 8px; padding: 6px 16px 6px 10px;
    border-radius: 34px; background: rgba(22, 22, 31, .58); border: 3px solid rgba(255, 244, 220, .9); box-shadow: 4px 5px 0 #16161f; }
  .hud-ring { position: relative; width: 50px; height: 50px; margin-right: 4px; }

  /* ---- money pill (top-right) ---- */
  .hud-cash { position: absolute; right: 50px; top: 38px; height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 22px 0 8px;
    border-radius: 34px; background: rgba(22, 22, 31, .58); border: 3px solid rgba(255, 244, 220, .9); box-shadow: 4px 5px 0 #16161f; }

    text-shadow: 0 3px 0 #16161f; }
  .hud-num .cur { margin-right: 4px; color: #ffc83d; }
  .hud-dcol { display: block; height: 42px; overflow: hidden; width: .62em; text-align: center; }

  .hud-float.up { color: #6bd66b; } .hud-float.down { color: #ff5a5a; }

    box-shadow: 4px 5px 0 #16161f; }
  .hud-slot .n { position: absolute; left: 9px; top: 5px; font: 800 17px/1 "Inter", sans-serif; color: rgba(255, 244, 220, .8); }
  .hud-slot .sel { position: absolute; inset: -9px; border-radius: 28px; border: 5px solid #f5c542; box-shadow: 0 0 18px rgba(255, 200, 61, .75), inset 0 0 10px rgba(255, 200, 61, .45); opacity: 0; }
  .hud-slot .item { position: absolute; left: 8px; top: 8px; width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; opacity: 0; }
  .hud-slot .item img, .hud-slot .item svg { max-width: 100%; max-height: 100%; overflow: visible; filter: drop-shadow(2px 3px 0 rgba(22, 22, 31, .8)); }
  .hud-slot .ring { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 5px solid #fff4dc; opacity: 0; }
  .hud-row { position: absolute; left: 0; width: 1280px; display: flex; justify-content: center; align-items: center; }
  .hud-name { font: 800 20px/1 "Inter", sans-serif; letter-spacing: .14em; color: #fff4dc;
    text-transform: uppercase; white-space: nowrap; -webkit-text-stroke: 5px #16161f; paint-order: stroke fill; opacity: 0; }
  /* ---- combo popup (type-on) ---- */
  .hud-card { position: absolute; right: 50px; top: 128px; width: 330px; padding: 14px 20px 14px; border-radius: 18px; background: rgba(22, 22, 31, .78);
    border: 3px solid #ffc83d; box-shadow: 5px 6px 0 #16161f; opacity: 0; transform-origin: 100% 0%; }
  .hud-ttl { position: relative; height: 62px; }
  .hud-ttl .t { position: absolute; left: 0; top: 0; font: 400 58px/1 "Anton", sans-serif; color: #ff5a5a; letter-spacing: .02em; white-space: nowrap;
    -webkit-text-stroke: 5px #16161f; paint-order: stroke fill; text-shadow: 3px 4px 0 #16161f; opacity: 0; }
  .hud-ttl .t span, .hud-line span { opacity: 0; }
  .hud-lines { position: relative; height: 112px; margin-top: 6px; }
  .hud-line { position: absolute; left: 0; font: 800 22px/1 "Inter", sans-serif; color: #ffc83d; letter-spacing: .06em; white-space: nowrap; opacity: 0; }
  .hud-line.new { color: #6bd66b; }
  /* ---- boss bar (top-centre) ---- */
  .hud-boss { position: absolute; left: 50%; top: 36px; width: 500px; margin-left: -250px; opacity: 0; }
  .hud-boss .nm { text-align: center; font: 400 34px/1 "Anton", sans-serif; color: #fff4dc; letter-spacing: .16em; -webkit-text-stroke: 4px #16161f; paint-order: stroke fill;
    text-shadow: 3px 3px 0 #16161f; margin-bottom: 6px; }
  .hud-boss .hp { position: relative; height: 22px; border-radius: 11px; background: #2a1820; border: 3px solid #16161f; box-shadow: 0 0 0 2px rgba(255, 244, 220, .85), 4px 5px 0 #16161f; overflow: hidden; }
  .hud-boss .trail { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #ffb0a0; transform-origin: 0 50%; }
  .hud-boss .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(180deg, #ff7a6e 0%, #e8484a 55%, #b82e3a 100%); transform-origin: 0 50%; }
  .hud-boss .tm { position: relative; margin: 7px auto 0; width: 86%; height: 6px; border-radius: 3px; background: rgba(22, 22, 31, .6); overflow: hidden; }
  .hud-boss .tm i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #ffffff; transform-origin: 0 50%; display: block; }
  /* ---- marks ---- */
  .hud-hit { position: absolute; width: 0; height: 0; opacity: 0; }
  .hud-hit svg { position: absolute; left: -40px; top: -40px; width: 80px; height: 80px; overflow: visible; }
  .hud-ko { position: absolute; width: 0; height: 0; opacity: 0; }
  .hud-ko .s { position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; }
  .hud-ko svg { width: 100%; height: 100%; overflow: visible; }
  .hud-slap { position: absolute; width: 0; height: 0; opacity: 0; }
  .hud-slap .b { position: absolute; left: -135px; top: -105px; width: 270px; height: 210px; }
  .hud-slap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .hud-slap .t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 400 74px/1 "Anton", sans-serif; color: #e5484d;
    -webkit-text-stroke: 5px #16161f; paint-order: stroke fill; transform: rotate(-8deg); }
  .hud-prompt { display: flex; align-items: center; gap: 12px; padding: 8px 20px 8px 8px;
    border-radius: 30px; background: rgba(22, 22, 31, .72); border: 3px solid rgba(255, 244, 220, .9); box-shadow: 4px 5px 0 #16161f; opacity: 0; white-space: nowrap;
    font: 800 25px/1 "Inter", sans-serif; color: #fff4dc; letter-spacing: .02em; }
  .hud-prompt .k { width: 42px; height: 42px; border-radius: 10px; background: #fff4dc; border: 3px solid #16161f; box-shadow: 0 4px 0 #b9ac93;
    display: flex; align-items: center; justify-content: center; color: #16161f; font: 800 23px/1 "Inter", sans-serif; }
  .hud-rb { white-space: nowrap; opacity: 0; font: 400 64px/1.1 "Anton", sans-serif; letter-spacing: .03em;
    background: linear-gradient(90deg, #ff5a5a, #ffb03d, #ffe14d, #6bd66b, #4cc3ff, #9a7bff, #ff6fd8, #ff5a5a); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #16161f) drop-shadow(2px 0 0 #16161f) drop-shadow(-2px 0 0 #16161f) drop-shadow(0 -2px 0 #16161f); }
</style>
<script>
  window.GameHUD = (function () {
    const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
    const IR = { immediateRender: false };
    const HEART = (fill, stroke) => `<svg viewBox="0 0 44 40"><path d="M22 37 C 10 28, 2 21, 2 12.5 C 2 6.5, 6.6 2.5, 12 2.5 C 16.2 2.5, 19.6 5, 22 8.6 C 24.4 5, 27.8 2.5, 32 2.5 C 37.4 2.5, 42 6.5, 42 12.5 C 42 21, 34 28, 22 37 Z" fill="${fill}" stroke="${stroke}" stroke-width="3.2" stroke-linejoin="round"/>` +
      (fill !== "#3a2230" ? `<path d="M9 10.5 C 10 7.5, 12.5 6.2, 15 6.4" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="3" stroke-linecap="round"/>` : "") + `</svg>`;
    // fish coin: a gold disc with an embossed fish (our icon)
    const COIN = `<svg viewBox="0 0 48 48"><circle cx="24" cy="25" r="21" fill="#b9861f"/><circle cx="24" cy="23" r="21" fill="#ffc83d" stroke="#16161f" stroke-width="3"/>` +
      `<circle cx="24" cy="23" r="15.5" fill="none" stroke="#e0a92a" stroke-width="2.4"/>` +
      `<path d="M13 23 C 17 16.5, 26 16, 31 23 C 26 30, 17 29.5, 13 23 Z M31 23 L 37 18.5 L 36 23 L 37 27.5 Z" fill="#c88a17"/><circle cx="17.5" cy="22" r="1.7" fill="#ffe9a8"/>` +
      `<path d="M11 15 C 13 11, 17 9, 20 8.6" fill="none" stroke="#fff3c2" stroke-width="2.6" stroke-linecap="round"/></svg>`;
    // hunger: a ring + a fishbone in the middle
    const RING = (C) => `<svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="rgba(22,22,31,.6)" stroke="#16161f" stroke-width="8"/>` +
      `<circle cx="25" cy="25" r="20" fill="none" stroke="#4a3a3a" stroke-width="5"/>` +
      `<circle class="hud-rf" cx="25" cy="25" r="20" fill="none" stroke="#ff9f43" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0" transform="rotate(-90 25 25)"/>` +
      `<g fill="none" stroke="#fff4dc" stroke-width="2.4" stroke-linecap="round"><path d="M13 25 L 33 25"/><path d="M17 20 L 18.5 25 L 17 30 M21 19 L 22.5 25 L 21 31 M25 19 L 26.5 25 L 25 31 M29 20 L 30 25 L 29 30"/></g>` +
      `<path d="M33 25 L 38 21 L 38 29 Z" fill="#fff4dc"/><circle cx="11" cy="25" r="2.6" fill="#fff4dc"/></svg>`;
    const STAR = `<svg viewBox="-20 -20 40 40"><path d="M0 -19 L 5.4 -6.6 L 18.6 -5.9 L 8.4 2.6 L 11.7 15.4 L 0 8.2 L -11.7 15.4 L -8.4 2.6 L -18.6 -5.9 L -5.4 -6.6 Z" fill="#ffd54a" stroke="#16161f" stroke-width="3" stroke-linejoin="round"/></svg>`;
    const BURST = `<svg viewBox="0 0 270 210"><polygon points="135,0 158,54 218,14 197,77 270,83 208,116 255,172 182,145 166,210 133,156 95,204 89,145 18,176 60,120 0,95 66,72 35,18 108,52" fill="#ffc83d" stroke="#16161f" stroke-width="6" stroke-linejoin="round"/>` +
      `<polygon points="135,40 150,76 190,50 176,92 224,96 184,118 214,154 168,138 158,176 134,140 108,172 104,136 58,154 86,118 46,102 90,88 72,52 116,76" fill="#fff4dc" opacity=".55"/></svg>`;
    const HITX = (c) => `<svg viewBox="-40 -40 80 80"><g stroke="#16161f" stroke-width="10" stroke-linecap="round"><path d="M-30 -30 L -12 -12 M30 -30 L 12 -12 M-30 30 L -12 12 M30 30 L 12 12"/></g>` +
      `<g stroke="${c}" stroke-width="5" stroke-linecap="round"><path d="M-30 -30 L -12 -12 M30 -30 L 12 -12 M-30 30 L -12 12 M30 30 L 12 12"/></g></svg>`;

    function GameHUD(host, o) {
      o = Object.assign({ hearts: 3, money: 0, digits: 5, slots: 3 }, o);
      const root = el("div", "hud", host);
      // vitals
      const vit = el("div", "hud-vit", root);
      const C = 2 * Math.PI * 20;
      const ring = el("div", "hud-ring", vit, RING(C.toFixed(2)));
      const ringFill = ring.querySelector(".hud-rf");
      const hearts = Array.from({ length: o.hearts }, () => { const h = el("div", "hud-heart", vit); el("div", "", h, HEART("#3a2230", "#fff4dc"));
        const f = el("div", "hud-hf", h, HEART("#e8484a", "#fff4dc")); const g = el("div", "hud-hglow", h); return { h, f, g }; });
      // money
      const cash = el("div", "hud-cash", root);
      el("div", "hud-coin", cash, COIN);
      const num = el("div", "hud-num", cash); el("span", "cur", num, "$");
      const cols = [];
      for (let i = o.digits - 1; i >= 0; i--) {
        const c = el("span", "hud-dcol", num); const s = el("span", "hud-dstrip", c);
        for (let k = 0; k <= 10; k++) el("span", "", s, String(k % 10));
        cols.push({ c, s, k: i });
        if (i === 3) el("span", "hud-sep", num, ",");
      }
      // hotbar
      const bar = el("div", "hud-bar", root);
      const slots = Array.from({ length: o.slots }, (_, i) => { const s = el("div", "hud-slot", bar); el("div", "n", s, String(i + 1));
        const sel = el("div", "sel", s); const item = el("div", "item", s); const rg = el("div", "ring", s); return { s, sel, item, rg }; });
      // combo card
      const card = el("div", "hud-card", root);
      const ttl = el("div", "hud-ttl", card);
      const lines = el("div", "hud-lines", card);
      // boss
      const boss = el("div", "hud-boss", root);
      const bnm = el("div", "nm", boss, "???");
      const hp = el("div", "hp", boss); const trail = el("div", "trail", hp); const fill = el("div", "fill", hp);
      const tm = el("i", "", el("div", "tm", boss));

      const st = { hp: o.hearts, hunger: 1, money: o.money, sel: -1, ttl: null, nLines: 0, card: false, boss: 1, cardShown: false, cashBase: null };
      const setMoney = (v) => {
        const big = Math.max(0, v);
        cols.forEach(({ c, s, k }) => {
          const p = Math.pow(10, k);
          let pos;
          if (k === 0) pos = big % 10;
          else { const r = big % p; pos = Math.floor(big / p) % 10 + Math.max(0, Math.min(1, r - (p - 1))); }
          s.style.transform = `translateY(${-pos * 42}px)`;
          c.style.opacity = big >= p || k === 0 ? 1 : .28;            // leading zeros dimmed
        });
      };
      setMoney(o.money);
      const wrapSplit = (txt) => txt.split("").map((ch) => `<span>${ch === " " ? "&nbsp;" : ch.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span>`).join("");
      const typeOn = (tl, e, at, step) => { const sp = Array.from(e.children); tl.set(sp, { opacity: 0 }, 0);
        sp.forEach((s, i) => tl.set(s, { opacity: 1 }, at + i * step)); return at + sp.length * step; };

      const api = {
        el: root, vit, cash, bar, slots, boss, card,
        on(tl, at) {
          tl.set([vit, cash, bar], { opacity: 0 }, 0);
          tl.fromTo(vit, { x: -260, opacity: 0 }, { x: 0, opacity: 1, duration: .45, ease: "back.out(1.7)", ...IR }, at);
          tl.fromTo(cash, { x: 260, opacity: 0 }, { x: 0, opacity: 1, duration: .45, ease: "back.out(1.7)", ...IR }, at + .08);
          tl.fromTo(bar, { y: 170, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: "back.out(1.6)", ...IR }, at + .16);
          slots.forEach((s, i) => tl.fromTo(s.s, { scale: .6 }, { scale: 1, duration: .35, ease: "back.out(3)", ...IR }, at + .3 + i * .06));
          return api; },
        off(tl, at, d) { tl.to([vit, cash, bar, card, boss], { opacity: 0, duration: d == null ? .15 : d, ease: "power1.in" }, at); return api; },
        health(tl, at, v, dur) { const from = st.hp; st.hp = v;
          hearts.forEach((h, i) => { const a = Math.max(0, Math.min(1, from - i)), b = Math.max(0, Math.min(1, v - i)); if (a === b) return;
            const d = (dur == null ? .5 : dur) / Math.max(1, Math.abs(from - v)), off = v < from ? (from - 1 - i) * d : (i - from) * d;
            tl.fromTo(h.f, { height: a * 100 + "%" }, { height: b * 100 + "%", duration: Math.max(.08, d * Math.abs(a - b)), ease: v < from ? "power2.in" : "power2.out", ...IR }, at + Math.max(0, off));
            if (v > from) { tl.fromTo(h.g, { opacity: 1, scale: .4 }, { opacity: 0, scale: 1.6, duration: .45, ease: "power2.out", ...IR }, at + Math.max(0, off) + .1);
              tl.fromTo(h.h, { scale: 1.45 }, { scale: 1, duration: .45, ease: "elastic.out(1.1, .4)", ...IR }, at + Math.max(0, off) + .1); }
            else tl.fromTo(h.h, { x: -5 }, { keyframes: [{ x: 5, duration: .05 }, { x: -3, duration: .05 }, { x: 0, duration: .05 }], ...IR }, at + Math.max(0, off)); });
          return api; },
        hunger(tl, at, frac, dur) { const a = st.hunger; st.hunger = frac;
          tl.fromTo(ringFill, { attr: { "stroke-dashoffset": C * (1 - a) } }, { attr: { "stroke-dashoffset": C * (1 - frac) }, duration: dur == null ? .6 : dur, ease: "power2.inOut", ...IR }, at); return api; },
        money(tl, at, v, dur) { const P = { v: st.money }, a = st.money; st.money = v;
          tl.fromTo(P, { v: a }, { v, duration: dur == null ? .9 : dur, ease: "power2.out", onUpdate: () => setMoney(P.v), ...IR }, at);
          tl.fromTo(num, { scale: 1.25 }, { scale: 1, duration: .5, ease: "elastic.out(1, .4)", ...IR }, at);
          return api; },
        moneyFloat(tl, at, txt) { const up = txt.trim()[0] === "+"; const f = el("div", "hud-float " + (up ? "up" : "down"), root, txt);
          tl.fromTo(f, { y: up ? 30 : -6, opacity: 0, scale: .6 }, { y: up ? 0 : 10, opacity: 1, scale: 1, duration: .3, ease: "back.out(2.6)", ...IR }, at);
          tl.to(f, { y: up ? -46 : 60, opacity: 0, duration: .6, ease: "power2.in" }, at + 1.0);
          if (!up) tl.fromTo(cash, { x: -8 }, { keyframes: [{ x: 8, duration: .05 }, { x: -6, duration: .05 }, { x: 4, duration: .05 }, { x: 0, duration: .05 }], ...IR }, at);
          return f; },
        slot(tl, at, i, html, opt) { opt = opt || {}; const s = slots[i]; const it = el("div", "item", s.s, html);
          tl.set(it, { opacity: 0 }, 0);
          if (opt.soft) tl.fromTo(it, { opacity: 0, scale: .2, y: 10 }, { opacity: 1, scale: .7, y: 0, duration: .35, ease: "back.out(2)", ...IR }, at);   // a feeble plop
          else {
