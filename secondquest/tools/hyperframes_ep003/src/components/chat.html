<!--
  ChatPhone: the EP003 group-chat phone (our own UI, no brand), reused in blocks B, C, E, F, G.
  build.py only inlines INCLUDE markers from <project>/compositions/components, so a block template pastes this file
  verbatim between "BEGIN chat.html" / "END chat.html" (block B does). Everything is seek-safe: rows are built once at
  setup in chronological order and only shown/hidden by the GSAP timeline; the list is bottom-anchored (flex-end), so
  "scrolling" is layout, never a measured offset (no font-load race).

  Legibility spec (QUALITY_AUDIT #11): phone >= 82 % of frame height (default 384 x 612 = 85 %), Inter 600 26 px
  bubbles, 34 px line height, bubble max width 70 %, 8 px tails, sender names in their colour, ticks + timestamps,
  "Bought." die-cut stickers (4 px white border + shadow, +-4 deg).

  API
    const chat = ChatPhone(host, {
      title: "The boat", sub: "4 members", clock: "11:42", me: "Q",
      members: { Q: { name: "Quest", color: "#d6392f", avatar: ChatPhone.avImg("assets/quest_wave.png", 688, 1024, 318, 170, 300) },
                 A: { name: "Max", color: "#7860be", avatar: ChatPhone.avSil("#7860be") }, ... },
      w: 384, h: 612 });                        // chat.el (position it), chat.screen, chat.list
    const r1 = chat.msg("A", "It's eight dollars. Just get it.", { time: "11:42 PM" });   // r1.words = word spans
    const r2 = chat.sticker("P", "Bought.", { rot: -4 });
    const d1 = chat.typing("B");                 // a "..." row
    chat.show(tl, r2, at)                        // pop a row in (list grows, older rows slide up)
    chat.typeWords(tl, r1, [t1, t2, ...])        // shows the row at t1 and each word on its time (one time per word)
    chat.dots(tl, d1, tIn, tOut)                 // typing dots bounce from tIn, the row collapses at tOut
    chat.hide(tl, row, at)                       // collapse a row
    chat.read(tl, row, at)                       // ticks turn "read" (gold)
  Rows must be created in the order they appear (DOM order = chat order). Outgoing rows (who === me) sit on the right.
-->
<style>
  .ch-phone { position: absolute; width: 384px; height: 612px; }
  .ch-body { position: absolute; inset: 0; border-radius: 58px; background: linear-gradient(160deg, #2c2a3c 0%, #1a1924 60%, #121119 100%);
    border: 5px solid #16161f; box-shadow: 9px 11px 0 #16161f, inset 0 0 0 3px #4a4762, inset 0 0 0 7px #16161f; }
  .ch-btn { position: absolute; width: 7px; border-radius: 3px; background: #16161f; }
  .ch-screen { position: absolute; left: 15px; top: 15px; right: 15px; bottom: 15px; border-radius: 44px; overflow: hidden;
    background: radial-gradient(ellipse 120% 70% at 50% 0%, #fbf7ee 0%, #f2ecdf 60%, #e9e2d2 100%); }
  .ch-island { position: absolute; left: 50%; top: 11px; width: 92px; height: 26px; margin-left: -46px; border-radius: 14px; background: #121119; z-index: 5; }
  .ch-status { position: absolute; left: 0; top: 0; right: 0; height: 44px; padding: 13px 30px 0; display: flex; justify-content: space-between;
    font: 800 15px "Inter", sans-serif; color: #16161f; letter-spacing: .02em; z-index: 4; }
  .ch-status .bat { display: inline-block; width: 26px; height: 13px; border: 2px solid #16161f; border-radius: 4px; position: relative; top: 1px; padding: 1px; }
  .ch-status .bat i { display: block; width: 40%; height: 100%; background: #e5484d; border-radius: 1px; }
  .ch-head { position: absolute; left: 0; top: 44px; right: 0; height: 74px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
    background: rgba(255, 255, 255, .62); border-bottom: 2px solid rgba(22, 22, 31, .12); z-index: 3; }
  .ch-back { width: 14px; height: 14px; border-left: 3px solid #16161f; border-bottom: 3px solid #16161f; transform: rotate(45deg); margin: 0 4px 0 6px; }
  .ch-gav { position: relative; width: 52px; height: 52px; flex: none; }
  .ch-gav .ch-av { position: absolute; width: 30px; height: 30px; border-width: 2px; }
  .ch-title { font: 800 22px/1.05 "Inter", sans-serif; color: #16161f; letter-spacing: -.01em; }
  .ch-sub { font: 600 14px/1.2 "Inter", sans-serif; color: rgba(22, 22, 31, .55); margin-top: 3px; }
  .ch-list { position: absolute; left: 0; right: 0; top: 118px; bottom: 66px; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 12px 6px; overflow: hidden; }
  .ch-input { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 44px; border-radius: 22px; background: #fff; border: 2px solid rgba(22, 22, 31, .14);
    display: flex; align-items: center; padding: 0 16px; font: 600 16px "Inter", sans-serif; color: rgba(22, 22, 31, .38); }
  .ch-input .send { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; background: #ffc83d; border: 2px solid #16161f; }
  /* rows: hidden = max-height 0 (takes no space); shown by the timeline */
  .ch-row { display: flex; align-items: flex-end; gap: 8px; max-height: 0; opacity: 0; overflow: hidden; padding: 0 4px; flex: none; }
  .ch-row.out { justify-content: flex-end; }
  .ch-pad { padding: 7px 0 7px; display: flex; align-items: flex-end; gap: 8px; width: 100%; }
  .ch-row.out .ch-pad { justify-content: flex-end; }
  .ch-av { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; flex: none; position: relative; border: 3px solid #16161f; background: #ddd; }
  .ch-av img { position: absolute; display: block; }
  .ch-av svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .ch-bub { position: relative; max-width: 70%; background: #fff; border-radius: 22px 22px 22px 6px; padding: 9px 15px 8px;
    box-shadow: 0 2px 0 rgba(22, 22, 31, .10), 0 3px 10px rgba(22, 22, 31, .08); transform-origin: 0% 100%; }
  .ch-bub::after { content: ""; position: absolute; left: -8px; bottom: 0; width: 8px; height: 12px; background: #fff;
    clip-path: polygon(100% 0, 100% 100%, 0 100%); }                 /* the 8 px tail */
  .ch-row.out .ch-bub { background: #ffd65e; border-radius: 22px 22px 6px 22px; transform-origin: 100% 100%; }
  .ch-row.out .ch-bub::after { left: auto; right: -8px; background: #ffd65e; clip-path: polygon(0 0, 100% 100%, 0 100%); }
  .ch-name { font: 800 15px/1.2 "Inter", sans-serif; margin-bottom: 2px; letter-spacing: .01em; }
  .ch-txt { font: 600 26px/34px "Inter", sans-serif; color: #16161f; letter-spacing: -.005em; }
  .ch-w { display: inline-block; white-space: pre; }
  .ch-meta { font: 600 12px/1 "Inter", sans-serif; color: rgba(22, 22, 31, .45); text-align: right; margin-top: 3px; white-space: nowrap; }
  .ch-tick { display: inline-block; margin-left: 4px; color: rgba(22, 22, 31, .4); font-weight: 800; letter-spacing: -.25em; }
  /* "Bought." sticker: die-cut, 4 px white border, shadow, rotated +-4 deg */
  .ch-stk { position: relative; display: flex; flex-direction: column; align-items: flex-start; }
  .ch-row.out .ch-stk { align-items: flex-end; }
  .ch-stk .ch-name { margin: 0 0 4px 6px; }
  .ch-sticker { display: flex; align-items: center; gap: 10px; padding: 9px 20px 9px 12px; border-radius: 20px; background: #ffc83d;
    border: 4px solid #fff; box-shadow: 0 0 0 2px rgba(22, 22, 31, .18), 0 6px 0 rgba(22, 22, 31, .22), 0 10px 18px rgba(22, 22, 31, .28);
    font: 800 30px/1 "Inter", sans-serif; color: #16161f; letter-spacing: -.01em; }
  .ch-sticker .chk { width: 30px; height: 30px; border-radius: 50%; background: #16161f; display: flex; align-items: center; justify-content: center; flex: none; }
  .ch-sticker .chk svg { width: 18px; height: 18px; }
  .ch-dots { display: flex; gap: 6px; padding: 15px 18px 14px; }
  .ch-dots i { display: block; width: 11px; height: 11px; border-radius: 50%; background: rgba(22, 22, 31, .45); }
  .ch-typer { font: 600 13px/1 "Inter", sans-serif; color: rgba(22, 22, 31, .5); margin: 0 0 6px 2px; white-space: nowrap; }
</style>
<script>
  window.ChatPhone = (function () {
    const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
    const CHECK = '<svg viewBox="0 0 20 20"><path d="M4 10.5 L8.5 15 L16.5 5.5" fill="none" stroke="#ffc83d" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    function ChatPhone(host, o) {
      o = Object.assign({ title: "The boat", sub: "4 members", clock: "11:42", me: "Q", w: 384, h: 612, members: {} }, o);
      const root = el("div", "ch-phone", host); root.style.width = o.w + "px"; root.style.height = o.h + "px";
      el("div", "ch-body", root);
      [[-4, 150, 60], [-4, 222, 60], [o.w - 3, 170, 86]].forEach(([x, y, hh]) => { const b = el("div", "ch-btn", root); Object.assign(b.style, { left: x + "px", top: y + "px", height: hh + "px" }); });
      const screen = el("div", "ch-screen", root);
      el("div", "ch-island", screen);
      el("div", "ch-status", screen, `<span>${o.clock}</span><span><span class="bat"><i></i></span></span>`);
      const head = el("div", "ch-head", screen);
      el("div", "ch-back", head);
      const gav = el("div", "ch-gav", head);
      Object.keys(o.members).slice(0, 4).forEach((k, i) => { const a = avatar(k, gav); a.style.left = (i % 2) * 22 + "px"; a.style.top = Math.floor(i / 2) * 22 + "px"; });
      const tt = el("div", "", head); el("div", "ch-title", tt, o.title); el("div", "ch-sub", tt, o.sub);
      const list = el("div", "ch-list", screen);
      el("div", "ch-input", screen, `Message<span class="send"></span>`);
      function avatar(who, parent) { const m = o.members[who] || {}; const a = el("div", "ch-av", parent, m.avatar || ""); a.style.background = m.color || "#ccc"; return a; }
      function row(who) { const r = el("div", "ch-row" + (who === o.me ? " out" : ""), list); const pad = el("div", "ch-pad", r); if (who !== o.me) avatar(who, pad); return { el: r, pad, who }; }
      const api = {
        el: root, screen, list, head,
        msg(who, text, opt) { opt = opt || {}; const r = row(who); const m = o.members[who] || {};
          const b = el("div", "ch-bub", r.pad);
          if (who !== o.me) el("div", "ch-name", b, m.name || who).style.color = m.color;
          const tx = el("div", "ch-txt", b);
          r.words = text.split(" ").map((w, i, a) => el("span", "ch-w", tx, (w + (i < a.length - 1 ? " " : "")).replace(/&/g, "&amp;").replace(/</g, "&lt;")));
          const meta = el("div", "ch-meta", b, opt.time || "11:42 PM");
          r.tick = who === o.me ? el("span", "ch-tick", meta, "✓✓") : null;
          r.bub = b; r.h = opt.h || 60 + 34 * (opt.lines || 3); return r; },
        sticker(who, text, opt) { opt = opt || {}; const r = row(who); const m = o.members[who] || {};
          const s = el("div", "ch-stk", r.pad);
          if (who !== o.me) el("div", "ch-name", s, m.name || who).style.color = m.color;
          r.bub = el("div", "ch-sticker", s, `<span class="chk">${CHECK}</span><span>${text}</span>`);
          r.bub.style.transform = `rotate(${opt.rot != null ? opt.rot : (who === o.me ? 4 : -4)}deg)`;
          r.rot = opt.rot != null ? opt.rot : (who === o.me ? 4 : -4);
          if (who === o.me) { const meta = el("div", "ch-meta", s, (opt.time || "11:43 PM")); meta.style.marginTop = "8px"; r.tick = el("span", "ch-tick", meta, "✓✓"); }
          r.h = opt.h || 112; return r; },
        typing(who) { const r = row(who); const m = o.members[who] || {};
          const c = el("div", "", r.pad); el("div", "ch-typer", c, `${m.name || who} is typing…`);
          const b = el("div", "ch-bub", c); r.dots = Array.from(el("div", "ch-dots", b, "<i></i><i></i><i></i>").children);
          r.bub = b; r.h = 96; return r; },
        show(tl, r, at, d) { d = d == null ? .32 : d;
          tl.fromTo(r.el, { maxHeight: 0, opacity: 0 }, { maxHeight: r.h, opacity: 1, duration: d, ease: "power2.out", immediateRender: false }, at);
          tl.fromTo(r.bub, { scale: .55, y: 14 }, { scale: 1, y: 0, rotation: r.rot || 0, duration: d + .18, ease: "back.out(2.2)", immediateRender: false }, at);
          return r; },
        typeWords(tl, r, times) { tl.set(r.words, { opacity: 0 }, 0); api.show(tl, r, times[0] - .04);
          r.words.forEach((w, i) => tl.fromTo(w, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .14, ease: "power2.out", immediateRender: false }, times[Math.min(i, times.length - 1)]));
          return r; },
        dots(tl, r, tIn, tOut) { api.show(tl, r, tIn, .26);
          const n = Math.max(1, Math.floor((tOut - tIn) / .42));
          r.dots.forEach((d, i) => tl.fromTo(d, { y: 0, opacity: .45 }, { keyframes: [{ y: -6, opacity: 1, duration: .21, ease: "sine.out" }, { y: 0, opacity: .45, duration: .21, ease: "sine.in" }], repeat: n - 1, immediateRender: false }, tIn + .08 + i * .12));
          api.hide(tl, r, tOut); return r; },
        hide(tl, r, at, d) { tl.to(r.el, { maxHeight: 0, opacity: 0, duration: d || .16, ease: "power2.in" }, at); return r; },
        read(tl, r, at) { if (r.tick) { tl.set(r.tick, { color: "rgba(22, 22, 31, .4)" }, 0); tl.set(r.tick, { color: "#d99a00" }, at); } return r; },
      };
      return api;
    }
    // avatar from a cut-out: a square crop (cx, cy, size in source px) of an image (srcW x srcH) fills the circle
    ChatPhone.avImg = (src, srcW, srcH, cx, cy, size, d) => { d = d || 100; const k = d / size;
      return `<img src="${src}" alt="" style="width:${(srcW * k / d * 100).toFixed(2)}%; left:${(-(cx - size / 2) * k / d * 100).toFixed(2)}%; top:${(-(cy - size / 2) * k / d * 100).toFixed(2)}%" />`; };
    // a silhouette avatar (the faceless friends of the hook), in their colour
    ChatPhone.avSil = (color, dark) => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${color}"/>` +
      `<circle cx="50" cy="40" r="19" fill="${dark || "rgba(22,22,31,.38)"}"/><path d="M14 104 C 16 72, 32 62, 50 62 C 68 62, 84 72, 86 104 Z" fill="${dark || "rgba(22,22,31,.38)"}"/></svg>`;
    return ChatPhone;
  })();
</script>
