    <script>
      /* ------------------------------------------------------------------ setup (deterministic) */
      const W = 1280, H = 720;
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

      /* ------------------------------------------------------------------ water shader (WebGL, seek-driven) */

      /* ------------------------------------------------------------------ the timeline */

      tl.fromTo("#boatBob", { y: -3 }, { y: 4, duration: 1.45, ease: "sine.inOut", yoyo: true, repeat: 24 }, 0);

      tl.to("#headB", { rotation: 0, x: 0, duration: .8, ease: "elastic.out(1.1, .3)" }, 10.7);
      tl.to("#silB .lean", { rotation: 9, x: 8, transformOrigin: "50% 100%", duration: .08 }, 10.62);
      tl.to("#silB .lean", { rotation: 0, x: 0, duration: .9, ease: "elastic.out(1, .3)" }, 10.72);
      tl.to("#armA", { rotation: -25, duration: .6, ease: "power2.inOut" }, 11.0);
      tl.fromTo("#slapBurst", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: .5, ease: "elastic.out(1.1, .45)" }, 10.62);
      tl.to("#slapBurst", { scale: 1.08, duration: .9, ease: "sine.inOut" }, 11.12);
      tl.fromTo("#flash", { opacity: 0 }, { keyframes: [{ opacity: .55, duration: .03 }, { opacity: 0, duration: .14 }] }, 10.62);
      const SH = [[14, -9], [-12, 8], [9, 6], [-7, -5], [5, 3], [-3, -2], [0, 0]];
      tl.to("#shake", { keyframes: SH.map(([x, y]) => ({ x, y, duration: .045 })) }, 10.62);
      tl.set("#ko", { opacity: 0 }, 0);
      tl.to("#ko", { opacity: 1, duration: .1 }, 10.8);
      tl.set("#ko", { opacity: 0 }, 12.1);
      koStars.forEach((s, i) => tl.fromTo(s, { rotation: 0, y: 0 }, { rotation: 360, y: -8, duration: 1.2, ease: "none", repeat: 0 }, 10.8 + i * .06));
      tl.to("#ko", { rotation: 360, duration: 1.3, ease: "none", transformOrigin: "50% 50%" }, 10.8);
      cam(10.8, 1.3, focus(790, 380, 1.95), "sine.out");

      // ---------------- INSERT: the fish money (12.1 - 14.06)
      tl.fromTo("#tblCam", { scale: 1.12, x: 30 }, { scale: 1.02, x: 0, duration: 1.96, ease: "power2.out" }, 12.1);
      tl.fromTo("#lantern", { rotation: -5 }, { rotation: 4, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1, transformOrigin: "50% 0%" }, 12.1);
      tl.fromTo("#tblLight", { opacity: .8 }, { opacity: 1, duration: .25, ease: "sine.inOut", yoyo: true, repeat: 7 }, 12.1);
      tl.fromTo("#tblFish", { x: -700, rotation: -8 }, { x: 0, rotation: 0, duration: .5, ease: "back.out(1.6)" }, 12.4);
      tl.fromTo("#tblChips", { y: -560, rotation: 20 }, { y: 0, rotation: 0, duration: .55, ease: "bounce.out" }, 12.7);
      tl.fromTo("#mkMoney", { y: 80, scale: .6, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: .4, ease: "back.out(2.5)" }, 12.82);
      tl.set("#tblLid", { left: .585 * 380 * 0 + (1 - .655) * 380, top: .5 * 223, width: .07 * 380, height: .105 * 223, scaleY: 0, transformOrigin: "50% 0%" }, 12.1);
      tl.to("#tblLid", { keyframes: [{ scaleY: 1, duration: .12 }, { scaleY: 0, duration: .16 }] }, 13.45);

      // ---------------- INSERT: the scope (14.06 - 15.82): the world seen through a scope, locks on the fish
      const SCOPEFISH = { x: 1000, y: 560 };
      tl.set(buddy, { x: SCOPEFISH.x - 85, y: SCOPEFISH.y - 62, rotation: 0, scale: 1, opacity: 1 }, 14.06);
      MATES.forEach((m) => tl.set(m, { opacity: 0 }, 14.06));
      tl.set(["#boatEnter", "#ripples"], { opacity: 0 }, 14.06);
      cam(14.06, 0, focus(SCOPEFISH.x, SCOPEFISH.y, 2.4, -140, 70));
      cam(14.06, 1.7, focus(SCOPEFISH.x, SCOPEFISH.y, 2.6), "power2.out");
      tl.fromTo("#scopeRig", { x: -260, y: 90 }, { keyframes: [{ x: 120, y: -40, duration: .4, ease: "sine.inOut" }, { x: -40, y: 30, duration: .3, ease: "sine.inOut" }, { x: 0, y: 0, duration: .32, ease: "back.out(2)" }] }, 14.06);
      tl.fromTo("#dot", { scale: 1 }, { scale: 2.2, duration: .12, yoyo: true, repeat: 3, ease: "sine.inOut" }, 14.84);
      tl.to(buddyLid, { keyframes: [{ scaleY: 1, duration: .14 }, { scaleY: 0, duration: .2 }] }, 15.15);

      // ---------------- NUMBERS (15.82 - 25.95): the lake out of focus behind the cards
      tl.set(buddy, { opacity: 0 }, 15.82);
      MATES.forEach((m) => tl.set(m, { opacity: 1 }, 15.82));
      tl.set(["#boatEnter", "#ripples"], { opacity: 1 }, 15.82);
      tl.set("#breath", { filter: "blur(7px) saturate(1.1)" }, 15.82);
      tl.set("#numsDim", { opacity: 1 }, 15.82);
      cam(15.82, 0, focus(600, 380, 1.06));
      cam(15.82, 10.1, focus(680, 400, 1.12), "none");
      tl.fromTo("#tag", { y: -460, rotation: -70 }, { y: 0, duration: .5, ease: "power2.in" }, 16.0);
      tl.to("#tag", { rotation: 0, duration: 2.2, ease: "elastic.out(1.15, .22)", transformOrigin: "170px 0px" }, 16.25);
      tl.fromTo("#mkHoped", { scale: 0, rotation: -12 }, { scale: 1, rotation: 0, duration: .5, ease: "back.out(2.8)", transformOrigin: "0% 50%" }, 17.8);
      const hoped = { v: 0 };
      tl.set("#hopedNum", { opacity: 0 }, 15.82);
      tl.fromTo("#hopedNum", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .3, ease: "power2.out" }, 19.25);
      tl.to(hoped, { v: 200000, duration: 1.1, ease: "power3.out", onUpdate: () => { $("#hopedNum").textContent = Math.round(hoped.v / 1000) * 1000 >= 1000 ? Math.round(hoped.v).toLocaleString("en-US") : "0"; } }, 19.3);
      tl.fromTo("#strike", { scaleX: 0 }, { scaleX: 1, duration: .35, ease: "power3.out" }, 21.5);
      tl.to("#hoped", { scale: .62, x: 150, y: -60, opacity: .55, rotation: 4, duration: .6, ease: "power3.inOut" }, 22.0);
      tl.to("#tag", { scale: .7, x: -80, y: -40, opacity: .7, duration: .6, ease: "power3.inOut" }, 22.0);
      tl.fromTo("#big", { opacity: 0, scale: .7 }, { opacity: 1, scale: 1, duration: .45, ease: "back.out(2)" }, 22.45);
      reelDigits.slice().reverse().forEach((d, i) => tl.fromTo(d.strip, { y: 0 }, { y: -172 * d.stops, duration: 2.0 - i * .06, ease: "power3.inOut" }, 22.7 + i * .06));
      tl.fromTo("#plus", { scale: 0, rotation: -90, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: .55, ease: "elastic.out(1.2, .4)" }, 25.0);
      tl.fromTo("#big", { scale: 1 }, { keyframes: [{ scale: 1.1, duration: .08 }, { scale: 1, duration: .6, ease: "elastic.out(1, .35)" }], immediateRender: false }, 24.8);
      tl.fromTo("#src", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .5 }, 23.4);
      numSparks.forEach((s) => { tl.fromTo(s.e, { x: 0, y: 0, scale: s.s, opacity: 1 }, { x: Math.cos(s.a) * s.d * 1.6, y: Math.sin(s.a) * s.d * .7, opacity: 0, duration: .9, ease: "power3.out" }, 24.8); });
      tl.set(numSparks.map((s) => s.e), { opacity: 0 }, 15.82);
      tl.to("#shake", { keyframes: [[6, -4], [-5, 3], [3, 2], [0, 0]].map(([x, y]) => ({ x, y, duration: .05 })) }, 24.8);

      // ---------------- FLEET (25.95 - 31.2): "Millions of people bought a fishing game."
      tl.set("#breath", { filter: "none" }, 25.95);
      tl.set("#numsDim", { opacity: 0 }, 25.95);
      tl.set("#L-fleet", { opacity: 0 }, 0);
      tl.set("#L-fleet", { opacity: 1 }, 25.95);
      cam(25.95, 0, focus(640, 420, 1.2, 0, -30));
      cam(25.95, 4.6, focus(640, 430, 1.0, 0, -90), "power1.inOut");
      fleet.forEach((f, i) => { const dist = Math.hypot(f.x - 640, (f.y - 470) * 3) / 900;
        tl.fromTo(f.inn, { y: 40 * f.sc + 10, scale: .4, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: .55, ease: "back.out(2.4)", transformOrigin: "50% 100%" }, 25.95 + .15 + dist * 1.5);
        tl.fromTo(f.bob, { y: -3 * f.sc * 2, rotation: -1.5 }, { y: 3 * f.sc * 2, rotation: 1.5, duration: 1.2 + R() * .9, ease: "sine.inOut", yoyo: true, repeat: 5, transformOrigin: "50% 90%" }, 25.95 + R() * .5); });
      tl.set(fleet.map((f) => f.inn), { opacity: 0 }, 0);
      // "To do everything else." - card slams, chaos in the boats
      tl.fromTo("#mkElse", { y: -200, scale: 1.4, rotation: -6 }, { y: 0, scale: 1, rotation: -2, duration: .5, ease: "back.out(2.2)" }, 28.05);
      chaos.forEach((c, i) => { const t = 28.3 + i * .2; tl.set(c.e, { opacity: 0 }, 0);
        if (c.kind === "dynamite") { tl.fromTo(c.e, { opacity: 1, y: 20, rotation: 0 }, { y: -c.sz[1] * 1.4, rotation: 200, duration: .5, ease: "power2.out" }, t);
          tl.set(c.e, { opacity: 0 }, t + .55); tl.fromTo(c.boom, { scale: 0, opacity: 1 }, { scale: 1.4, opacity: 0, duration: .6, ease: "power2.out" }, t + .5); tl.set(c.boom, { opacity: 0 }, 0); }
        else if (c.kind === "chips") { tl.fromTo(c.e, { opacity: 1, y: 10, scale: .6 }, { y: -c.sz[1] * 1.2, scale: 1, rotation: -25, duration: .45, ease: "back.out(2)" }, t); tl.to(c.e, { y: 0, opacity: 0, duration: .5, ease: "power2.in" }, t + 1.2); }
        else { tl.fromTo(c.e, { opacity: 1, y: 10, rotation: -40 }, { keyframes: [{ y: -c.sz[1] * 2.2, rotation: 0, duration: .35, ease: "power2.out" }, { y: 20, rotation: 50, duration: .35, ease: "power2.in" }] }, t); tl.set(c.e, { opacity: 0 }, t + .7); } });

      // ---------------- TOGETHER (31.23 - 33.0): back on the hero boat, close and warm
      tl.set("#L-fleet", { opacity: 0 }, 31.18);
      cam(31.18, 0, focus(655, 395, 1.5));
      cam(31.18, 1.8, focus(655, 400, 1.62), "sine.inOut");
      tl.to("#warm", { opacity: .9, duration: 2.2, ease: "sine.inOut" }, 31.2);
      tl.to("#pixie .lean", { rotation: 5, x: 10, duration: 1.0, ease: "back.out(1.6)", transformOrigin: "50% 100%" }, 31.25);
      tl.to("#quest .lean", { rotation: -3, x: -6, duration: 1.0, ease: "back.out(1.6)", transformOrigin: "50% 100%" }, 31.3);
      tl.to("#silA .lean", { rotation: -5, x: -10, duration: 1.0, ease: "back.out(1.6)", transformOrigin: "50% 100%" }, 31.35);
      tl.to("#silB .lean", { rotation: -6, x: -14, duration: 1.0, ease: "back.out(1.6)", transformOrigin: "50% 100%" }, 31.4);
      tl.to("#linePath", { opacity: .5, duration: .5 }, 31.2);

      // ---------------- SO, WHY?: pull back + tilt up; wordmark option 1 "The catch" (Producer, 2026-10-12):
      // a fishing line drops through the frame on "So,", hooks the gold bar of the logo waiting under the frame and
      // reels it up into place on "why", one bobber bounce, then the line goes slack and leaves. No sparkle.
      const WHY = {{l07.w2}};
      cam(WHY - .8, .85, focus(640, 300, 1.08, 0, 20), "power3.inOut");
      const BAR = 166 + 4, LOW = 730;                                   // the logo waits LOW px under its place
      const C = { wy: LOW, hy: -20, sag: 0 };
      const drawCatch = () => {
        gsap.set("#wmGroup", { y: C.wy });
        const hy = C.hy, mid = (hy - 18) / 2;
        const d = `M 644 -10 Q ${644 + C.sag} ${mid} 644 ${hy - 18}`;
        $("#wl").setAttribute("d", d); $("#wl2").setAttribute("d", d);
        gsap.set("#hookG", { y: hy });
      };
      tl.set(C, { wy: LOW, hy: -20, sag: 0, onUpdate: drawCatch }, WHY - .4);
      tl.to(C, { hy: LOW + BAR, duration: .38, ease: "power2.in", onUpdate: drawCatch }, WHY - .4);          // the line drops
      tl.to(C, { wy: 0, hy: BAR, duration: .55, ease: "power3.out", onUpdate: drawCatch }, WHY - .02);      // reeled up
      tl.to(C, { keyframes: [{ wy: 26, hy: BAR + 26, duration: .16, ease: "power2.out" },                   // bobber dip
                             { wy: -6, hy: BAR - 6, duration: .2, ease: "sine.inOut" },
                             { wy: 0, hy: BAR, duration: .22, ease: "sine.out" }], onUpdate: drawCatch }, WHY + .53);
      tl.to(C, { sag: 26, duration: .25, ease: "sine.out", onUpdate: drawCatch }, WHY + 1.15);              // goes slack
      tl.to(C, { hy: -60, duration: .4, ease: "power2.in", onUpdate: drawCatch }, WHY + 1.3);              // and leaves
      tl.fromTo("#wmBar", { scaleX: .6 }, { scaleX: 1, duration: .4, ease: "back.out(2)", immediateRender: false }, WHY + .5);
      tl.to("#shake", { keyframes: [[0, 4], [0, -2], [0, 1], [0, 0]].map(([x, y]) => ({ x, y, duration: .05 })) }, WHY + .53);
      // the companion stays by the boat and looks up at the catch (it no longer dives into the star)
      tl.set(buddy, { x: 900, y: 690, rotation: -8, scale: .9, opacity: 1 }, WHY - .4);
      tl.fromTo(buddy, { y: 690 }, { y: 470, duration: .5, ease: "back.out(2)", immediateRender: false }, WHY + .2);
      tl.to(buddyLid, { keyframes: [{ scaleY: 1, duration: .14 }, { scaleY: 0, duration: .18 }] }, WHY + 1.0);

      // the camera always breathes a little (documentary drift) - on the shake wrapper's parent scale
      tl.fromTo("#breath", { scale: 1 }, { scale: 1.012, duration: 4.5, ease: "sine.inOut", yoyo: true, repeat: 7, transformOrigin: "50% 50%" }, 0);

      tl.set({}, {}, DUR);
      window.__timelines["main"] = tl;
    </script>
