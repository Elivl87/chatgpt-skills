    <script>
      /* ------------------------------------------------------------------ setup (deterministic) */
      const W = 1280, H = 720;
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const R = rng(3003);
      const $ = (s) => document.querySelector(s);
<!--SRC lakeplate.js-->
<!--SRC friends.js-->
      const mk = (tag, cls, parent, style) => { const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.setAttribute("style", style); parent.appendChild(e); return e; };
      const SVGNS = "http://www.w3.org/2000/svg";

      // pines on the far hills and the island (seeded)
      (function () {
        const g = $("#pines"); for (let i = 0; i < 26; i++) { const x = -150 + i * 26 + R() * 14; if (x > 360) break; const h = 16 + R() * 18, y = 296 + R() * 6;
          const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", `M${x} ${y - h} L${x + h * .32} ${y} L${x - h * .32} ${y} Z`); g.appendChild(p); }
        const g2 = $("#islandPines"); for (let i = 0; i < 16; i++) { const x = -170 + i * 30 + R() * 16; const h = 26 + R() * 30, y = 322 + R() * 8;
          const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", `M${x} ${y - h} L${x + h * .3} ${y} L${x - h * .3} ${y} Z`); g2.appendChild(p); }
      })();
      // foreground reeds (bottom corners)
      const reeds = [];
      (function () { const host = $("#reeds");
        for (let i = 0; i < 14; i++) { const left = i < 7; const x = left ? -60 + i * 16 + R() * 8 : 1180 + (i - 7) * 18 + R() * 8;
          const h = 120 + R() * 140; const e = mk("div", "reed", host, `left:${x}px; height:${h}px; width:${7 + R() * 5}px`); reeds.push(e); } })();
      // ripples around the hull
      const ripples = []; (function () { const host = $("#ripples"); for (let i = 0; i < 4; i++) ripples.push(mk("div", "ripple", host, `left:${380}px; top:${585}px; width:520px; height:40px`)); })();

      // fish leapers for "A lot of fish." [x0, x1, waterY, apex, w, delay, img, flip, host]

        else if (c.kind === "chips") { tl.fromTo(c.e, { opacity: 1, y: 10, scale: .6 }, { y: -c.sz[1] * 1.2, scale: 1, rotation: -25, duration: .45, ease: "back.out(2)" }, t); tl.to(c.e, { y: 0, opacity: 0, duration: .5, ease: "power2.in" }, t + 1.2); }
        else { tl.fromTo(c.e, { opacity: 1, y: 10, rotation: -40 }, { keyframes: [{ y: -c.sz[1] * 2.2, rotation: 0, duration: .35, ease: "power2.out" }, { y: 20, rotation: 50, duration: .35, ease: "power2.in" }] }, t); tl.set(c.e, { opacity: 0 }, t + .7); } });

      // ---------------- TOGETHER (31.23 - 33.0): back on the hero boat, close and warm
      tl.set("#L-fleet", { opacity: 0 }, 31.18);
      cam(31.18, 0, focus(655, 395, 1.5));
      cam(31.18, 1.8, focus(655, 400, 1.62), "sine.inOut");
      tl.to("#warm", { opacity: .9, duration: 2.2, ease: "sine.inOut" }, 31.2);
      tl.to("#pixie .lean", { rotation: 5, x: 10, duration: 1.0, ease: "back.out(1.6)", transformOrigin: "50% 100%" }, 31.25);
      tl.to("#quest .lean", { rotation: -3, x: -6, duration: 1.0, ease: "back.out(1.6)", transformOrigin: "50% 100%" }, 31.3);
      MAX.face(tl, "laugh", 31.3); LEO.face(tl, "laugh", 31.3);
      tl.fromTo("#silB .pop", { y: 150 }, { y: 0, duration: .45, ease: "back.out(1.4)", immediateRender: false }, 31.2);   // Leo drops into his seat on "Together."
      tl.to("#silA .lean", { rotation: -5, x: -10, duration: 1.0, ease: "back.out(1.6)", transformOrigin: "50% 100%" }, 31.35);
      tl.to("#silB .lean", { rotation: -6, x: -14, duration: 1.0, ease: "back.out(1.6)", transformOrigin: "50% 100%" }, 31.4);
      tl.to("#linePath", { opacity: .5, duration: .5 }, 31.2);

      // ---------------- SO, WHY?: pull back + tilt up; wordmark option 1 "The catch" (Producer, 2026-10-12):
      // a fishing line drops through the frame on "So,", hooks the gold bar of the logo waiting under the frame and
      // reels it up into place on "why", one bobber bounce, then the line goes slack and leaves. No sparkle.
      const WHY = {{l07.w2}};
      cam(WHY - .8, .85, focus(640, 300, 1.08, 0, 20), "power3.inOut");
      const BAR = 166 + 4, LOW = 230;                                   // the logo waits LOW px under its place
      const C = { wy: LOW, hy: -20, sag: 0 };
      const drawCatch = () => {
        gsap.set("#wmGroup", { y: C.wy });
        const hy = C.hy, mid = (hy - 18) / 2;
        const d = `M 644 -10 Q ${644 + C.sag} ${mid} 644 ${hy - 18}`;
        $("#wl").setAttribute("d", d); $("#wl2").setAttribute("d", d);
        gsap.set("#hookG", { y: hy });
      };
      tl.set(C, { wy: LOW, hy: -20, sag: 0, onUpdate: drawCatch }, WHY - .4);
      tl.set("#wmGroup", { opacity: 0 }, WHY - .4); tl.to("#wmGroup", { opacity: 1, duration: .12 }, WHY - .02);
      tl.to(C, { hy: BAR + 40, duration: .38, ease: "power2.in", onUpdate: drawCatch }, WHY - .4);          // the line drops
      tl.to(C, { wy: 0, hy: BAR, duration: .55, ease: "power3.out", onUpdate: drawCatch }, WHY - .02);      // reeled up
      tl.to(C, { keyframes: [{ wy: 26, hy: BAR + 26, duration: .16, ease: "power2.out" },                   // bobber dip
                             { wy: -6, hy: BAR - 6, duration: .2, ease: "sine.inOut" },
                             { wy: 0, hy: BAR, duration: .22, ease: "sine.out" }], onUpdate: drawCatch }, WHY + .53);
      tl.to(C, { sag: 26, duration: .25, ease: "sine.out", onUpdate: drawCatch }, WHY + 1.15);              // goes slack
      tl.to(C, { hy: -60, duration: .4, ease: "power2.in", onUpdate: drawCatch }, WHY + 1.3);              // and leaves
      tl.fromTo("#wmBar", { scaleX: .6 }, { scaleX: 1, duration: .4, ease: "back.out(2)", immediateRender: false }, WHY + .5);
      tl.to("#shake", { keyframes: [[0, 4], [0, -2], [0, 1], [0, 0]].map(([x, y]) => ({ x, y, duration: .05 })) }, WHY + .53);
      // the companion stays by the boat and looks up at the catch (it no longer dives into the star)
      tl.set(buddy, { x: 900, y: 690, rotation: -8, scale: .9, opacity: 1 }, WHY - .4);
      tl.fromTo(buddy, { y: 690 }, { y: 470, duration: .5, ease: "back.out(2)", immediateRender: false }, WHY + .2);
      tl.set(faceLookup, { opacity: 1 }, WHY - .1);                                                       // looks up at the catch
      tl.to(buddyLid, { keyframes: [{ opacity: 1, duration: .14, ease: "steps(1)" }, { opacity: 0, duration: .18, ease: "steps(1)" }] }, WHY + 1.0);

      // the camera always breathes a little (documentary drift) - on the shake wrapper's parent scale
      tl.fromTo("#breath", { scale: 1.013 }, { scale: 1.037, duration: 5.5, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 5.5), transformOrigin: "50% 50%" }, 0);   // 2-3 % push (Producer, 2026-10-12)
      tl.fromTo("#breath", { x: -8 }, { x: 8, duration: 7.5, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 7.5), immediateRender: false }, 0);   // drift <= 1.5 %
      tl.fromTo("#breath", { y: -4 }, { y: 4, duration: 6.5, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 6.5), immediateRender: false }, 0);

      tl.set({}, {}, DUR);

      /* ------------------------------------------------------------------ H5-H7: the group chat, on the NARRATION clock
         (h-tokens are narration seconds; window.__tl2 is added to the master timeline unwarped by build.py).
         Block B's B3-B5 chat, re-keyed to the hook's lines: "A message in a group chat. 'It's eight dollars. Just get
         it.'" / "Bought. Bought. Bought." / "And one friend who says 'I'll get it later.' He will not get it later." */
      const tl2 = gsap.timeline({ paused: true }); window.__tl2 = tl2;
      { const ft = tl2.fromTo.bind(tl2);
        tl2.fromTo = (t, f, to, at) => { const T = Object.assign({}, to); if (!T.keyframes) for (const k in f) if (!(k in T)) T[k] = f[k]; return ft(t, f, T, at); }; }
      const C2 = {
        start: {{NCHAT}}, end: {{N8}}, message: {{h05.w2}}, group: {{h05.w5}}, chatEnd: {{h05.w6.end}},
        q: [{{h05.w7}}, {{h05.w8}}, {{h05.w9}}, {{h05.w10}}, {{h05.w11}}, {{h05.w12}}], qEnd: {{h05.w12.end}},
        b1: {{h06.w1}}, b2: {{h06.w2}}, b2end: {{h06.w2.end}}, b3: {{h06.w3}}, b3end: {{h06.w3.end}},
        friend: {{h07.w1}}, who: {{h07.w4}}, l: [{{h07.w6}}, {{h07.w7}}, {{h07.w8}}, {{h07.w9}}], laterEnd: {{h07.w9.end}},
        he: {{h07.w10}}, not2: {{h07.w12}}, get2: {{h07.w13}}, later2: {{h07.w15}},
      };
      const FREEZE = [C2.laterEnd, C2.he];                                  // dead still after "later." (block B's B5 beat)
      const MEM = {
        Q: { name: "Quest", color: "#d6392f", img: ["assets/quest_wave.png", 688, 1024, 318, 170, 300] },
        P: { name: "Pixie", color: "#167880", img: ["assets/pixie_wave.png", 680, 1024, 320, 168, 280] },
        A: { name: "Max", color: "#7860be", img: ["assets/max_front_neutral.png", 177, 760, 88.5, 108, 210] },
        B: { name: "Leo", color: "#d69628", img: ["assets/leo_front_sideeye.png", 221, 760, 110.5, 118, 210] },
      };
      const chat = ChatPhone($("#phoneFlip"), {
        title: "The boat", sub: "Quest, Pixie, Max, Leo", clock: "11:42", me: "Q",
        members: Object.fromEntries(Object.entries(MEM).map(([k, m]) => [k, { name: m.name, color: m.color, avatar: ChatPhone.avImg(...m.img) }])),
      });
      chat.system("Today 11:41 PM", { visible: true });
      chat.system("Max named the group “The boat”", { visible: true, h: 52 });
      const dA = chat.typing("A");
      const mA = chat.msg("A", "It's eight dollars. Just get it.", { time: "11:42 PM", lines: 3 });
      const dP = chat.typing("P");
      const sP = chat.sticker("P", "Bought.", { rot: -4 });
      const sQ = chat.sticker("Q", "Bought.", { rot: 4, time: "11:43 PM" });
      const dA2 = chat.typing("A");
      const sA = chat.sticker("A", "Bought.", { rot: -3 });
      const dB = chat.typing("B");
      const mB = chat.msg("B", "I'll get it later.", { time: "11:44 PM", lines: 2 });
      const dB2 = chat.typing("B");
      const NAMEC = { Quest: "#a8241c", Pixie: "#0b5a60", Max: "#5a3fa6", Leo: "#7a4f00" };    // AA on the cream screen
      document.querySelectorAll("#phoneFlip .ch-name, #phoneFlip .ch-typer").forEach((e) => { const k = e.textContent.split(" ")[0]; if (NAMEC[k]) e.style.color = NAMEC[k]; });
      document.querySelectorAll("#phoneFlip .ch-input").forEach((e) => { e.style.color = "rgba(22, 22, 31, .62)"; e.setAttribute("data-critic-ignore", "1"); });
      const prings = [0, 1, 2].map(() => mk("div", "pring", $("#prings"), "left:340px; top:120px; width:600px; height:600px; opacity:0"));
      // the chat camera breathes on its own phase; the breathing clock stops dead during FREEZE
      const env2 = { t: C2.start };
      const breathe2 = () => { const t = env2.t - C2.start; const f0 = FREEZE[0] - C2.start, f1 = FREEZE[1] - C2.start;
        const bt = t < f0 ? t : t < f1 ? f0 : t - (f1 - f0);
        gsap.set("#camChat", { scale: 1.025 + .012 * Math.sin((bt + 4.0) * 2 * Math.PI / 5.5), x: 8 * Math.sin((bt + 6.8) * 2 * Math.PI / 7.5), y: 4 * Math.sin((bt + 2.4) * 2 * Math.PI / 6.5), transformOrigin: "50% 50%" }); };
      tl2.fromTo(env2, { t: C2.start }, { t: C2.end, duration: C2.end - C2.start, ease: "none", onUpdate: breathe2, immediateRender: false }, C2.start);
      const focus2 = (px, py, s, ox, oy) => ({ x: (W / 2 - px) * s + (ox || 0), y: (H / 2 - py) * s + (oy || 0), scale: s });
      const cam2 = (at, dur, f, ease) => dur <= 0 ? tl2.set("#pushChat", f, at) : tl2.to("#pushChat", Object.assign({}, f, { duration: dur, ease: ease || "sine.inOut" }), at);
      const kick2 = (at, sc, rot) => tl2.fromTo("#kickChat", { scale: 1, rotation: 0 }, { keyframes: [{ scale: sc, rotation: rot, duration: .06, ease: "power3.out" }, { scale: 1, rotation: 0, duration: .55, ease: "elastic.out(1.1, .38)" }], transformOrigin: "50% 50%", immediateRender: false }, at);
      // H5: the phone flips in on "message"; "group chat" punches the header; Max types "It's eight dollars. Just get it."
      cam2(0, 0, focus2(640, 360, 1.0));
      tl2.set("#phoneRig", { transformPerspective: 1600 }, 0);
      tl2.set("#phoneFlip", { rotationY: -90, scale: 1.04 }, 0);
      tl2.to("#phoneFlip", { rotationY: 0, scale: 1, duration: .42, ease: "back.out(1.4)" }, C2.start + .02);
      tl2.fromTo("#phoneHalo", { opacity: .6 }, { opacity: 1, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, C2.start);
      tl2.fromTo(chat.head, { scale: 1 }, { keyframes: [{ scale: 1.06, duration: .1 }, { scale: 1, duration: .5, ease: "elastic.out(1, .4)" }], transformOrigin: "50% 50%", immediateRender: false }, C2.group);
      chat.dots(tl2, dA, C2.chatEnd - .1, C2.q[0] - .06);
      cam2(C2.chatEnd - .2, 1.1, focus2(640, 452, 1.3), "power2.inOut");
      chat.typeWords(tl2, mA, C2.q);                                         // It's | eight | dollars. | Just | get | it.
      tl2.fromTo(mA.bub, { scale: 1 }, { keyframes: [{ scale: 1.05, duration: .07 }, { scale: 1, duration: .45, ease: "elastic.out(1, .4)" }], immediateRender: false }, C2.q[5] + .02);
      cam2(C2.qEnd + .1, .9, focus2(640, 420, 1.17), "power2.inOut");
      // H6: Bought. Bought. Bought. - scale punch + camera kick, bigger each time
      chat.dots(tl2, dP, C2.qEnd + .2, C2.b1 - .02);
      chat.show(tl2, sP, C2.b1 - .02, .26);
      chat.show(tl2, sQ, C2.b2 - .02, .26);
      chat.dots(tl2, dA2, C2.b2end + .08, C2.b3 - .02);
      chat.show(tl2, sA, C2.b3 - .02, .26);
      chat.read(tl2, sQ, C2.b3 + .3);
      [[sP, C2.b1, 1.04, 2], [sQ, C2.b2, 1.07, -3], [sA, C2.b3, 1.1, 4]].forEach(([st, t, k, rot], i) => {
        tl2.fromTo(st.bub, { scale: 1.9 }, { scale: 1, rotation: st.rot, duration: .2, ease: "power4.in", immediateRender: false }, t - .04);   // opaque punch-in
        tl2.fromTo(st.bub, { scale: 1 }, { keyframes: [{ scale: .9, duration: .05 }, { scale: 1, duration: .4, ease: "elastic.out(1.2, .35)" }], immediateRender: false }, t + .18);
        kick2(t + .18, k, rot);
        const r = prings[i];
        tl2.fromTo(r, { scale: .05, opacity: 0 }, { keyframes: [{ opacity: 1, duration: .02 }, { scale: (520 + i * 160) / 600, opacity: 0, duration: .5, ease: "power2.out" }], immediateRender: false }, t + .18);
        tl2.set(r, { opacity: 0 }, 0);
        tl2.fromTo("#flash", { opacity: 0 }, { keyframes: [{ opacity: .1 + i * .05, duration: .03 }, { opacity: 0, duration: .14 }], immediateRender: false }, t + .18);
      });
      cam2(C2.b1 - .3, C2.b3 - C2.b1 + .3, focus2(640, 430, 1.22), "sine.inOut");
      // H7: "I'll get it later." - dead still - "He will not get it later." (dots come back... and vanish on "not")
      cam2(C2.friend, C2.l[0] - C2.friend, focus2(640, 462, 1.32), "power2.inOut");
      chat.dots(tl2, dB, C2.who, C2.l[0] - .3);                            // the typing row leaves before his message lands
      chat.typeWords(tl2, mB, C2.l);                                         // I'll | get | it | later.
      chat.dots(tl2, dB2, C2.he, C2.not2);
      cam2(C2.not2, .9, focus2(700, 452, 1.24), "power2.inOut");
      tl2.set("#fishPeek", { y: 30, rotation: -6, opacity: 0 }, 0);
      tl2.set("#fishPeek", { y: 0, opacity: 1 }, C2.not2 + .1);
      tl2.to("#fishPeek", { y: -132, rotation: -2, duration: .55, ease: "back.out(1.8)" }, C2.not2 + .12);
      tl2.set(["#fishBlink", "#fishLook"], { opacity: 0 }, 0);
      tl2.set("#fishLook", { opacity: 1 }, C2.not2 + .12);                 // peeks up at the chat...
      tl2.set("#fishLook", { opacity: 0 }, C2.get2 + .1);                  // ...then deadpan at the camera
      tl2.set("#fishBlink", { opacity: 1 }, C2.later2);                    // one slow blink on "later."
      tl2.set("#fishBlink", { opacity: 0 }, C2.later2 + .5);
      tl2.fromTo([mB.el, dB2.el].map((r) => r.querySelector(".ch-av")), { filter: "grayscale(0) brightness(1)" }, { filter: "grayscale(1) brightness(.85)", duration: .5, ease: "power2.out", immediateRender: false }, C2.not2);
      tl2.set({}, {}, {{NDUR}});
      MAX.talk(tl, 31.36, 32.2); LEO.talk(tl, 31.3, 32.3);                 // "Together.": they laugh (lip-flap)
      // seagulls (our 3D gull): two distant ones cross the opening lake at different depths, flapping then gliding
      { const host = $("#L-water .F");
        Gull(host, { w: 46 }).fly(tl, 0, 7.4, [[1360, 150], [900, 128], [420, 118], [-90, 96]], { flaps: [[0, 1.1], [3.4, 4.3]] });
        Gull(host, { w: 30, flip: true }).fly(tl, .6, 6.8, [[180, 190], [560, 176], [1010, 170], [1380, 150]], { flaps: [[.6, 1.5], [4.2, 4.9]] }); }
      [MAX, LEO].forEach((f, i) => f.blinks(tl, 0, {{DUR}}, 11 + i * 7));   // idle blinks on the friends
      // the chat's round profile pictures are phone UI, not a character acting (the same people act full-figure in the
      // boat): marked for the frame critic's CHAR_BADGE rule
      document.querySelectorAll("#shotChat .ch-av").forEach((e) => e.setAttribute("data-critic-ignore", "1"));
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <!--INCLUDE motion-blur.html-->
