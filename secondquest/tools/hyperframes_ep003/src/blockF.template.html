      :root { --gold: #ffc83d; --ink: #16161f; --red: #e5484d; --max: #7860be; --leo: #d69628; --slime: #9fb86a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #16161f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; }
      .abs { position: absolute; }
      .full { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
      .shot { overflow: hidden; }
      .cam, .push, .kick { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
      .big { font-family: "Anton", sans-serif; color: var(--gold); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 5px 6px 0 var(--ink); letter-spacing: .01em; line-height: 1; white-space: nowrap; }
      .mk { position: absolute; background: var(--gold); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 4px 5px 0 var(--ink);
        color: var(--ink); font: 800 22px "Inter", sans-serif; letter-spacing: .09em; text-transform: uppercase; padding: 7px 16px 6px; white-space: nowrap; }
      .fish { position: absolute; }
      .fish img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; object-fit: contain; }
      .fish img.face { opacity: 0; }
      .star4 { position: absolute; width: 40px; height: 40px; }
      .star4 svg { width: 100%; height: 100%; overflow: visible; }
      .ring { position: absolute; border: 4px solid rgba(255, 216, 110, .9); border-radius: 50%; }
      .stk { position: absolute; display: flex; align-items: center; justify-content: center; padding: 8px 18px 7px; border-radius: 16px; border: 5px solid #fff;
        box-shadow: 0 0 0 2px rgba(22, 22, 31, .35), 0 7px 0 rgba(22, 22, 31, .35), 0 12px 20px rgba(0, 0, 0, .35);
        font: 800 30px/1 "Inter", sans-serif; letter-spacing: .06em; color: #fff; text-transform: uppercase; white-space: nowrap; -webkit-text-stroke: 1px rgba(22, 22, 31, .35); }

      tl.to("#room", { filter: "saturate(.75) brightness(.9)", duration: T.round2 - T.It + .6, ease: "sine.in" }, T.It - .2);

      // ================= F7 (l42): the founders in three page-turns =================
      const BOOK0 = T.and7 - .12;
      cam("#pushBook", 0, 0, focus(640, 360, 1.0));
      tl.set("#bookRig", { transformPerspective: 2400 }, 0);
      tl.fromTo("#desk", { opacity: 0 }, { opacity: 1, duration: .3, immediateRender: false }, BOOK0);
      tl.set("#pg1", { rotationY: 100, transformPerspective: 2400 }, 0);
      tl.to("#pg1", { rotationY: 0, duration: .62, ease: "power3.out" }, BOOK0);
      tl.fromTo("#pg1 .shade", { opacity: .8 }, { opacity: 0, duration: .5, immediateRender: false }, BOOK0);
      tl.set(["#pg2", "#pg3"], { opacity: 0 }, 0);
      tl.set("#pg2", { opacity: 1 }, BOOK0 + .65);
      // "the two friends": two photo slots, taped, two hoodie silhouettes
      [["#pol1", -3, 0], ["#pol2", 2.5, .2]].forEach(([s, r, d]) => { tl.set(s, { opacity: 0 }, 0);
        ft(s, { opacity: 0, scale: 1.5, rotation: r * 5, y: -40 }, { opacity: 1, scale: 1, rotation: r, y: 0, duration: .38, ease: "back.out(2.2)" }, T.two - .05 + d); });
      cam("#pushBook", T.two, 1.6, focus(620, 330, 1.06), "sine.inOut");
      // "founded the studio": a gold FOUNDERS sticker slaps across
      tl.set("#mkFounders", { opacity: 0 }, 0);
      ft("#mkFounders", { opacity: 0, scale: 2.2, rotation: -16 }, { opacity: 1, scale: 1, rotation: -4, duration: .3, ease: "back.out(3)" }, T.founded);
      kickCam("#kickBook", T.founded + .2, 1.02, -.6);
      // "met": a doodle heart draws between them; "high school": the header gets circled
      tl.set("#heart", { strokeDashoffset: +$("#heart").dataset.len + 2 }, 0);
      tl.to("#heart", { strokeDashoffset: 0, duration: .6, ease: "power1.inOut" }, T.met - .05);
      ft("#heart", { scale: 1 }, { keyframes: [{ scale: 1.2, duration: .12 }, { scale: 1, duration: .5, ease: "elastic.out(1, .35)" }], transformOrigin: "50% 50%" }, T.met + .6);
      cam("#pushBook", T.met - .2, .9, focus(640, 300, 1.16), "power2.inOut");
      tl.set("#hsCircle", { strokeDashoffset: +$("#hsCircle").dataset.len + 2 }, 0);
      tl.to("#hsCircle", { strokeDashoffset: 0, duration: .45, ease: "power1.inOut" }, T.high);
      // page turn 1 ("Their")
      const TURN = (sel, at) => { tl.to(sel, { rotationY: -178, duration: .62, ease: "power2.inOut" }, at); tl.to(sel + " .shade", { opacity: .9, duration: .5 }, at); tl.set(sel, { opacity: 0 }, at + .62); };
      TURN("#pg1", T.their - .32);
      cam("#pushBook", T.their - .32, .6, focus(640, 360, 1.0), "power2.inOut");
      tl.set("#pg3", { opacity: 1 }, T.their + .35);
      // "first paid game": a hand-drawn chart; the line wobbles up ... "had not done well": crashes off the bottom
      tl.set("#p2title", { clipPath: "inset(0 100% 0 0)" }, 0);
      tl.to("#p2title", { clipPath: "inset(0 0% 0 0)", duration: .5, ease: "power1.inOut" }, T.first - .1);
      tl.set("#p2axes", { strokeDashoffset: +$("#p2axes").dataset.len + 2 }, 0);
      tl.to("#p2axes", { strokeDashoffset: 0, duration: .5, ease: "power1.inOut" }, T.their);
      tl.set(["#p2hope", "#p2hopeT"], { opacity: 0 }, 0);
      tl.to(["#p2hope", "#p2hopeT"], { opacity: 1, duration: .3 }, T.first + .3);
      tl.set("#p2a", { strokeDashoffset: +$("#p2a").dataset.len + 2 }, 0);
      tl.to("#p2a", { strokeDashoffset: 0, duration: T.had - T.first, ease: "sine.inOut" }, T.first + .25);
      tl.set("#p2b", { strokeDashoffset: +$("#p2b").dataset.len + 2 }, 0);
      tl.to("#p2b", { strokeDashoffset: 0, duration: T.well - T.not7 + .1, ease: "power3.in" }, T.not7);
      tl.set("#p2oops", { opacity: 0 }, 0);
      ft("#p2oops", { opacity: 0, scale: 2, rotation: 30 }, { opacity: 1, scale: 1, rotation: 8, duration: .3, ease: "back.out(3)" }, T.well + .15);
      cam("#pushBook", T.first, T.not7 - T.first, focus(560, 380, 1.08), "sine.inOut");
      cam("#pushBook", T.not7, T.well - T.not7 + .2, focus(720, 470, 1.18), "power2.in");
      kickCam("#kickBook", T.well + .12, 1.035, 1.2);
      ft("#kickBook", { y: 0 }, { keyframes: [12, -8, 5, 0].map((y) => ({ y, duration: .05 })) }, T.well + .12);
      // page turn 2 ("So")
      TURN("#pg2", T.so - .3);
      cam("#pushBook", T.so - .3, .6, focus(640, 360, 1.0), "power2.inOut");
      // "So they made": the line bounces back up and becomes a fishing line with a hook
      tl.set("#p3up", { strokeDashoffset: +$("#p3up").dataset.len + 2 }, 0);
      tl.to("#p3up", { strokeDashoffset: 0, duration: .9, ease: "power2.out" }, T.so + .1);
      tl.set("#p3line", { y: 140 }, 0);
      tl.to("#p3line", { y: 0, duration: .8, ease: "bounce.out" }, T.so + .1);
      tl.set("#p3hook", { opacity: 0 }, 0); tl.set("#p3hook", { opacity: 1 }, T.so + .8);
      ft("#p3hook", { rotation: -25 }, { rotation: 0, duration: 1.4, ease: "elastic.out(1.2, .25)", svgOrigin: "712 296" }, T.so + .8);
      // "a small game": the notebook doodle draws on: a boat, water, two stick friends
      const boatPaths = $$("#p3boat .dr");
      boatPaths.forEach((p, i) => { tl.set(p, { strokeDashoffset: +p.dataset.len + 2 }, 0); tl.to(p, { strokeDashoffset: 0, duration: .35, ease: "power1.inOut" }, T.small - .1 + Math.min(i, 9) * .07); });
      tl.set("#p3cap", { clipPath: "inset(0 100% 0 0)" }, 0);
      tl.to("#p3cap", { clipPath: "inset(0 0% 0 0)", duration: .6, ease: "power1.inOut" }, T.game8);
      cam("#pushBook", T.small - .2, 1.6, focus(700, 440, 1.2), "sine.inOut");
      // "friends doing something": they bob; "silly": B slaps A (soft whip)
      ft("#stickA", { y: 0 }, { y: -6, duration: .25, yoyo: true, repeat: 3, ease: "sine.inOut" }, T.friends7);
      ft("#stickB", { y: 0 }, { y: -6, duration: .25, yoyo: true, repeat: 3, ease: "sine.inOut" }, T.friends7 + .12);
      tl.set("#armB", { rotation: -62, svgOrigin: "748 432" }, 0);
      tl.to("#armB", { rotation: 55, duration: .2, ease: "power2.out", svgOrigin: "748 432" }, T.silly - .27);
      tl.to("#armB", { rotation: -4, duration: .07, ease: "power4.in", svgOrigin: "748 432" }, T.silly - .04);
      tl.to("#armB", { rotation: -62, duration: .5, ease: "power2.inOut", svgOrigin: "748 432" }, T.silly + .35);
      tl.to("#stickA", { rotation: -16, x: -10, duration: .07, svgOrigin: "628 466" }, T.silly + .03);
      tl.to("#stickA", { rotation: 0, x: 0, duration: .8, ease: "elastic.out(1.1, .3)", svgOrigin: "628 466" }, T.silly + .1);
      tl.set(["#slapFx", "#slapTxt"], { opacity: 0 }, 0);
      ft("#slapTxt", { opacity: 0, scale: .2 }, { opacity: 1, scale: 1, duration: .25, ease: "back.out(3)" }, T.silly + .03);
      tl.set("#slapFx", { opacity: 1 }, T.silly + .03);
      tl.to(["#slapFx"], { opacity: 0, duration: .3 }, T.silly + .7);
      ft("#kickBook", { x: 0 }, { keyframes: [{ x: -70, duration: .1, ease: "power3.out" }, { x: 0, duration: .5, ease: "elastic.out(1, .4)" }] }, T.silly + .02);
      // "together": little hearts float up from the boat
      p3hearts.forEach((h, i) => { tl.set(h, { opacity: 0 }, 0); ft(h, { opacity: 0, y: 0, scale: .4 }, { keyframes: [{ opacity: 1, y: -40, scale: 1, duration: .3, ease: "back.out(2)" }, { y: -110, opacity: 0, duration: .9, ease: "sine.in" }] }, T.together + i * .12); });

      // ================= F8 (l43): one phone -> millions of phones, Bought., 10,000,000+, the ping =================
      const showNow = (r) => { tl.set(r.el, { maxHeight: r.h, opacity: 1 }, GRID0 - .01); tl.set(r.bub, { scale: 1, y: 0, rotation: r.rot || 0 }, GRID0 - .01); };
      showNow(cB); showNow(cA);
      chat.show(tl, cP, GRID0 + .12, .22);
      ft(cP.bub, { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, rotation: -4, duration: .2, ease: "power4.in" }, GRID0 + .1);
      kickCam("#kickGrid", GRID0 + .3, 1.03, 1);
      // the zoom out: exponential (each ring of phones arrives as it enters the frame)
      const Z = { p: 0 }, S1 = .1, ZD = T.answered + .25 - T.millions;
      const zoom = () => { const s = Math.exp(Math.log(S1) * Z.p); gsap.set("#pushGrid", focus(640, 360, s)); };
      tl.set("#pushGrid", focus(640, 360, 1), 0);
      tl.fromTo(Z, { p: 0 }, { p: 1, duration: ZD, ease: "power1.in", onUpdate: zoom, immediateRender: false }, T.millions - .02);
      const zAt = (s) => T.millions - .02 + ZD * Math.sqrt(Math.log(s) / Math.log(S1));   // inverse of power1.in (p = u^2)
      minis.forEach((m) => { const sVis = Math.min(1, 3.02 / (2 * m.r + 1));
        const at = Math.max(T.millions - .02, zAt(sVis) - .18) + (m.d - m.r) * .03;
        tl.set(m.e, { scale: 0, opacity: 0 }, 0); tl.set(m.k, { scale: 0 }, 0);
        ft(m.e, { scale: .3, opacity: 0 }, { scale: 1, opacity: 1, duration: .28, ease: "back.out(2)" }, at);
        ft(m.k, { scale: 0 }, { scale: 1, duration: .25, ease: "back.out(3)" }, at + .2); });
      // the number reel to 10,000,000+ (the hook's reel, callback)
      tl.set(["#reelDim", "#bigF"], { opacity: 0 }, 0);
      tl.to("#reelDim", { opacity: 1, duration: .3 }, T.people - .1);
      ft("#bigF", { opacity: 0, scale: .7 }, { opacity: 1, scale: 1, duration: .35, ease: "back.out(2)" }, T.people - .1);
      reelDigits.slice().reverse().forEach((d, i) => ft(d.strip, { y: 0 }, { y: -166 * d.stops, duration: T.same - T.people - .1 - i * .04, ease: "power3.inOut" }, T.people + i * .04));
      tl.set("#plus", { opacity: 0 }, 0);
      ft("#plus", { scale: 0, rotation: -90, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: .45, ease: "elastic.out(1.2, .4)" }, T.same);
      punch("#bigF", T.same, 1.1);
      // "group": every screen pings at once
      const GP = T.group + .02;
      tl.set(minis.map((m) => m.bd), { opacity: 0, scale: 0 }, 0);
      ft(minis.map((m) => m.bd), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: .25, ease: "back.out(3)" }, GP);
      ft(minis.map((m) => m.fl), { opacity: 0 }, { keyframes: [{ opacity: .85, duration: .04 }, { opacity: 0, duration: .3 }] }, GP);
      tl.set("#heroBadge", { opacity: 0 }, 0);
      ft("#heroBadge", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: .25, ease: "back.out(3)" }, GP);
      kickCam("#kickGrid", GP, 1.04, -1.2);
      pingRings.forEach((r, i) => { tl.set(r, { opacity: 0 }, 0); ft(r, { scale: .05, opacity: 0 }, { keyframes: [{ opacity: 1, duration: .03 }, { scale: 1 + i * .45, opacity: 0, duration: .55, ease: "power2.out" }] }, GP + i * .07); });
      flash(GP, .2);
      // "chat.": hard cut to the black lake (no camera, no breathing: stillness)

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      MAX.talk(tl, T.few + .05, T.few + 1.0); LEO.talk(tl, T.few + .1, T.few + 1.1);   // they laugh (lip-flap)
      [MAX, LEO].forEach((f, i) => f.blinks(tl, 0, {{DUR}}, 11 + i * 7));   // idle blinks on the friends
      // chat UI pictures (notification group icon, phone avatars) are interface, not a character acting
      document.querySelectorAll("#bnGav .avd, #shotGrid .ch-av, #shotGrid .avd").forEach((e) => e.setAttribute("data-critic-ignore", "1"));
      window.__timelines["main"] = tl;
    </script>
