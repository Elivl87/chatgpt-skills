<!--
  ChatPhone: the EP003 group-chat phone (our own UI, no brand), reused in blocks B, C, E, F, G.
  build.py only inlines INCLUDE markers from <project>/compositions/components, so a block template pastes this file
  verbatim between "BEGIN chat.html" / "END chat.html" (block B does). Everything is seek-safe: rows are built once at
  setup in chronological order and only shown/hidden by the GSAP timeline; the list is bottom-anchored (flex-end), so
  "scrolling" is layout, never a measured offset (no font-load race).

  Legibility spec (QUALITY_AUDIT #11): phone >= 82 % of frame height (default 384 x 612 = 85 %), Inter 600 26 px
  bubbles, 34 px line height, bubble max width 70 %, 8 px tails, sender names in their colour, ticks + timestamps,
  "Bought." die-cut stickers (4 px white border + shadow, +-4 deg).

  API
    const chat = ChatPhone(host, {
      title: "The boat", sub: "4 members", clock: "11:42", me: "Q",
      members: { Q: { name: "Quest", color: "#d6392f", avatar: ChatPhone.avImg("assets/quest_wave.png", 688, 1024, 318, 170, 300) },
                 A: { name: "Max", color: "#7860be", avatar: ChatPhone.avSil("#7860be") }, ... },
      w: 384, h: 612 });                        // chat.el (position it), chat.screen, chat.list
    const r1 = chat.msg("A", "It's eight dollars. Just get it.", { time: "11:42 PM" });   // r1.words = word spans
    const r2 = chat.sticker("P", "Bought.", { rot: -4 });
    const d1 = chat.typing("B");                 // a "..." row
    const s0 = chat.system("Today 11:41 PM", { visible: true });   // a centred chip (date / group event); visible = shown from the start
    chat.show(tl, r2, at)                        // pop a row in (list grows, older rows slide up)
    chat.typeWords(tl, r1, [t1, t2, ...])        // shows the row at t1 and each word on its time (one time per word)
    chat.dots(tl, d1, tIn, tOut)                 // typing dots bounce from tIn, the row collapses at tOut
    chat.hide(tl, row, at)                       // collapse a row
    chat.read(tl, row, at)                       // ticks turn "read" (gold)
  Rows must be created in the order they appear (DOM order = chat order). Outgoing rows (who === me) sit on the right.
-->
<style>

  .ch-body { position: absolute; inset: 0; border-radius: 58px; background: linear-gradient(160deg, #2c2a3c 0%, #1a1924 60%, #121119 100%);

    function nestedInTarget(el) {
      var parent = el.parentNode;
      if (parent === null || typeof parent.closest !== "function") return false;
      return parent.closest(SWEEP_SELECTOR) !== null;

    // One owner of attaching one element. Answers whether the element still needs a trigger.
    function claim(el) {

        // Re-registering a key with a DIFFERENT timeline leaves the copies driven by the one
        // nobody seeks, which renders sharp and says nothing. Report it rather than guess.
        var changed = tl !== null && owner !== undefined && owner !== tl;
        if (changed && !window._hfMbWarned.has(el)) {

      // style replay would walk a subtree its cursor no longer matches.
      if (nestedInTarget(el)) {

    // Returns the elements still waiting for their composition to register a timeline.
    // The trap below runs this INSIDE the author's registration statement, so one bad
    // target must not abort the rest of their composition script.
    function sweep() {
      var pending = [];
      document.querySelectorAll(SWEEP_SELECTOR).forEach(function (el) {
        try {

        }

    }

    // Registering a timeline is the moment the author has finished building it, so trapping
    // the write attaches before the renderer captures a frame. A microtask would be too
    // early: it runs before the next `<script>` tag.
    function registrationProxy(container) {

        set: function (target, key, value) {

    }

      Object.defineProperty(window, "__timelines", {

          held = fresh ? registrationProxy(value) : value;
          if (fresh) sweep();
        },

      // timeline already registered on it is swept too.
      if (held !== undefined) window.__timelines = held;
    }

    // The trap above cannot see every registration: the runtime owns the registry object,
    // wraps it per sub-composition, and mounts nested compositions asynchronously. So the
    // registry is also POLLED, which needs no cooperation from whoever writes it.
    function poll(ticks) {
      var pending = sweep();
      // The WHOLE budget, every time. Stopping the first tick nothing is pending kills the
      // poll one tick into an ordinary page, which is before a late composition arrives.
      if (ticks > 0) {
        setTimeout(function () {
          poll(ticks - 1);
        }, POLL_MS);
        return;
      }
      if (pending.length === 0) return;
      var count = pending.length + " element(s) carry " + SWEEP_ATTR;
      console.warn(
        "[motion-blur] " + count + ", and no composition registered a timeline for them",
        pending,
      );
    }

    if (!window._hfMbHooked) {
      window._hfMbHooked = true;
      hookRegistration();
      poll(POLL_TICKS);
    }
    /* SHUTTER_SNIPPET_END */
  })();
</script>

  window.__timelines = window.__timelines || {};
