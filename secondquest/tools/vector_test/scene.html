<!doctype html>
<html><head><meta charset="utf-8"><title>SecondQuest vector test</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// SecondQuest EP003 "vector test": everything below is drawn in code (Canvas 2D). No bitmaps, no generated images.
// draw(t) is a pure function of time t (seconds) -> deterministic frames. Design space 1920x1080.
'use strict';
const W = 1920, H = 1080, DUR = 15;
const cv = document.getElementById('c');
const Q = new URLSearchParams(location.search);
const OW = +(Q.get('w') || 960);
cv.width = OW; cv.height = Math.round(OW * 9 / 16);
const ctx = cv.getContext('2d');
const K = OW / W;

// ---------- math helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const eio = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eout = u => 1 - Math.pow(1 - u, 3);
const eback = u => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const D2R = Math.PI / 180;
function keys(t, ks, ease = eio) {            // piecewise keyframes [[t,v],...]
  if (t <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) if (t <= ks[i][0]) {
    const [t0, v0] = ks[i - 1], [t1, v1] = ks[i];
    return lerp(v0, v1, ease((t - t0) / (t1 - t0)));
  }
  return ks[ks.length - 1][1];
}
function pulse(t, c, w) { return clamp(1 - Math.abs(t - c) / w); }       // triangle 0..1..0
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed);
  x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const rot = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];

// ---------- palette ----------
const P = {
  sky0: '#2c2456', sky1: '#5d3f86', sky2: '#a65d9c', sky3: '#ec8f9a', sky4: '#ffc58e',
  sun: '#fff3d2', sunE: '#ffcf7d',
  far: ['#b48bc0', '#9c76b2'], mid: ['#7a5a9c', '#5f4686'], isl: '#3b2d5e', pine: '#2f2550',
  w0: '#f3b1b3', w1: '#c486b5', w2: '#7e5aa0', w3: '#3d2d6c', w4: '#261d4c',
  wood: '#9a6a4a', woodL: '#c48f63', woodD: '#5e3d32', woodDD: '#3d2630',
  ol: '#2a1a2c',
  skin: '#f1bf98', skinL: '#ffd6b2', skinD: '#d9946f', freck: '#b9714f', blush: '#f2867c',
  hair: '#3a2216', hairL: '#5c3a26', hairD: '#24140d',
  red: '#d6302a', redL: '#f05a44', redD: '#9e1f22', under: '#3a3c44',
  jean: '#4677bd', jeanL: '#6c9ad6', jeanD: '#2d4f8a', shoe: '#d6302a', sole: '#f6f1e6',
  fish: '#4fb4bf', fishL: '#a9e3dc', fishD: '#2f8794', fishO: '#1d4c58',
};

// ---------- camera (3 shots, each breathing push 3 % + drift, own phase) ----------
const SHOTS = [
  { t0: 0, t1: 6.3, cx: [900, 922], cy: [566, 560], z: [1.06, 1.092], ph: 0.3 },
  { t0: 6.3, t1: 11.2, cx: [1236, 1248], cy: [640, 633], z: [1.74, 1.792], ph: 1.7 },
  { t0: 11.2, t1: 15.01, cx: [1204, 1213], cy: [612, 606], z: [2.28, 2.35], ph: 3.1 },
];
let C = { cx: 960, cy: 540, z: 1 };
function camAt(t) {
  const s = SHOTS.find(s => t < s.t1) || SHOTS[2];
  const u = clamp((t - s.t0) / (s.t1 - s.t0));
  const e = sstep(0, 1, u);
  return { cx: lerp(s.cx[0], s.cx[1], e) + 4 * Math.sin(t * .7 + s.ph), cy: lerp(s.cy[0], s.cy[1], e) + 2.5 * Math.sin(t * .53 + s.ph * 2),
    z: lerp(s.z[0], s.z[1], e) };
}
function layer(p) {           // parallax: p=1 is the dock plane, p<1 farther away, p>1 foreground
  const zl = 1 + (C.z - 1) * p, lx = 960 + (C.cx - 960) * p, ly = 540 + (C.cy - 540) * p;
  ctx.setTransform(K * zl, 0, 0, K * zl, K * (960 - lx * zl), K * (540 - ly * zl));
  return { zl, lx, ly };
}
function toScreen(p, X, Y) { const zl = 1 + (C.z - 1) * p, lx = 960 + (C.cx - 960) * p, ly = 540 + (C.cy - 540) * p;
  return [(X - lx) * zl + 960, (Y - ly) * zl + 540]; }
function fromScreen(p, x, y) { const zl = 1 + (C.z - 1) * p, lx = 960 + (C.cx - 960) * p, ly = 540 + (C.cy - 540) * p;
  return [(x - 960) / zl + lx, (y - 540) / zl + ly]; }

const HZ = 620;          // horizon (world y, layer .4)
const SUN = [1395, 548]; // layer .2
const DECK = 792, DOCK_END = 1162;

// ---------- paper texture (deterministic, generated in code) ----------
const paper = document.createElement('canvas'); paper.width = 480; paper.height = 270;
(() => { const g = paper.getContext('2d'), r = rng(7); const im = g.createImageData(480, 270);
  const lo = []; for (let i = 0; i < 61 * 35; i++) lo.push(r());
  for (let y = 0; y < 270; y++) for (let x = 0; x < 480; x++) {
    const gx = x / 8, gy = y / 8, ix = gx | 0, iy = gy | 0, fx = gx - ix, fy = gy - iy;
    const a = lo[iy * 61 + ix], b = lo[iy * 61 + ix + 1], c = lo[(iy + 1) * 61 + ix], d = lo[(iy + 1) * 61 + ix + 1];
    const v = lerp(lerp(a, b, fx), lerp(c, d, fx), fy) * .7 + r() * .3;
    const k = (y * 480 + x) * 4; const c8 = 200 + v * 55; im.data[k] = c8; im.data[k + 1] = c8 * .97; im.data[k + 2] = c8 * .92; im.data[k + 3] = 255; }
  g.putImageData(im, 0, 0); })();

// ---------- primitive drawing ----------
function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function ell(x, y, rx, ry, a = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), a, 0, Math.PI * 2); }
function lg(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function rg(x, y, r0, r1, stops) { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function seg(a, b, w, col, olw = 3) {   // limb segment with outline, round caps
  ctx.lineCap = 'round';
  if (olw) { ctx.strokeStyle = P.ol; ctx.lineWidth = w + olw * 2; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
}
function ik(Pt, F, L1, L2, side) {
  let dx = F[0] - Pt[0], dy = F[1] - Pt[1]; let d = Math.hypot(dx, dy);
  const dm = Math.min(d, L1 + L2 - .5); const ux = dx / (d || 1), uy = dy / (d || 1);
  const a = (L1 * L1 - L2 * L2 + dm * dm) / (2 * dm); const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const J = [Pt[0] + ux * a - side * h * uy, Pt[1] + uy * a + side * h * ux];
  const E = [Pt[0] + ux * dm, Pt[1] + uy * dm];
  return [J, E];
}

// ---------- background layers ----------
function bumps(x, list, base) { let y = base; for (const [c, h, w] of list) y -= h * Math.exp(-(((x - c) / w) ** 2)); return y; }
const FAR = [[-350, 70, 300], [180, 48, 260], [700, 26, 300], [1130, 30, 240], [1590, 62, 260], [2150, 80, 320], [2600, 60, 300]];
const MID = [[-260, 150, 360], [260, 62, 230], [2120, 120, 300], [2520, 160, 320]];
function hillPath(list, base, x0, x1, wob, t) {
  ctx.beginPath(); ctx.moveTo(x0, base + 6);
  for (let x = x0; x <= x1; x += 16) ctx.lineTo(x, bumps(x, list, base) + wob * Math.sin(x * .021) * Math.sin(x * .007 + 1));
  ctx.lineTo(x1, base + 6); ctx.closePath();
}
function pine(x, base, h, w, col) {
  const tiers = 4; ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < tiers; i++) { const yb = base - h * (i / tiers) * .82, yt = yb - h * .42, ww = w * (1 - i / tiers * .55);
    ctx.moveTo(x - ww, yb); ctx.quadraticCurveTo(x - ww * .3, yb - h * .12, x, yt); ctx.quadraticCurveTo(x + ww * .3, yb - h * .12, x + ww, yb); }
  ctx.fill(); ctx.fillRect(x - 2, base - 4, 4, 8);
}
const ISL_PINES = (() => { const r = rng(21), a = []; for (let i = 0; i < 17; i++) { const x = 560 + i * 17 + r() * 10; const mid = 1 - Math.abs((x - 700) / 160);
  a.push([x, 26 + 52 * clamp(mid) + r() * 18, 9 + r() * 5]); } return a.sort((p, q) => p[1] - q[1]); })();
function island(reflect) {
  const base = 631;
  ctx.fillStyle = P.isl; ctx.beginPath(); ctx.moveTo(520, base);
  ctx.bezierCurveTo(560, base - 16, 840, base - 20, 880, base); ctx.closePath(); ctx.fill();
  for (const [x, h, w] of ISL_PINES) pine(x, base - 3, h, w, P.pine);
}
function cloud(x, y, s, a) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a;
  const blobs = [[-70, 6, 34], [-30, -14, 44], [18, -24, 50], [62, -6, 38], [92, 8, 26]];
  ctx.fillStyle = lg(0, -70, 0, 34, [[0, '#f6c9d9'], [.55, '#d79bbf'], [1, '#ffb59a']]);
  ctx.beginPath(); for (const [bx, by, br] of blobs) { ctx.moveTo(bx + br, by); ctx.arc(bx, by, br, 0, Math.PI * 2); }
  ctx.roundRect(-104, 0, 222, 34, 17); ctx.fill();
  ctx.fillStyle = 'rgba(255,205,160,.55)'; ctx.beginPath(); ctx.roundRect(-96, 26, 206, 8, 4); ctx.fill();       // sunlit underside
  ctx.restore();
}
function bird(x, y, s, flap) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = '#3a2a55'; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const f = Math.sin(flap) * 9; ctx.beginPath(); ctx.moveTo(-18, -f); ctx.quadraticCurveTo(-8, -6 - f * .3, 0, 0); ctx.quadraticCurveTo(8, -6 - f * .3, 18, -f); ctx.stroke(); ctx.restore();
}

function drawBackground(t) {
  ctx.setTransform(K, 0, 0, K, 0, 0);
  const hz = toScreen(.4, 0, HZ)[1];
  ctx.fillStyle = lg(0, 0, 0, hz, [[0, P.sky0], [.32, P.sky1], [.62, P.sky2], [.85, P.sky3], [1, P.sky4]]);
  ctx.fillRect(0, 0, W, hz + 2);
  // stars barely appearing up top
  const r = rng(3); ctx.fillStyle = '#fff';
  for (let i = 0; i < 26; i++) { const x = r() * W, y = r() * hz * .38, a = clamp((t - 3) / 9) * (.25 + .35 * Math.sin(t * 2 + i)) * (1 - y / (hz * .4));
    if (a > 0) { ctx.globalAlpha = a; circ(x, y, 1.6 + r()); ctx.fill(); } }
  ctx.globalAlpha = 1;
  // sun glow + rays
  const [sx, sy] = toScreen(.2, SUN[0], SUN[1]); const sz = 1 + (C.z - 1) * .2;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = rg(sx, sy, 0, 520 * sz, [[0, 'rgba(255,214,150,.55)'], [.25, 'rgba(255,170,130,.22)'], [1, 'rgba(255,140,140,0)']]);
  ctx.fillRect(0, 0, W, H);
  ctx.filter = `blur(${(10 * K).toFixed(2)}px)`;
  for (let i = 0; i < 7; i++) {
    const a0 = -Math.PI * .97 + i * (Math.PI * .94 / 6) + .04 * Math.sin(t * .25 + i * 1.7) + t * .005, wd = .05 + .03 * ((i * 7) % 3) / 2;
    ctx.fillStyle = rg(sx, sy, 60, 850 * sz, [[0, 'rgba(255,225,185,.085)'], [1, 'rgba(255,225,180,0)']]);
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.arc(sx, sy, 1000 * sz, a0 - wd, a0 + wd); ctx.closePath(); ctx.fill();
  }
  ctx.filter = 'none';
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = rg(sx, sy - 10 * sz, 0, 66 * sz, [[0, P.sun], [.7, '#ffe4a6'], [1, P.sunE]]);
  circ(sx, sy, 64 * sz); ctx.fill();
  // clouds (layer .18 / .25), drifting
  layer(.16); cloud(380 + t * 7, 250, 1.25, .9); cloud(1500 + t * 5, 175, 1.0, .75); cloud(2050 + t * 6, 320, .8, .7);
  layer(.24); cloud(900 + t * 10, 395, .85, .85); cloud(-80 + t * 12, 430, .7, .7); cloud(1780 + t * 9, 455, .6, .65);
  // birds
  layer(.26);
  for (let i = 0; i < 4; i++) { const bt = t - [0, .35, .7, 4.5][i]; if (bt < 0) continue;
    const bx = [260, 205, 300, 1900][i] + bt * (i == 3 ? -70 : 85), by = [300, 330, 340, 260][i] - bt * 6 + 6 * Math.sin(bt * 1.3 + i);
    bird(bx, by, i == 3 ? .8 : 1, bt * 9 + i * 1.7); }
  // far hills
  layer(.3);
  ctx.fillStyle = lg(0, 540, 0, 625, [[0, P.far[0]], [1, P.far[1]]]); hillPath(FAR, 624, -700, 2700, 3, t); ctx.fill();
  // haze line on the horizon
  ctx.fillStyle = 'rgba(255,190,180,.25)'; ctx.fillRect(-700, 612, 3400, 14);
  // water
  layer(.4);
  ctx.fillStyle = lg(0, HZ, 0, 980, [[0, P.w0], [.08, '#e7a0b2'], [.25, P.w1], [.55, P.w2], [.85, P.w3], [1, P.w4]]);
  ctx.fillRect(-1200, HZ, 4400, 900);
  // reflections of far hills / island (flipped, faded, rippled)
  ctx.save(); ctx.beginPath(); ctx.rect(-1200, HZ, 4400, 900); ctx.clip();
  ctx.globalAlpha = .28; ctx.translate(0, HZ * 2); ctx.scale(1, -1); ctx.fillStyle = P.far[1]; hillPath(FAR, 624, -700, 2700, 3, t); ctx.fill();
  ctx.restore();
  layer(.45);
  ctx.save(); ctx.beginPath(); ctx.rect(-1200, HZ + 8, 4400, 900); ctx.clip();
  ctx.globalAlpha = .35; ctx.translate(0, 631 * 2); ctx.scale(1, -1); island(); ctx.restore();
  island();
  // mid hills (left & right far shores)
  layer(.55);
  ctx.fillStyle = lg(0, 480, 0, 650, [[0, P.mid[0]], [1, P.mid[1]]]); hillPath(MID, 646, -900, 3000, 5, t); ctx.fill();
  for (let i = 0; i < 26; i++) { const x = -380 + i * 26 + (i * 37 % 11); const yb = bumps(x, MID, 646); if (yb > 640) continue;
    pine(x, yb + 6, 40 + (i * 53 % 30), 11, '#463367'); }
  for (let i = 0; i < 18; i++) { const x = 1960 + i * 30 + (i * 29 % 13); const yb = bumps(x, MID, 646); if (yb > 640) continue;
    pine(x, yb + 6, 42 + (i * 41 % 34), 12, '#463367'); }
  // glitter path under the sun (screen-anchored column, perspective rows)
  ctx.setTransform(K, 0, 0, K, 0, 0);
  const hzs = toScreen(.4, 0, HZ)[1];
  ctx.save(); ctx.beginPath(); ctx.rect(0, hzs + 2, W, H); ctx.clip();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = lg(0, hzs, 0, H, [[0, 'rgba(255,220,160,.55)'], [.4, 'rgba(255,190,150,.18)'], [1, 'rgba(255,180,150,0)']]);
  ctx.filter = `blur(${(26 * K).toFixed(2)}px)`;
  ctx.beginPath(); ctx.moveTo(sx - 30 * sz, hzs); ctx.lineTo(sx + 30 * sz, hzs); ctx.lineTo(sx + 230, H); ctx.lineTo(sx - 230, H); ctx.closePath(); ctx.fill();
  ctx.filter = 'none';
  const gr = rng(99);
  for (let i = 0; i < 70; i++) {
    const v = Math.pow(i / 70, 1.7), y = hzs + 4 + v * (H - hzs), spread = 34 * sz + v * 300;
    for (let k = 0; k < 3; k++) {
      const off = (gr() - .5) * 2 * spread, ln = (8 + gr() * 34) * (.4 + v), ph = gr() * 6.28;
      const a = clamp(.55 + .45 * Math.sin(t * (2.2 + gr() * 2) + ph)) * (1 - Math.abs(off) / spread * .7) * (1 - v * .55);
      const x = sx + off + 6 * Math.sin(t * 1.3 + i * .7);
      ctx.fillStyle = `rgba(255,240,205,${(a * .85).toFixed(3)})`; ctx.fillRect(x - ln / 2, y, ln, 1.6 + v * 2.6);
    }
  }
  ctx.restore();
  // ripple lines
  layer(.7);
  ctx.strokeStyle = 'rgba(255,215,225,.16)'; ctx.lineWidth = 1.6;
  const rr = rng(5);
  for (let i = 0; i < 46; i++) {
    const y = 650 + Math.pow(rr(), 1.5) * 420, x = -300 + rr() * 2600, L = 30 + rr() * 90 * (y / 700);
    const dx = (t * (6 + rr() * 8)) % 200; ctx.globalAlpha = .5 + .5 * Math.sin(t * 1.5 + i);
    ctx.beginPath(); ctx.moveTo(x + dx, y); ctx.quadraticCurveTo(x + dx + L / 2, y - 2.5, x + dx + L, y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ---------- the dock, shore and foreground ----------
const POSTS = [70, 400, 730, 1040, 1138];
function drawDock(t) {
  layer(1);
  // dock shadow on water
  ctx.fillStyle = 'rgba(30,20,60,.32)'; ctx.fillRect(-200, 826, DOCK_END + 200, 70);
  // posts with waterline rings
  for (const x of POSTS) {
    ctx.fillStyle = lg(x - 12, 0, x + 12, 0, [[0, P.woodDD], [.6, P.woodD], [1, '#7a5040']]);
    ctx.fillRect(x - 12, 812, 24, 128);
    ctx.fillStyle = 'rgba(255,220,220,.0)';
    for (let k = 0; k < 2; k++) { const ph = ((t * .45 + k * .5 + x * .001) % 1);
      ctx.strokeStyle = `rgba(255,220,230,${(.35 * (1 - ph)).toFixed(3)})`; ctx.lineWidth = 2; ell(x, 935, 16 + ph * 34, 4 + ph * 5); ctx.stroke(); }
    ctx.fillStyle = 'rgba(40,30,80,.45)'; ell(x, 940, 16, 4); ctx.fill();
  }
  // deck top surface (slightly seen from above) + front beam
  ctx.fillStyle = lg(0, 778, 0, 800, [[0, P.woodL], [1, P.wood]]);
  ctx.beginPath(); ctx.moveTo(-200, 800); ctx.lineTo(-200, 776); ctx.lineTo(DOCK_END - 6, 776); ctx.lineTo(DOCK_END, 800); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(80,45,40,.5)'; ctx.lineWidth = 2;
  for (let x = -180; x < DOCK_END; x += 46) { ctx.beginPath(); ctx.moveTo(x, 777); ctx.lineTo(x + 3, 799); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,215,170,.45)'; ctx.fillRect(-200, 776, DOCK_END - 6 + 200, 2.5);         // warm rim from the sun
  ctx.fillStyle = lg(0, 800, 0, 828, [[0, '#7b5240'], [1, '#553633']]); ctx.fillRect(-200, 800, DOCK_END + 200, 26);
  ctx.strokeStyle = 'rgba(40,20,30,.55)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-200, 813); ctx.lineTo(DOCK_END, 813); ctx.stroke();
  ctx.fillStyle = '#3a2430'; for (let x = -160; x < DOCK_END; x += 92) { circ(x, 806, 2.4); ctx.fill(); circ(x, 820, 2.4); ctx.fill(); }
  ctx.fillStyle = '#c48f63'; ctx.fillRect(DOCK_END - 4, 776, 4, 50);      // end grain lit by sun
  // foreground shore bank the dock grows out of (in front of the first posts)
  ctx.fillStyle = lg(0, 800, 0, 1100, [[0, '#5b4878'], [.35, '#3d2f5e'], [1, '#231a3a']]);
  ctx.beginPath(); ctx.moveTo(-700, 1250); ctx.lineTo(-700, 812); ctx.bezierCurveTo(-300, 800, -40, 812, 60, 860);
  ctx.bezierCurveTo(150, 905, 210, 990, 260, 1250); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,180,.35)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-700, 812); ctx.bezierCurveTo(-300, 800, -40, 812, 60, 860);
  ctx.bezierCurveTo(150, 905, 210, 990, 260, 1250); ctx.stroke();
  { const r = rng(61); ctx.lineCap = 'round';
    for (let i = 0; i < 90; i++) { const u = i / 90, x = lerp(-640, 200, u) + r() * 8; const y0 = x < 60 ? 812 - 4 * Math.sin(u * 9) + (x > -40 ? (x + 40) * .5 : 0) : 860 + (x - 60) * 1.1;
      const h = 14 + r() * 22, sw = Math.sin(t * 1.4 + i * .7) * 3; ctx.strokeStyle = r() < .5 ? '#4a3a6a' : '#6a5488'; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(x, y0 + 4); ctx.quadraticCurveTo(x + sw, y0 - h * .5, x + sw * 2 + (r() - .5) * 8, y0 - h); ctx.stroke(); }
    ctx.fillStyle = '#6e5b8c'; ell(-120, 840, 34, 14); ctx.fill(); ctx.fillStyle = 'rgba(255,200,180,.35)'; ell(-114, 834, 20, 5); ctx.fill();
    ctx.fillStyle = '#5c4a7a'; ell(120, 925, 22, 11); ctx.fill(); }

    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.rect(mx - .13 * R, my - .03 * R, .26 * R, .08 * R); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mx - .13 * R, my + .01 * R); ctx.lineTo(mx + .13 * R, my + .01 * R); ctx.lineWidth = 1.6; ctx.stroke();
  } else if (f.mouth === 'o') {
    ctx.fillStyle = '#5a1f22'; ell(mx, my + .03 * R, .085 * R * (.6 + .4 * f.mopen), .13 * R * f.mopen + .02 * R); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e8737a'; ell(mx, my + .03 * R + .08 * R * f.mopen, .05 * R * f.mopen, .03 * R * f.mopen); ctx.fill();
  } else if (f.mouth === 'grin') {
    const w = .25 * R * (.6 + .4 * f.mopen), d = .17 * R * f.mopen, sk = .035 * R;  // lopsided sheepish grin
    ctx.fillStyle = '#5a1f22'; ctx.beginPath(); ctx.moveTo(mx - w, my - .03 * R + sk); ctx.lineTo(mx + w, my - .05 * R - sk);
    ctx.quadraticCurveTo(mx + w * .55, my + d, mx - w * .1, my + d * .9); ctx.quadraticCurveTo(mx - w * .8, my + d * .6, mx - w, my - .03 * R + sk); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.clip(); ctx.fillStyle = '#fff'; ctx.fillRect(mx - w, my - .2 * R, w * 2, .17 * R + d * .25);
    ctx.fillStyle = '#e8737a'; ell(mx, my + d * .95, w * .45, d * .35); ctx.fill(); ctx.restore(); ctx.stroke();
  }
  // front hair over the forehead
  ctx.save(); ctx.translate(hx * .5, 0);
  ctx.fillStyle = P.ol; HAIR_FRONT.forEach(([x, y, r], i) => { circ((x + u * .08) * R, y * R + bob(i + 5, 1.4), r * R + 3); ctx.fill(); });
  HAIR_FRONT.forEach(([x, y, r], i) => curl((x + u * .08) * R, y * R + bob(i + 5, 1.4), r * R, i % 2 ? P.hair : P.hairL, i % 2 ? P.hairL : '#7a5236'));
  ctx.restore();
  // warm rim light from the sun (right side)
  ctx.save(); ell(0, 0, R, R); ctx.clip(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = lg(R * .55, 0, R, 0, [[0, 'rgba(255,170,90,0)'], [1, 'rgba(255,170,90,.28)']]); ctx.fillRect(-R, -R, 2 * R, 2 * R); ctx.restore();
  ctx.restore();
}
function torso(s, t) {
  const [hx, hy] = s.hip;

  // hood bunched behind the neck/back
  ctx.fillStyle = P.redD; ctx.strokeStyle = P.ol; ctx.lineWidth = 3;
  ell(-24, -113 - b, 25, 14, -.25); ctx.fill(); ctx.stroke();
  // body of the hoodie
  ctx.beginPath(); ctx.moveTo(-28, -118 - b); ctx.bezierCurveTo(-52, -114 - b, -54, -96, -52, -70); ctx.lineTo(-50, -12);
  ctx.quadraticCurveTo(-50, 2, -38, 2); ctx.lineTo(40, 2); ctx.quadraticCurveTo(54, 2, 54, -12); ctx.lineTo(54, -76);
  ctx.bezierCurveTo(54, -102, 44, -118 - b, 20, -120 - b); ctx.closePath();
  ctx.fillStyle = lg(-52, 0, 54, 0, [[0, P.redD], [.4, P.red], [.85, P.red], [1, P.redL]]); ctx.fill(); ctx.stroke();
  // hem band + pocket
  ctx.fillStyle = 'rgba(120,20,25,.55)'; ctx.fillRect(-48, -14, 100, 13);
  ctx.strokeStyle = 'rgba(110,18,22,.8)'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(-10, -16); ctx.lineTo(-4, -50); ctx.lineTo(38, -50); ctx.lineTo(46, -16); ctx.stroke();
  // neckline: dark grey undershirt
  ctx.fillStyle = P.under; ctx.strokeStyle = P.ol; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(-10, -120 - b); ctx.quadraticCurveTo(12, -94 - b, 34, -120 - b); ctx.closePath(); ctx.fill(); ctx.stroke();
  // hood rim around neck
  ctx.strokeStyle = P.redD; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-14, -122 - b); ctx.quadraticCurveTo(12, -96 - b, 38, -120 - b); ctx.stroke();
  // white drawstrings (swing a little)
  const sw = Math.sin(t * 5) * 2 * (s.walking ? s.wsp : .3) + s.lean * 20;
  ctx.strokeStyle = '#fbf7ef'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (const [x0, len] of [[2, 30], [24, 34]]) { ctx.beginPath(); ctx.moveTo(x0, -110 - b); ctx.quadraticCurveTo(x0 + sw * .3, -110 + len * .5, x0 + sw, -110 + len - b); ctx.stroke();
    ctx.fillStyle = '#d9d4ca'; ell(x0 + sw, -108 + len - b, 2.6, 4.2); ctx.fill(); }
  ctx.restore();
}
function local(s, x, y) { const [rx, ry] = rot(x, y, s.lean); return [s.hip[0] + rx, s.hip[1] + ry]; }

function rodDraw(R) {
  const { butt, tip, ctrl, d, n } = R;
  // blank: tapered via segments on the quadratic curve
  const q = u => [ (1 - u) ** 2 * butt[0] + 2 * (1 - u) * u * ctrl[0] + u * u * tip[0], (1 - u) ** 2 * butt[1] + 2 * (1 - u) * u * ctrl[1] + u * u * tip[1] ];
  ctx.lineCap = 'round';
  let prev = q(0);
  for (let i = 1; i <= 16; i++) { const p = q(i / 16); const w = lerp(7, 2.2, i / 16);
    ctx.strokeStyle = i < 4 ? '#b9844f' : '#2b2232'; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); prev = p; }

  for (const u of [.45, .65, .85]) { const p = q(u); ctx.strokeStyle = '#d9d4ca'; ctx.lineWidth = 1.6; circ(p[0] + n[0] * 3, p[1] + n[1] * 3, 2.4); ctx.stroke(); }
  return q;
}
function reel(R, t, crank) {
  const G = [R.butt[0] + R.d[0] * 58 + R.n[0] * 12, R.butt[1] + R.d[1] * 58 + R.n[1] * 12];
  ctx.fillStyle = '#9aa6b4'; ctx.strokeStyle = P.ol; ctx.lineWidth = 2.6; circ(G[0], G[1], 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c9d2dc'; circ(G[0] - 2, G[1] - 2, 4); ctx.fill();
  const a = crank; const hnd = [G[0] + Math.cos(a) * 13, G[1] + Math.sin(a) * 13];
  ctx.strokeStyle = '#3a3440'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(G[0], G[1]); ctx.lineTo(hnd[0], hnd[1]); ctx.stroke();
  return hnd;
}

function drawQuest(t) {
  layer(1);
  const s = questPose(t);
  const shN = local(s, 30, -104 - s.breath), shF = local(s, -24, -106 - s.breath);
  const neck = local(s, 8, -122);
  const hipN = local(s, 10, -4), hipF = local(s, -10, -6);
  const R = 50;
  const hc = [neck[0] + Math.sin(s.lean + s.headTilt) * 52, neck[1] - Math.cos(s.lean + s.headTilt) * 52];
  // rod geometry (needed by hands)
  let RG = null, crankH = null, q = null;
  if (s.rod) RG = rodGeom(s.rod);
  // targets for hands
  let hN, hF, sideN = 0, sideF = 1, farFront = false;
  if (s.carry) {
    hN = s.carry.hand;
    const sw = s.freeSwing; hF = [shF[0] - 10 + 34 * sw, shF[1] + 104 - 8 * Math.abs(sw)]; sideF = -1;
  } else {
    const G = s.rod.g, d = RG.d;
    hN = [G[0], G[1]]; hF = [G[0] - d[0] * 30, G[1] - d[1] * 30]; farFront = true;
    if (t > 9.15 && t < 10.6) {               // reeling: near hand on the crank, far hand up the rod
      hF = [G[0] + d[0] * 26, G[1] + d[1] * 26];
    }
    if (t >= 10.6) {                          // fish up: both hands on the rod, then the far hand scratches the back of the head
      const sc = [hc[0] - .62 * R + 5 * Math.sin(t * 17) * s.scratch, hc[1] - .5 * R + 4 * Math.cos(t * 17) * s.scratch];
      hF = [lerp(hF[0], sc[0], s.scratch), lerp(hF[1], sc[1], s.scratch)]; sideF = s.scratch > .3 ? -1 : 1;
    }
  }
  // far arm always behind the body (sleeve), its hand drawn later when it holds the rod / scratches
  const HF = arm(shF, hF, s.carry ? sideF : sideF, true); if (!farFront) hand(HF, true);
  // legs: far then near
  leg(hipF, s.feet[1], s.footAng, true);
  leg(hipN, s.feet[0], s.footAng, false);
  // seat of the jeans
  ctx.fillStyle = P.jean; ctx.strokeStyle = P.ol; ctx.lineWidth = 3;
  const sp = local(s, 2, -4); ell(sp[0], sp[1], 46, 20, s.lean); ctx.fill(); ctx.stroke();
  torso(s, t);
  // neck
  seg(local(s, 6, -116), [lerp(neck[0], hc[0], .3), lerp(neck[1], hc[1], .3)], 22, P.skinD, 2.5);
  const scratching = farFront && s.scratch > .5;
  if (scratching) { arm(shF, hF, sideF, true); }
  head(hc, R, s.lean * .5 + s.headTilt, s.face, s.hairKick, t);
  if (s.carry) {
    const d = [Math.cos(s.carry.a), -Math.sin(s.carry.a)];
    RG = { butt: [hN[0] - d[0] * 40, hN[1] - d[1] * 40], tip: [hN[0] + d[0] * 290, hN[1] + d[1] * 290], ctrl: [hN[0] + d[0] * 140, hN[1] + d[1] * 140], d, n: [d[1], -d[0]] };
  }
  q = rodDraw(RG);
  const crank = t > 9.15 && t < 10.6 ? (t - 9.15) * 26 : 1.2;
  crankH = reel(RG, t, crank);
  if (farFront) hand(HF, true);
  if (s.rod && t > 9.15 && t < 10.6) hN = crankH;
  const HN = arm(shN, hN, sideN, false); hand(HN, false);
  return { RG, s };
}

// ---------- line, bobber, fish ----------
function ripples(x, y, t0, t, n = 3, scale = 1) {
  for (let k = 0; k < n; k++) { const age = t - t0 - k * .22; if (age < 0 || age > 1.6) continue;
    const r = (10 + age * 46) * scale, a = (1 - age / 1.6) * .7;
    ctx.strokeStyle = `rgba(255,236,240,${a.toFixed(3)})`; ctx.lineWidth = 2.2 * (1 - age / 2); ell(x, y, r, r * .26); ctx.stroke(); }
}
function splash(x, y, t0, t, n, seed, power = 1) {
  const age = t - t0; if (age < 0 || age > 1.1) return;
  const r = rng(seed);
  ctx.fillStyle = 'rgba(235,245,255,.9)';
  for (let i = 0; i < n; i++) { const vx = (r() - .5) * 260 * power, vy = -(120 + r() * 260) * power, s = 2 + r() * 4;
    const px = x + vx * age, py = y + vy * age + 520 * age * age; if (py > y + 6) continue;
    ctx.globalAlpha = clamp(1 - age / 1.1); circ(px, py, s * (1 - age * .4)); ctx.fill(); }
  ctx.globalAlpha = 1;
  // crown
  if (age < .45) { const a = 1 - age / .45; ctx.fillStyle = `rgba(240,248,255,${(a * .85).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(x - 34 * power, y); for (let i = 0; i <= 8; i++) { const xx = x - 34 * power + i * 8.5 * power; ctx.lineTo(xx, y - (i % 2 ? 46 : 18) * power * Math.sin(age / .45 * Math.PI) ); }
    ctx.lineTo(x + 34 * power, y); ctx.closePath(); ctx.fill(); }
}
function bobber(x, y, sub = 0) {
  ctx.save(); ctx.beginPath(); ctx.rect(x - 20, y - 30, 40, 30 - 0 + 6 * (1 - sub)); ctx.clip();
  ctx.strokeStyle = P.ol; ctx.lineWidth = 2.4;
  ctx.fillStyle = '#f5f1e8'; ell(x, y - 2, 9, 9); ctx.fill(); ctx.stroke();
  ctx.save(); ell(x, y - 2, 9, 9); ctx.clip(); ctx.fillStyle = '#e8382e'; ctx.fillRect(x - 10, y - 13, 20, 10); ctx.restore(); ell(x, y - 2, 9, 9); ctx.stroke();
  ctx.fillStyle = '#2b2232'; ctx.fillRect(x - 1.3, y - 18, 2.6, 7);
  ctx.restore();
  ctx.fillStyle = 'rgba(255,240,240,.35)'; ell(x, y + 5, 14, 3); ctx.fill();
}
function fishDraw(M, ang, t) {
  ctx.save(); ctx.translate(M[0], M[1]); ctx.rotate(ang); ctx.translate(62, -2);   // mouth at local (-62,2)
  ctx.lineJoin = 'round'; ctx.strokeStyle = P.fishO; ctx.lineWidth = 3.2;
  const wag = Math.sin(t * 6) * .12;
  // tail
  ctx.save(); ctx.translate(52, 0); ctx.rotate(wag);
  ctx.fillStyle = P.fishD; ctx.beginPath(); ctx.moveTo(-4, 0); ctx.quadraticCurveTo(20, -10, 40, -34); ctx.quadraticCurveTo(30, -2, 40, 30); ctx.quadraticCurveTo(18, 8, -4, 0); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  // dorsal fin
  ctx.fillStyle = P.fishD; ctx.beginPath(); ctx.moveTo(-18, -40); ctx.quadraticCurveTo(4, -76, 30, -56); ctx.quadraticCurveTo(24, -44, 22, -34); ctx.closePath(); ctx.fill(); ctx.stroke();
  // body
  ctx.fillStyle = lg(0, -46, 0, 46, [[0, '#3f9fac'], [.45, P.fish], [1, '#7fcfcb']]);
  ell(0, 0, 60, 46); ctx.fill(); ctx.stroke();
  ctx.save(); ell(0, 0, 60, 46); ctx.clip();
  ctx.fillStyle = 'rgba(200,245,235,.55)'; ell(-6, 34, 50, 22); ctx.fill();
  ctx.fillStyle = 'rgba(255,190,120,.22)'; ell(40, -10, 34, 50); ctx.fill();                // warm sunset rim
  ctx.strokeStyle = 'rgba(30,90,100,.35)'; ctx.lineWidth = 2; for (const [x, y] of [[14, -14], [28, 2], [14, 18], [30, -26]]) { ctx.beginPath(); ctx.arc(x, y, 9, -1.1, 1.1); ctx.stroke(); }
  ctx.restore();
  // gill
  ctx.strokeStyle = P.fishO; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.arc(-14, 2, 22, -1.0, 1.0); ctx.stroke();
  // pectoral fin
  ctx.fillStyle = P.fishD; ctx.save(); ctx.translate(8, 16); ctx.rotate(.35 + Math.sin(t * 5) * .15);
  ctx.beginPath(); ctx.ellipse(12, 0, 14, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
  // pouty lips
  ctx.fillStyle = '#5e8f99'; ell(-60, -2, 8, 6); ctx.fill(); ctx.stroke(); ell(-60, 8, 8, 6); ctx.fill(); ctx.stroke();
  // eye: half-lidded, unimpressed
  const lid = keys(t, [[11.5, .52], [11.95, .52], [12.15, 1], [12.45, 1], [12.7, .52], [13.8, .52], [14.1, .62], [15, .62]]);
  const ex = -26, ey = -12, er = 16;
  ctx.fillStyle = '#fbfbf6'; circ(ex, ey, er); ctx.fill();
  ctx.save(); circ(ex, ey, er); ctx.clip();
  ctx.fillStyle = '#1b1416'; circ(ex - 6, ey + 6, 6.5); ctx.fill(); ctx.fillStyle = '#fff'; circ(ex - 4, ey + 3.5, 1.8); ctx.fill();
  const ly = ey - er + 2 * er * lid;
  ctx.fillStyle = '#3c98a6'; ctx.beginPath(); ctx.moveTo(ex - er - 2, ey - er - 2); ctx.lineTo(ex + er + 2, ey - er - 2); ctx.lineTo(ex + er + 2, ly - 2); ctx.lineTo(ex - er - 2, ly + 2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = P.fishO; ctx.lineWidth = 3.4; ctx.beginPath(); ctx.moveTo(ex - er, ly + 2); ctx.lineTo(ex + er, ly - 2); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = P.fishO; ctx.lineWidth = 3; circ(ex, ey, er); ctx.stroke();
  ctx.restore();
}
function drips(M, t) {      // water drips from the fish
  for (const [t0, dx] of [[11.0, 14], [11.6, -6], [12.2, 22], [12.9, 4], [13.6, 18], [14.3, -2]]) {
    const a = t - t0; if (a < 0 || a > .6) continue;
    ctx.fillStyle = 'rgba(220,240,255,.85)'; ell(M[0] + 40 + dx, M[1] + 60 + 900 * a * a, 2.6, 4); ctx.fill();
  }
}
function drawLineFish(t, Q) {
  layer(1);
  const R = Q.RG; const tip = R.tip;
  const L = lineState(t, Q.s.rod ? R : null);
  ctx.strokeStyle = 'rgba(250,244,236,.85)'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  // water events
  ripples(BOB[0], BOB[1] + 4, 5.86, t, 3, 1);
  ripples(BOB[0], BOB[1] + 4, 8.3, t, 1, .6); ripples(BOB[0], BOB[1] + 4, 8.55, t, 1, .6); ripples(BOB[0], BOB[1] + 4, 8.75, t, 3, 1.1);
  ripples(1352, 802, 10.58, t, 4, 1.4);
  splash(BOB[0], BOB[1], 5.86, t, 10, 31, .45);
  splash(BOB[0], BOB[1], 8.75, t, 8, 37, .4);
  if (L.mode === 'fly') {
    const b = L.bob; ctx.beginPath(); ctx.moveTo(tip[0], tip[1]);
    ctx.quadraticCurveTo((tip[0] + b[0]) / 2, Math.min(tip[1], b[1]) - 60 * (1 - L.u), b[0], b[1]); ctx.stroke(); bobber(b[0], b[1] + 6, 0);
  } else if (L.mode === 'float') {
    const b = L.bob; ctx.beginPath(); ctx.moveTo(tip[0], tip[1]); ctx.quadraticCurveTo(lerp(tip[0], b[0], .6), b[1] + 10, b[0], b[1] - 16); ctx.stroke(); bobber(b[0], b[1]);
  } else if (L.mode === 'taut') {
    const e = L.entry; ctx.beginPath(); ctx.moveTo(tip[0], tip[1]); ctx.lineTo(e[0], e[1]); ctx.stroke();
    // wake around the entry point
    const ph = (t * 2.2) % 1; ctx.strokeStyle = `rgba(255,236,240,${(.6 * (1 - ph)).toFixed(3)})`; ctx.lineWidth = 2; ell(e[0], e[1] + 2, 8 + ph * 26, 2 + ph * 6); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,240,240,.5)'; ctx.beginPath(); ctx.moveTo(e[0] - 18, e[1] + 3); ctx.lineTo(e[0], e[1]); ctx.lineTo(e[0] + 18, e[1] + 3); ctx.stroke();
  } else if (L.mode === 'fish') {
    const F = fishState(t, R);
    ctx.beginPath(); ctx.moveTo(tip[0], tip[1]); ctx.lineTo(F.M[0], F.M[1]); ctx.stroke();
    fishDraw(F.M, F.ang, t); drips(F.M, t);
    splash(1352, 800, 10.58, t, 26, 53, 1);
  }
}

// ---------- frame ----------
function draw(t) {
  C = camAt(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawBackground(t);
  drawDock(t);
  const Qs = drawQuest(t);
  drawLineFish(t, Qs);
  fireflies(t);
  drawForeground(t);
  // warm sunset grade + paper
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(255,170,120,.18)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .55; ctx.drawImage(paper, 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
window.draw = draw; window.DUR = DUR;
// sound events (sampled from the same timeline so audio always matches picture)
window.EVENTS = (() => { const ev = { steps: [] }; let prev = null;
  for (let i = 0; i < 3450; i++) { const t = i / 1000, c = (walkX(t) - X0) / STRIDE;
    for (let k = 0; k < 2; k++) { const ph = (c + k * .5) % 1; const st = ph > .25 && ph < .75; if (prev && st && !prev[k] && walkSpeed(t) > .05) ev.steps.push([+t.toFixed(3), walkSpeed(t)]); }
    prev = [0, 1].map(k => { const ph = (c + k * .5) % 1; return ph > .25 && ph < .75; }); }
  return ev; })();
draw(+(Q.get('t') || 0));
