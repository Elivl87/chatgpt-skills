<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- HyperFrames test #3 (experiment, not part of the engine): EP002 l12-l16, "It is the game... plus the room.
         Plus the television. Plus the friend... Plus an entire Saturday afternoon...", re-imagined as "the memory equation".
         2D only: approved art + shapes drawn in code. t = 0 is episode 34.32 s (block C 5.11 s), 14.87 s long. -->
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Anton'; src: url(assets/fonts/Anton-Regular.woff2) format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 800; src: url(assets/fonts/Inter-800.woff2) format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 600; src: url(assets/fonts/Inter-600.woff2) format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #120e0c; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .abs { position: absolute; }

      /* ---------- the world (camera + polaroid rotate together at the end) */
      #world { position: absolute; inset: 0; transform-origin: 960px 540px; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #room { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #warm { position: absolute; inset: 0; mix-blend-mode: multiply; opacity: 0;
              background: linear-gradient(115deg, #ffb46b 0%, #ff8f6b 45%, #b9708f 100%); }
      #beam { position: absolute; left: 520px; top: -200px; width: 520px; height: 1700px; opacity: 0; mix-blend-mode: screen;
              background: linear-gradient(90deg, transparent, rgba(255, 226, 160, 0.55) 30%, rgba(255, 226, 160, 0.55) 70%, transparent);
              transform-origin: 50% 0; filter: blur(18px); }
      #dust { position: absolute; inset: 0; pointer-events: none; }
      .mote { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 240, 200, 0.85);
              box-shadow: 0 0 8px rgba(255, 220, 150, 0.9); opacity: 0; }

      /* ---------- CRT drawn in code (sits on the nightstand) */
      #tv { position: absolute; left: 1490px; top: 470px; width: 380px; height: 300px; }
      #tvbody { position: absolute; inset: 0; border-radius: 26px; background: linear-gradient(180deg, #5d5a63, #3e3c44 60%, #2d2b31);
                border: 5px solid #16161f; box-shadow: inset 0 6px 0 rgba(255, 255, 255, 0.12), 0 10px 0 #16161f; }
      #screen { position: absolute; left: 30px; top: 26px; width: 290px; height: 218px; border-radius: 34px / 26px; overflow: hidden;
                border: 5px solid #16161f; background: #0b0d10; }
      #game { position: absolute; inset: -4px; background: url(assets/art/11_field.png) center / cover; }
      #gameHero { position: absolute; left: 50%; bottom: -6px; width: 64px; margin-left: -32px; }
      #scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 2px, transparent 2px 4px); mix-blend-mode: multiply; }
      #glass { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 35% 25%, rgba(255, 255, 255, 0.28), transparent 50%),
                                                      radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.55)); }
      #knobs { position: absolute; right: 18px; top: 60px; width: 26px; }
      #knobs i { display: block; width: 26px; height: 26px; margin-bottom: 18px; border-radius: 50%; background: #23212a; border: 4px solid #16161f; }
      #tvglow { position: absolute; left: 1380px; top: 380px; width: 600px; height: 560px; border-radius: 50%; opacity: 0;
                background: radial-gradient(circle, rgba(140, 200, 255, 0.55), rgba(120, 180, 255, 0.15) 45%, transparent 70%); mix-blend-mode: screen; }

      /* ---------- the kids (approved final art #6a, #6b, #6c) */
      #quest { position: absolute; left: 120px; top: 560px; width: 600px; }
      #pixieA { position: absolute; left: 700px; top: 430px; width: 440px; }
      #pixieB { position: absolute; left: 640px; top: 560px; width: 560px; opacity: 0; }
      #arrow { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }

      /* ---------- phone drawn in code, struck out in red marker */
      #phone { position: absolute; left: 1080px; top: 140px; width: 150px; height: 280px; border-radius: 26px; background: #1d1f29;
               border: 6px solid #16161f; box-shadow: 0 8px 0 #16161f; opacity: 0; }
      #phone::before { content: ''; position: absolute; left: 10px; right: 10px; top: 16px; bottom: 16px; border-radius: 14px;
               background: linear-gradient(160deg, #6fb7ff, #3b6fe0); }
      #phone::after { content: '1'; position: absolute; right: -16px; top: -16px; width: 40px; height: 40px; border-radius: 50%;
               background: #ff3b30; border: 4px solid #16161f; color: #fff; font: 800 22px/32px Inter, sans-serif; text-align: center; }
      #strike { position: absolute; left: 1020px; top: 110px; width: 270px; height: 340px; overflow: visible; }

      /* ---------- polaroid (frame + caption), part of the world */
      #polaroid { position: absolute; left: 160px; top: 70px; width: 1600px; height: 940px; opacity: 0;
                  border: 30px solid #fbf7ee; border-bottom-width: 120px; border-radius: 6px;
                  box-shadow: 0 0 0 1400px #1b1512, 0 20px 40px rgba(0, 0, 0, 0.6); }
      #caption { position: absolute; left: 0; right: 0; bottom: -96px; text-align: center; color: #3a3330;
                 font: 600 44px/1 Inter, sans-serif; letter-spacing: 0.02em; }

      /* ---------- equation chips (approved family C: gold marker with an ink border) */
      #eq { position: absolute; left: 0; right: 0; top: 46px; display: flex; justify-content: center; gap: 14px; }
      .chip { position: relative; isolation: isolate; padding: 10px 20px 12px; font: 800 34px/1 Inter, sans-serif; text-transform: uppercase; color: #16161f;
              letter-spacing: 0.02em; opacity: 0; }
      .chip b { position: absolute; inset: 0; background: #ffc83d; border: 4px solid #16161f; border-radius: 8px; transform-origin: 0 50%;
                box-shadow: 0 5px 0 #16161f; z-index: -1; }
      .chip span { position: relative; }
      .plus { width: 46px; height: 46px; border-radius: 50%; background: #16161f; color: #fff; font: 400 40px/46px Anton, sans-serif; text-align: center; opacity: 0; align-self: center; box-shadow: 0 0 0 3px #ffc83d; }

      /* ---------- Saturday split-flap clock */
      #clock { position: absolute; left: 70px; top: 150px; width: 380px; opacity: 0; }
      #day { font: 800 30px/1 Inter, sans-serif; letter-spacing: 0.3em; color: #fff; text-shadow: 0 3px 0 #16161f; margin-bottom: 12px; }
      #flap { position: relative; width: 380px; height: 120px; perspective: 600px; }
      .card { position: absolute; inset: 0; background: #1b1c24; border: 5px solid #16161f; border-radius: 14px; color: #ffe08a;
              font: 400 72px/110px Anton, sans-serif; text-align: center; letter-spacing: 0.04em; white-space: nowrap; transform-origin: 50% 0;
              box-shadow: inset 0 -55px 0 rgba(255, 255, 255, 0.04), 0 6px 0 #16161f; }
      .card::after { content: ''; position: absolute; left: 0; right: 0; top: 54px; height: 3px; background: #0a0a0e; }

      #grain { position: absolute; inset: -40px; opacity: 0; mix-blend-mode: overlay; pointer-events: none; }
      #vig { position: absolute; inset: 0; background: radial-gradient(ellipse 72% 68% at 50% 50%, transparent 55%, rgba(30, 14, 6, 0.55)); opacity: 0; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.87" data-width="1920" data-height="1080" data-fps="24">
      <div id="world" class="clip" data-start="0" data-duration="14.87" data-track-index="0">
        <div id="cam">
          <img id="room" src="assets/art/quest_bedroom_morning.png" />
          <div id="beam"></div>
          <div id="tvglow"></div>
          <div id="tv">
            <div id="tvbody"></div>
            <div id="screen"><div id="game"></div><img id="gameHero" src="assets/art/03_young_back.png" /><div id="scan"></div><div id="glass"></div></div>
            <div id="knobs"><i></i><i></i></div>
          </div>
          <img id="pixieB" src="assets/art/6c_kid_sitting.png" />
          <img id="quest" src="assets/art/06a_kid_playing_seated.png" />
          <img id="pixieA" src="assets/art/6b_kid_pointing.png" />
          <svg id="arrow" viewBox="0 0 1920 1080">
            <path id="arrowPath" d="M1115 520 C 1250 380, 1420 380, 1560 560" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" />
            <path id="arrowHead" d="M1528 548 L 1566 570 L 1572 526" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
          </svg>
          <div id="warm"></div>
          <div id="dust"></div>
        </div>
        <div id="polaroid"><div id="caption">Saturday afternoon · 1998</div></div>
      </div>
      <div id="phone" class="clip" data-start="0" data-duration="14.87" data-track-index="1"></div>
      <svg id="strike" class="clip" viewBox="0 0 270 340" data-start="0" data-duration="14.87" data-track-index="2">
        <ellipse id="ring" cx="135" cy="170" rx="120" ry="158" fill="none" stroke="#e8262b" stroke-width="16" stroke-linecap="round" transform="rotate(-8 135 170)" />
        <path id="slash" d="M40 300 L 232 36" fill="none" stroke="#e8262b" stroke-width="18" stroke-linecap="round" />
      </svg>
      <div id="clock" class="clip" data-start="0" data-duration="14.87" data-track-index="3">
        <div id="day">SATURDAY</div>
        <div id="flap"></div>
      </div>
      <div id="eq" class="clip" data-start="0" data-duration="14.87" data-track-index="4">
        <div class="chip" id="c0"><b></b><span>the game</span></div>
        <div class="plus" id="p1">+</div><div class="chip" id="c1"><b></b><span>the room</span></div>
        <div class="plus" id="p2">+</div><div class="chip" id="c2"><b></b><span>the TV</span></div>
        <div class="plus" id="p3">+</div><div class="chip" id="c3"><b></b><span>the friend</span></div>
        <div class="plus" id="p4">+</div><div class="chip" id="c4"><b></b><span>Saturday</span></div>
      </div>
      <canvas id="grain" class="clip" width="1000" height="580" data-start="0" data-duration="14.87" data-track-index="5"></canvas>
      <div id="vig" class="clip" data-start="0" data-duration="14.87" data-track-index="6"></div>
      <div id="flash" class="clip" data-start="0" data-duration="14.87" data-track-index="7"></div>
    </div>
    <script>
      // Cues (s from t = 0 = episode 34.32): "It is the game" 0.10 · "plus" 1.02 / "room" 2.16 · "Plus the television" 3.00 / 3.40 ·
      // "Plus the friend" 4.40 / 4.82 · "knew where to go" 5.78-6.54 · "Plus an entire Saturday afternoon" 7.32 / 8.26 / 8.80 ·
      // "nobody could reach you" 9.86-10.70 · "smartphones" 11.18 · "not yet ruined" 12.28-12.76 · "particular miracle" 13.46 / 13.92 ·
      // end of l16 14.42 · cut to block D (l17) 14.87.
      const tl = gsap.timeline({ paused: true });
      const cam = document.getElementById('cam');

      // ---- camera: a view centre (fx, fy) and a zoom (s); applied as one transform so the framing interpolates cleanly
      const C = { fx: 1670, fy: 610, s: 6.6 };   // starts inside the TV screen: the game fills the frame
      const applyCam = () => {
        // keep the frame inside the bedroom plate (no empty edges), except while still inside the TV screen
        const hx = 960 / C.s, hy = 540 / C.s, k = Math.min(1, Math.max(0, (4 - C.s) / 1.5));   // blend in the clamp as we leave the screen
        const fx = C.fx + k * (Math.min(1920 - hx, Math.max(hx, C.fx)) - C.fx), fy = C.fy + k * (Math.min(1080 - hy, Math.max(hy, C.fy)) - C.fy);
        cam.style.transform = `translate(${960 - fx * C.s}px, ${540 - fy * C.s}px) scale(${C.s})`;
      };

      // ---- seeded randomness (deterministic)
      let seed = 1998; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

      // ---- grain: a few noise frames drawn once; the visible one is picked from the time (seek-safe)
      const grain = document.getElementById('grain'), gx = grain.getContext('2d');
      const noise = Array.from({ length: 6 }, () => { const d = gx.createImageData(1000, 580); for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } return d; });
      const applyGrain = (t) => gx.putImageData(noise[Math.floor(t * 12) % noise.length], 0, 0);

      // ---- dust motes in the sunbeam (position = function of time)
      const dust = document.getElementById('dust');
      const motes = Array.from({ length: 26 }, () => { const m = document.createElement('div'); m.className = 'mote'; dust.appendChild(m);
        return { el: m, x: 560 + rnd() * 520, y: 120 + rnd() * 760, sp: 6 + rnd() * 14, ph: rnd() * 6.28, s: 0.5 + rnd() }; });
      const D = { on: 0 };
      const applyDust = (t) => motes.forEach((m) => {
        m.el.style.transform = `translate(${m.x + Math.sin(t * 0.7 + m.ph) * 24}px, ${m.y - t * m.sp}px) scale(${m.s})`;
        m.el.style.opacity = D.on * (0.35 + 0.35 * Math.sin(t * 2 + m.ph));
      });

      // ---- split-flap hours for "an entire Saturday afternoon"
      const hours = ['12:00', '1:00', '2:00', '3:00', '4:00', '5:00', '6:00'];
      const flap = document.getElementById('flap');
      hours.forEach((h, i) => { const c = document.createElement('div'); c.className = 'card'; c.id = 'h' + i; c.textContent = h + ' PM'; flap.appendChild(c); });

      // ================================================================ timeline
      // A. "It is the game..." : inside the CRT, the game fills the frame (scanlines, curvature, glass)
      tl.fromTo('#gameHero', { y: 0 }, { y: -10, duration: 1.0, ease: 'sine.inOut' }, 0);
      tl.fromTo('#c0', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.2, ease: 'back.out(2)' }, 0.55);
      tl.fromTo('#c0 b', { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: 'power2.out' }, 0.55);

      // B. "plus the room." : the camera pulls out of the screen into the childhood bedroom
      tl.to(C, { fx: 1240, fy: 560, s: 1.25, duration: 1.15, ease: 'power3.inOut' }, 1.0);
      tl.fromTo('#p1', { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: 'back.out(2)' }, 1.02);
      tl.fromTo('#c1', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.2, ease: 'back.out(2)' }, 2.12);
      tl.fromTo('#c1 b', { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: 'power2.out' }, 2.12);
      tl.to(C, { fx: 1150, fy: 560, s: 1.12, duration: 0.85, ease: 'sine.inOut' }, 2.15);
      tl.fromTo('#beam', { opacity: 0, rotation: 14 }, { opacity: 0.55, rotation: 10, duration: 1.6, ease: 'sine.out' }, 1.6);

      // C. "Plus the television." : push towards the TV, its light pulses onto the room
      tl.to(C, { fx: 1371, fy: 600, s: 1.75, duration: 0.7, ease: 'power2.inOut' }, 3.0);
      tl.fromTo('#tvglow', { opacity: 0 }, { opacity: 0.9, duration: 0.25 }, 3.35).to('#tvglow', { opacity: 0.55, duration: 0.5 }, 3.6);
      tl.fromTo('#p2', { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: 'back.out(2)' }, 3.0);
      tl.fromTo('#c2', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.2, ease: 'back.out(2)' }, 3.38);
      tl.fromTo('#c2 b', { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: 'power2.out' }, 3.38);

      // D. "Plus the friend who somehow knew where to go." : back out; the kids slide in (parallax), Pixie points, an arrow draws to the TV
      tl.to(C, { fx: 1000, fy: 560, s: 1.0, duration: 0.8, ease: 'power3.inOut' }, 4.3);
      tl.fromTo('#quest', { x: -420, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: 'power3.out' }, 4.35);
      tl.fromTo('#pixieA', { x: -260, y: 40, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.6, ease: 'back.out(1.4)' }, 4.75);
      tl.fromTo('#p3', { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: 'back.out(2)' }, 4.4);
      tl.fromTo('#c3', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.2, ease: 'back.out(2)' }, 4.8);
      tl.fromTo('#c3 b', { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: 'power2.out' }, 4.8);
      tl.fromTo('#arrowPath', { strokeDasharray: 620, strokeDashoffset: 620 }, { strokeDashoffset: 0, duration: 0.6, ease: 'power2.inOut' }, 5.78);
      tl.fromTo('#arrowHead', { opacity: 0 }, { opacity: 1, duration: 0.08 }, 6.36);
      tl.to('#tvglow', { opacity: 1, duration: 0.12 }, 6.45).to('#tvglow', { opacity: 0.55, duration: 0.2 }, 6.57);
      tl.to(['#arrowPath', '#arrowHead'], { opacity: 0, duration: 0.3 }, 7.0);

      // E. "Plus an entire Saturday afternoon..." : time passes - the clock flips 12 -> 6 PM, the light turns gold, Pixie sits down
      tl.fromTo('#p4', { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: 'back.out(2)' }, 7.32);
      tl.fromTo('#c4', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.2, ease: 'back.out(2)' }, 8.22);
      tl.fromTo('#c4 b', { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: 'power2.out' }, 8.22);
      tl.fromTo('#clock', { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out' }, 8.26);
      hours.forEach((h, i) => {
        const at = 8.3 + i * 0.42;
        tl.fromTo('#h' + i, { rotationX: i ? -95 : 0, opacity: i ? 0 : 1 }, { rotationX: 0, opacity: 1, duration: 0.22, ease: 'power2.in' }, i ? at : 8.26);
        if (i) tl.set('#h' + (i - 1), { opacity: 0 }, at + 0.22);   // the card underneath is gone once the new one lands
      });
      tl.fromTo('#warm', { opacity: 0 }, { opacity: 0.5, duration: 3.6, ease: 'sine.inOut' }, 8.3);
      tl.to('#beam', { rotation: -22, x: 380, opacity: 0.75, duration: 4.0, ease: 'sine.inOut' }, 8.3);
      tl.fromTo(D, { on: 0 }, { on: 1, duration: 1.0 }, 8.3);
      tl.to('#pixieA', { opacity: 0, duration: 0.35 }, 9.6);
      tl.fromTo('#pixieB', { opacity: 0 }, { opacity: 1, duration: 0.35 }, 9.6);
      tl.to(C, { fx: 960, fy: 560, s: 1.08, duration: 6.0, ease: 'none' }, 8.3);
      tl.fromTo('#vig', { opacity: 0 }, { opacity: 1, duration: 2.0 }, 8.3);
      tl.fromTo('#grain', { opacity: 0 }, { opacity: 0.16, duration: 2.0 }, 8.3);

      // "...because smartphones had not yet ruined..." : a phone slides in buzzing and gets struck out in red marker
      tl.fromTo('#phone', { opacity: 0, y: -260, rotation: 8 }, { opacity: 1, y: 0, rotation: 0, duration: 0.35, ease: 'back.out(1.6)' }, 11.1);
      tl.to('#phone', { keyframes: { rotation: [0, -6, 6, -6, 6, -4, 4, 0] }, duration: 0.6, ease: 'none' }, 11.45);
      tl.fromTo('#ring', { strokeDasharray: 900, strokeDashoffset: 900 }, { strokeDashoffset: 0, duration: 0.4, ease: 'power2.inOut' }, 12.28);
      tl.fromTo('#slash', { strokeDasharray: 340, strokeDashoffset: 340 }, { strokeDashoffset: 0, duration: 0.18, ease: 'power3.in' }, 12.7);
      tl.to(['#phone', '#strike'], { y: 900, rotation: 18, opacity: 0, duration: 0.5, ease: 'power2.in' }, 13.1);

      // F. "...that particular miracle." : the moment becomes a photo
      tl.to(['#eq', '#clock'], { opacity: 0, y: -30, duration: 0.35, ease: 'power1.in' }, 13.2);
      tl.fromTo('#flash', { opacity: 0 }, { opacity: 0.85, duration: 0.06 }, 13.88).to('#flash', { opacity: 0, duration: 0.45 }, 13.95);
      tl.fromTo('#polaroid', { opacity: 0 }, { opacity: 1, duration: 0.05 }, 13.9);
      tl.fromTo('#world', { scale: 1, rotation: 0 }, { scale: 0.86, rotation: -3, duration: 0.95, ease: 'power3.out' }, 13.9);

      tl.to({}, { duration: 0.01 }, 14.86);
      const update = () => { const t = tl.time(); applyCam(); applyDust(t); applyGrain(t); };
      tl.eventCallback('onUpdate', update);
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      tl.seek(0);
      update();
    </script>
  </body>
</html>
